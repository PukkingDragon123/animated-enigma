// ===========================================================================
//  THE DEEP — the skill tree as an underwater scene.
//  The otter is sinking, drowning, out of air. Every upgrade is a bubble of
//  air. When you buy one he lunges out, grabs it, and gets a gasp of life.
// ===========================================================================
const TreeScene = {
  bubbles: [], motes: [], kelp: [], grabs: [], pops: [],
  t: 0, built: false, breath: 1, lastGrab: 0, shake: 0,

  build() {
    if (this.built) return; this.built = true;
    const rng = new SeededRandom(9001);
    for (let i = 0; i < 90; i++) this.bubbles.push({
      x: rng.range(0, 640), y: rng.range(0, 360), r: rng.int(1, 4),
      s: rng.range(10, 34), ph: rng.range(0, TAU), w: rng.range(4, 14),
    });
    for (let i = 0; i < 130; i++) this.motes.push({
      x: rng.range(0, 640), y: rng.range(0, 360), s: rng.range(2, 9),
      ph: rng.range(0, TAU), b: rng.range(0.15, 0.5),
    });
    for (let i = 0; i < 22; i++) this.kelp.push({
      x: rng.range(-20, 660), h: rng.range(40, 130), w: rng.int(2, 5),
      ph: rng.range(0, TAU), sp: rng.range(0.5, 1.2), shade: rng.range(0, 1),
    });
    this.buildBubbleSprites();
  },

  // pre-rendered node bubbles: cheap to blit, crisp pixels
  buildBubbleSprites() {
    const mk = (R, body, rim, hi, inner) => {
      const D = R * 2 + 1, c = document.createElement('canvas');
      c.width = D; c.height = D; const x = c.getContext('2d');
      for (let yy = 0; yy < D; yy++) for (let xx = 0; xx < D; xx++) {
        const dx = xx - R, dy = yy - R, d = Math.sqrt(dx * dx + dy * dy);
        if (d > R) continue;
        if (d > R - 1.25) { x.fillStyle = rim; x.fillRect(xx, yy, 1, 1); continue; }
        if (d > R - 2.6) { x.fillStyle = body; x.fillRect(xx, yy, 1, 1); continue; }
        x.fillStyle = inner; x.fillRect(xx, yy, 1, 1);
      }
      // specular highlight, upper-left, like a real bubble
      x.fillStyle = hi;
      x.fillRect(R - Math.round(R * 0.55), R - Math.round(R * 0.62), 2, 2);
      x.fillRect(R - Math.round(R * 0.30), R - Math.round(R * 0.74), 2, 1);
      x.fillRect(R - Math.round(R * 0.72), R - Math.round(R * 0.32), 1, 2);
      return { c, w: D, h: D, ax: R, ay: R };
    };
    const R = 13;
    this.sprLocked    = mk(R, '#1b2a3c', '#24384f', '#33506e', '#122033');
    this.sprAvailable = mk(R, '#2f6f96', '#7fd4ee', '#dffaff', '#1d4a68');
    this.sprAfford    = mk(R, '#37879f', '#9ff0d8', '#ffffff', '#1f5a5f');
    this.sprOwned     = mk(R, '#c9962c', '#ffe48f', '#ffffff', '#8a6314');
    this.sprHover     = mk(R + 2, '#4ea3c6', '#ffffff', '#ffffff', '#2a6a8c');
  },

  // ---- the drowning otter ------------------------------------------------
  drawDrowningOtter(ctx, t) {
    const cx = 322, cy = 214;
    const sway = Math.sin(t * 0.8) * 7, rise = Math.sin(t * 0.55) * 5;
    const panic = clamp(1 - this.breath, 0, 1);            // more frantic as air runs out
    ctx.save();
    ctx.globalAlpha = 0.34;
    ctx.translate(Math.round(cx + sway), Math.round(cy + rise));
    ctx.scale(3.1, 3.1);
    ctx.rotate(Math.sin(t * 0.7) * 0.10 + 0.12);

    // flailing legs / tail
    ctx.save(); ctx.translate(-8, 5);
    ctx.rotate(2.3 + Math.sin(t * (3 + panic * 5)) * (0.35 + panic * 0.4));
    ctx.drawImage(CH.otterTail.c, -CH.otterTail.ax, -CH.otterTail.ay);
    ctx.restore();

    // torso
    ctx.drawImage(CH.otterTorso.c, -CH.otterTorso.ax, -CH.otterTorso.ay);

    // arms clawing at the water, out of phase so it looks like panic
    for (let i = 0; i < 2; i++) {
      const ph = t * (3.4 + panic * 4.5) + i * 2.1;
      ctx.save();
      ctx.translate(i ? 5 : -5, -2);
      ctx.rotate((i ? -1 : 1) * (1.1 + Math.sin(ph) * (0.6 + panic * 0.5)) + (i ? 0.4 : -0.4));
      ctx.drawImage(CH.otterArm.c, -CH.otterArm.ax, -CH.otterArm.ay);
      ctx.restore();
    }

    // head, screwed up in pain, lolling back
    ctx.save();
    ctx.translate(0, -9);
    ctx.rotate(Math.sin(t * 1.3) * 0.16 - 0.1);
    const head = otterHeadWithFace('drown', false, t, false);
    ctx.drawImage(head, -CH.otterHead.ax, -CH.otterHead.ay);
    ctx.restore();
    ctx.restore();

    // air escaping his mouth — the thing you are racing
    if (Math.random() < 0.35 + panic * 0.4) {
      this.pops.push({
        x: cx + sway + rand(4, 14), y: cy + rise - 28, r: rand(1, 3),
        vy: rand(-34, -16), vx: rand(-8, 8), life: rand(1.4, 2.6), max: 2.6, kind: 'breath',
      });
    }
  },

  // ---- a node has been bought: the otter lunges and grabs the bubble -----
  grab(node, x, y) {
    this.grabs.push({ x, y, t: 0, dur: 0.85, node });
    this.lastGrab = 0.9;
    this.breath = Math.min(1, this.breath + 0.34);
    this.shake = 6;
    for (let i = 0; i < 26; i++) {
      const a = rand(0, TAU), sp = rand(30, 150);
      this.pops.push({ x, y, r: randi(1, 3), vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rand(0.3, 0.8), max: 0.8, kind: 'pop' });
    }
  },

  update(dt, t) {
    this.build();
    this.t += dt;
    this.breath = Math.max(0, this.breath - dt * 0.035);
    this.lastGrab -= dt; this.shake = Math.max(0, this.shake - dt * 22);
    for (const b of this.bubbles) {
      b.y -= b.s * dt; b.ph += dt;
      if (b.y < -6) { b.y = 366; b.x = rand(0, 640); }
    }
    for (const m of this.motes) { m.y -= m.s * dt * 0.25; m.ph += dt * 0.7; if (m.y < -4) { m.y = 364; m.x = rand(0, 640); } }
    for (let i = this.pops.length - 1; i >= 0; i--) {
      const p = this.pops[i]; p.life -= dt;
      if (p.life <= 0) { this.pops.splice(i, 1); continue; }
      p.x += (p.vx || 0) * dt; p.y += p.vy * dt;
      if (p.kind === 'pop') { p.vx *= 0.93; p.vy *= 0.93; p.vy -= 22 * dt; }
      else p.x += Math.sin(p.life * 5) * 9 * dt;
    }
    for (let i = this.grabs.length - 1; i >= 0; i--) {
      const g = this.grabs[i]; g.t += dt; if (g.t > g.dur) this.grabs.splice(i, 1);
    }
  },

  // ---- background --------------------------------------------------------
  renderBackdrop(ctx, t) {
    // depth gradient, posterized into bands so it stays pixel art
    const bands = ['#0a1c30', '#0c2238', '#0e2842', '#11304e', '#143859', '#174065', '#1a4872'];
    for (let i = 0; i < bands.length; i++) {
      ctx.fillStyle = bands[bands.length - 1 - i];
      ctx.fillRect(0, Math.round(i * 360 / bands.length), 640, Math.ceil(360 / bands.length) + 1);
    }
    // god rays slanting down from the surface far above
    for (let i = 0; i < 7; i++) {
      const bx = ((i * 113 + Math.sin(t * 0.18 + i) * 26) % 760) - 60;
      const w = 16 + Math.sin(t * 0.3 + i * 2) * 7;
      ctx.fillStyle = `rgba(150,220,255,${(0.035 + Math.sin(t * 0.4 + i) * 0.018).toFixed(3)})`;
      ctx.beginPath();
      ctx.moveTo(bx, -10); ctx.lineTo(bx + w, -10);
      ctx.lineTo(bx + w * 3.2 + 40, 370); ctx.lineTo(bx + w * 2.2 + 10, 370);
      ctx.closePath(); ctx.fill();
    }
    // kelp silhouettes swaying on the seabed
    for (const k of this.kelp) {
      const segs = Math.round(k.h / 7);
      ctx.fillStyle = k.shade > 0.5 ? 'rgba(8,30,34,0.55)' : 'rgba(6,22,28,0.7)';
      for (let i = 0; i < segs; i++) {
        const f = i / segs;
        const off = Math.sin(t * k.sp + k.ph + f * 2.4) * (3 + f * 9);
        ctx.fillRect(Math.round(k.x + off), Math.round(360 - i * 7), k.w, 8);
      }
    }
    // drifting plankton
    for (const m of this.motes) {
      ctx.fillStyle = `rgba(190,230,255,${(m.b * (0.6 + Math.sin(m.ph) * 0.4)).toFixed(2)})`;
      ctx.fillRect(Math.round(m.x), Math.round(m.y), 1, 1);
    }
    // ambient bubbles rising
    for (const b of this.bubbles) {
      const x = Math.round(b.x + Math.sin(b.ph) * b.w), y = Math.round(b.y);
      ctx.strokeStyle = 'rgba(190,235,255,0.45)'; ctx.lineWidth = 1;
      if (b.r <= 1) ctx.fillStyle = 'rgba(190,235,255,0.5)', ctx.fillRect(x, y, 1, 1);
      else { ctx.beginPath(); ctx.arc(x, y, b.r, 0, TAU); ctx.stroke(); ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.fillRect(x - Math.round(b.r * 0.4), y - Math.round(b.r * 0.5), 1, 1); }
    }
  },

  // ---- foreground effects over the node layer ---------------------------
  renderFx(ctx, t) {
    // the grab: a paw shoots from the otter to the bubble, then it bursts
    for (const g of this.grabs) {
      const k = g.t / g.dur;
      const ox = 320, oy = 186;
      const reach = k < 0.42 ? k / 0.42 : 1;
      const back = k > 0.55 ? (k - 0.55) / 0.45 : 0;
      const hx = lerp(ox, g.x, reach * (1 - back));
      const hy = lerp(oy, g.y, reach * (1 - back));
      ctx.strokeStyle = `rgba(200,112,60,${(1 - back).toFixed(2)})`; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(Math.round(hx), Math.round(hy)); ctx.stroke();
      ctx.strokeStyle = `rgba(240,184,126,${(1 - back).toFixed(2)})`; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(ox, oy - 1); ctx.lineTo(Math.round(hx), Math.round(hy) - 1); ctx.stroke();
      // the paw
      ctx.save(); ctx.translate(Math.round(hx), Math.round(hy));
      ctx.rotate(angleTo(ox, oy, g.x, g.y));
      const grip = k > 0.42 ? 1 : 0;
      ctx.fillStyle = '#c8703c'; ctx.fillRect(-3, -4, 7, 8);
      ctx.fillStyle = '#1a1220'; ctx.fillRect(-3, -4, 7, 1); ctx.fillRect(-3, 3, 7, 1);
      ctx.fillStyle = grip ? '#f0b87e' : '#e0975c';
      ctx.fillRect(3, -4 + grip, 3, 3); ctx.fillRect(3, 1 - grip, 3, 3);
      ctx.restore();
      // burst at the moment of contact
      if (k > 0.40 && k < 0.62) {
        const bk = (k - 0.40) / 0.22;
        ctx.strokeStyle = `rgba(255,255,255,${(1 - bk).toFixed(2)})`; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(g.x, g.y, 8 + bk * 34, 0, TAU); ctx.stroke();
        ctx.strokeStyle = `rgba(255,228,143,${(1 - bk).toFixed(2)})`;
        ctx.beginPath(); ctx.arc(g.x, g.y, 4 + bk * 20, 0, TAU); ctx.stroke();
      }
    }
    // popped-air and breath particles
    for (const p of this.pops) {
      const a = Math.min(1, p.life / p.max * 1.6);
      const x = Math.round(p.x), y = Math.round(p.y);
      if (p.r <= 1) { ctx.fillStyle = `rgba(220,245,255,${a.toFixed(2)})`; ctx.fillRect(x, y, 1, 1); }
      else { ctx.strokeStyle = `rgba(220,245,255,${a.toFixed(2)})`; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(x, y, p.r, 0, TAU); ctx.stroke(); }
    }
    // he gasps when you feed him air
    if (this.lastGrab > 0) {
      const a = Math.min(1, this.lastGrab * 1.4);
      ctx.fillStyle = `rgba(160,240,255,${(a * 0.13).toFixed(2)})`;
      ctx.fillRect(0, 0, 640, 360);
    }
  },

  // how much air he has left — pure flavour, drives the panic animation
  renderBreath(ctx) {
    const w = 120, x = 320 - w / 2, y = 344;
    ctx.fillStyle = 'rgba(4,12,24,0.75)'; ctx.fillRect(x - 2, y - 2, w + 4, 8);
    ctx.fillStyle = '#0d2a3e'; ctx.fillRect(x, y, w, 4);
    const k = clamp(this.breath, 0, 1);
    ctx.fillStyle = k > 0.5 ? '#7fd4ee' : k > 0.25 ? '#ffe48f' : '#ff6161';
    ctx.fillRect(x, y, Math.round(w * k), 4);
    pixelText(ctx, 'AIR', x - 6, y - 1, 6, '#9fd8ee', 'right');
  },
};

    if (p.slowed > 0) pixelTextOutlined(ctx, 'NETTED! ROLL TO BREAK FREE', 320, 296, 7, '#6fd88e', '#14141c', 'center');
  },

  // ------------------------------------------------------------- Skill tree
  nodeXY(node) {
    const bi = BRANCHES.findIndex(b => b.id === node.branch);
    const px = 4 + bi * 158;
    return { x: px + 31 + node.pos[0] * 46, y: 68 + node.pos[1] * 33 };
  },
  updateTree() {
    const m = Input.mouse; this.hover = null;
    for (const n of SKILL_NODES) { const { x, y } = this.nodeXY(n); if (Math.abs(m.x - x) <= 12 && Math.abs(m.y - y) <= 10) { this.hover = n; break; } }
    const tree = G.tree;
    if (this.hover) {
      const n = this.hover;
      if (m.clicked) {
        if (tree.has(n.id)) { if (n.weapon) { tree.primary = n.weapon; Audio_.buy(); } }
        else if (tree.buy(n)) { Audio_.buy(); G.player.refreshStats(); const q = this.nodeXY(n); TreeScene.grab(n, q.x, q.y); G.particles.text(G.player.x, G.player.y - 24, n.name + '!', '#6fd88e', 8); if (n.weapon) { tree.primary = n.weapon; } }
        else Audio_.deny();
      }
      if (m.rclicked && n.weapon && tree.has(n.id) && G.player.stats.sidearm) { tree.sidearm = tree.sidearm === n.weapon ? null : n.weapon; Audio_.buy(); }
    }
    // revolver is always available as a weapon: clicking the branch header equips it
    if (m.clicked && m.x > 4 && m.x < 158 && m.y > 300 && m.y < 316) { tree.primary = 'revolver'; Audio_.buy(); }
    if (m.rclicked && m.x > 4 && m.x < 158 && m.y > 300 && m.y < 316 && G.player.stats.sidearm) { tree.sidearm = tree.sidearm === 'revolver' ? null : 'revolver'; Audio_.buy(); }
  },
  drawTree(ctx, t) {
    TreeScene.build();
    const tree = G.tree;
    // ---- the deep: he is drowning, and every upgrade is a gulp of air
    TreeScene.renderBackdrop(ctx, t);
    TreeScene.drawDrowningOtter(ctx, t);

    // ---- connective strands between bubbles
    for (const n of SKILL_NODES) {
      const a = this.nodeXY(n);
      for (const rid of n.req) {
        const r = SKILL_BY_ID[rid]; if (!r || r.branch !== n.branch) continue;
        const b = this.nodeXY(r);
        const on = tree.has(rid), both = on && tree.has(n.id);
        ctx.strokeStyle = both ? 'rgba(255,228,143,0.55)' : on ? 'rgba(150,215,240,0.35)' : 'rgba(60,90,120,0.28)';
        ctx.lineWidth = 1;
        const mid = (b.y + a.y) / 2;
        const wob = Math.sin(t * 1.4 + a.x * 0.05) * 1.5;
        ctx.beginPath();
        ctx.moveTo(b.x, b.y + 11); ctx.lineTo(b.x + wob, mid); ctx.lineTo(a.x - wob, mid); ctx.lineTo(a.x, a.y - 11);
        ctx.stroke();
      }
    }

    // ---- branch headers, floating like signage in the current
    BRANCHES.forEach((b, bi) => {
      const px0 = 4 + bi * 158;
      ctx.fillStyle = 'rgba(8,24,42,0.45)'; ctx.fillRect(px0, 30, 154, 22);
      ctx.fillStyle = b.color; ctx.fillRect(px0, 30, 154, 1); ctx.fillRect(px0, 51, 154, 1);
      drawSprite(ctx, SP[b.icon], px0 + 4, 34);
      pixelText(ctx, b.name, px0 + 14, 33, 8, b.color);
      pixelText(ctx, fitLabel(b.blurb, 146, 5), px0 + 6, 43, 5, '#9dc3d8');
    });

    // ---- nodes as air bubbles
    for (const n of SKILL_NODES) {
      const base = this.nodeXY(n);
      const owned = tree.has(n.id), avail = tree.available(n), afford = tree.canAfford(n);
      const hover = this.hover === n;
      // bubbles drift
      const ph = n.pos[0] * 1.7 + n.pos[1] * 0.9 + n.branch.length;
      const x = Math.round(base.x + Math.sin(t * 0.9 + ph) * 1.6);
      const y = Math.round(base.y + Math.cos(t * 1.15 + ph) * 1.8);
      const spr = owned ? TreeScene.sprOwned : !avail ? TreeScene.sprLocked : afford ? TreeScene.sprAfford : TreeScene.sprAvailable;
      if (hover) ctx.drawImage(TreeScene.sprHover.c, x - TreeScene.sprHover.ax, y - TreeScene.sprHover.ay);
      ctx.drawImage(spr.c, x - spr.ax, y - spr.ay);
      // a ready bubble shimmers
      if (avail && afford && !owned) {
        ctx.strokeStyle = `rgba(190,255,235,${(0.35 + Math.sin(t * 5 + ph) * 0.3).toFixed(2)})`;
        ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(x, y, 15 + Math.sin(t * 5 + ph), 0, TAU); ctx.stroke();
      }
      // icon inside the bubble
      ctx.globalAlpha = avail || owned ? 1 : 0.4;
      if (n.weapon) { const g = SP.guns[n.weapon]; ctx.drawImage(g.c, Math.round(x - g.w / 2), Math.round(y - g.h / 2)); }
      else { const gl = GLYPH_SP[NODE_ICON[n.id] || 'ability']; drawSprite(ctx, gl, x, y); }
      ctx.globalAlpha = 1;
      if (n.weapon && owned) {
        if (tree.primary === n.weapon) pixelText(ctx, 'P', x + 9, y - 12, 6, '#fff');
        if (tree.sidearm === n.weapon) pixelText(ctx, 'S', x + 9, y - 12, 6, '#ffe48f');
      }
      pixelTextOutlined(ctx, fitLabel(n.name, 42, 5), x, y + 13, 5,
        owned ? '#ffe9b0' : avail ? '#cfe9f5' : '#6d8598', '#08131f', 'center');
    }

    TreeScene.renderFx(ctx, t);

    // ---- header
    ctx.fillStyle = 'rgba(4,14,26,0.72)'; ctx.fillRect(0, 0, 640, 28);
    pixelText(ctx, 'THE DEEP', 8, 4, 12, '#ffe48f');
    pixelText(ctx, 'He is out of air. Every upgrade is a bubble of air. Reach out and take it.', 8, 18, 6, '#9fd8ee');
    SCRAP_TYPES.forEach((k, i) => {
      const x = 390 + i * 46;
      drawSprite(ctx, SP.scrap[k], x + 4, 11); pixelText(ctx, tree.scrap[k] + '', x + 11, 6, 9, SCRAP_COLORS[k]);
    });
    pixelText(ctx, '[TAB] / [ESC] surface', 634, 18, 6, '#9fd8ee', 'right');

    TreeScene.renderBreath(ctx);

    // ---- tooltip
    const n = this.hover;
    ctx.fillStyle = 'rgba(2,10,20,0.85)'; ctx.fillRect(0, 306, 640, 34);
    ctx.fillStyle = 'rgba(127,212,238,0.5)'; ctx.fillRect(0, 306, 640, 1);
    if (n) {
      const owned = tree.has(n.id), avail = tree.available(n);
      pixelText(ctx, n.name, 8, 309, 9, BRANCHES.find(b => b.id === n.branch).color);
      const lines = wrapText(ctx, n.desc, 400, 6);
      lines.slice(0, 2).forEach((l, i) => pixelText(ctx, l, 8, 320 + i * 9, 6, '#dceef7'));
      let cx = 430;
      pixelText(ctx, 'COST', cx, 309, 6, '#9fd8ee'); cx += 26;
      for (const k in n.cost) {
        drawSprite(ctx, SP.scrap[k], cx + 4, 313);
        pixelText(ctx, n.cost[k] + '', cx + 10, 309, 8, owned ? '#7a8c98' : tree.scrap[k] >= n.cost[k] ? '#9ff0d8' : '#ff6161');
        cx += 30;
      }
      const status = owned ? (n.weapon ? 'TAKEN - click to equip, right-click for sidearm' : 'TAKEN')
        : !avail ? 'OUT OF REACH - needs ' + n.req.map(r => SKILL_BY_ID[r].name).join(n.reqAny ? ' or ' : ' + ')
        : tree.canAfford(n) ? 'CLICK TO GRAB IT' : 'NOT ENOUGH SCRAP';
      pixelText(ctx, status, 430, 328, 6, owned ? '#ffe48f' : !avail ? '#ff6161' : tree.canAfford(n) ? '#9ff0d8' : '#ff6161');
    } else {
      pixelText(ctx, 'Hover a bubble to inspect it.', 8, 310, 6, '#9fd8ee');
      pixelText(ctx, 'Scrap: dinghies=wood  harpooners/gunboats=metal  speedboats/jetskis=fuel', 8, 320, 5, '#7fb8cf');
      pixelText(ctx, 'skiffs=powder  netters/trawlers=electronics', 8, 328, 5, '#7fb8cf');
      pixelText(ctx, `Sunk ${G.stats.kills}   Absorbs ${G.stats.absorbs}   Scrap ${G.stats.scrapCollected}   Taken ${tree.unlocked.size}/${SKILL_NODES.length}   (paused)`, 380, 328, 5, '#9fd8ee');
    }
  },
};

/* ===== src/mobile.js ===== */
// ---- MobileUI: full touch control layer ----------------------------------
// Left  : a pixel-art SHIP'S WHEEL (helm) you drag to steer the manatee.
// Right : ornate pixel-art action buttons with cooldown rings / charges / meters.
// Everything is generated procedurally as chunky pixel art -- no images,
// no gradients, integer coordinates only.
//
//   MobileUI.init(canvas)     attach pointer/touch listeners (canvas defaults to #screen)
//   MobileUI.enabled          bool - auto true on touch devices, or ?touch=1 / localStorage.mvb_touch
//   MobileUI.setEnabled(on)   manual toggle (on a desktop this also lets the mouse drive the pad)
//   MobileUI.update(dt, t)    advance the helm spring and the button animations, read live G state
//   MobileUI.render(ctx, t)   draw the whole layer into the 640x360 context
//   MobileUI.axis()           -> {x, y}   analog movement, magnitude <= 1
//   MobileUI.held(name)       name in 'fire','shield','roll','rampage','dive','decoy','tidal'
//   MobileUI.pressed(name)    true only on the frame the button was first pressed
//   MobileUI.endFrame()       clear the per-frame 'pressed' latches (call once per frame, last)
//   MobileUI.aimAt()          -> {x, y} in 640x360 CANVAS space (add G.cam for world), or null
//   MobileUI.consumedTouch(x, y) -> bool, a control owns that canvas point

// ============================ pixel helpers ================================
function mbHex(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function mbRamp(a) { return a.map(mbHex); }
function mbPick(ramp, v) { const i = Math.round(v * (ramp.length - 1)); return ramp[i >= ramp.length ? ramp.length - 1 : i >= 0 ? i : 0]; }
function mbBuf(w, h) { return { w, h, d: new Uint8ClampedArray(w * h * 4) }; }
function mbSet(b, x, y, c, a) {
  x |= 0; y |= 0; if (x < 0 || y < 0 || x >= b.w || y >= b.h) return;
  const i = (y * b.w + x) * 4;
  b.d[i] = c[0]; b.d[i + 1] = c[1]; b.d[i + 2] = c[2]; b.d[i + 3] = a === undefined ? 255 : a;
}
function mbOutline(b, col, a) {
  const src = b.d.slice(), w = b.w, h = b.h;
  const A = (x, y) => (x < 0 || y < 0 || x >= w || y >= h) ? 0 : src[(y * w + x) * 4 + 3];
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    if (A(x, y) > 0) continue;
    if (A(x - 1, y) > 0 || A(x + 1, y) > 0 || A(x, y - 1) > 0 || A(x, y + 1) > 0) mbSet(b, x, y, col, a);
  }
}
function mbBake(b, ax, ay) {
  const c = document.createElement('canvas'); c.width = b.w; c.height = b.h;
  const ctx = c.getContext('2d');
  const img = ctx.createImageData(b.w, b.h); img.data.set(b.d); ctx.putImageData(img, 0, 0);
  return { c, w: b.w, h: b.h, ax: ax === undefined ? b.w / 2 : ax, ay: ay === undefined ? b.h / 2 : ay };
}
function mbAngDiff(a, b) { return ((b - a + Math.PI) % TAU + TAU) % TAU - Math.PI; }

// ============================ palettes =====================================
const MB_OUTLINE = mbHex('#0b0c13');
const MB_WOOD = mbRamp(['#241408', '#3a2210', '#523017', '#6d4120', '#8a5528', '#a86a32', '#c4843f', '#dda45c', '#f0c68d']);
const MB_ROPE = mbRamp(['#33260f', '#4e3a1a', '#6d5427', '#8c7034', '#ab8c45', '#c9a95e', '#e6c98a']);
const MB_BRASS = mbRamp(['#2b1f07', '#4d380e', '#705118', '#946c20', '#b88b2c', '#d6aa42', '#eec96c', '#fff0b4']);
const MB_FACE_A = mbHex('#0a1220');
const MB_FACE_B = mbHex('#152238');
const MB_GROOVE = mbHex('#05080f');

const MB_R_BRASS = mbRamp(['#3a2408', '#6b4713', '#9a6a1d', '#c08c28', '#dcae3f', '#f2cd6b', '#fff0b8']);
const MB_R_STEEL = mbRamp(['#161d2b', '#2c3a52', '#455a7a', '#5f7aa0', '#7f9ec4', '#a7c3e4', '#dceaff']);
const MB_R_GREEN = mbRamp(['#0d2a19', '#164a2c', '#1f6b3e', '#2b8f53', '#43b06c', '#6fd88e', '#b6f3c8']);
const MB_R_RED = mbRamp(['#340a0a', '#5c1212', '#87201c', '#b23328', '#d45434', '#f08040', '#ffc07a']);
const MB_R_BLUE = mbRamp(['#0b1c3a', '#12305f', '#1b4a8c', '#2b6bb8', '#458fd8', '#77b9f0', '#c6e6ff']);
const MB_R_GOLD = mbRamp(['#3a2c07', '#5f4a0d', '#8a6c15', '#b59021', '#d6b234', '#f0d35e', '#fff2ac']);
const MB_R_TEAL = mbRamp(['#062626', '#0c4342', '#116260', '#198583', '#25a8a2', '#4fd0c6', '#a6f0e8']);

// ============================ ship's wheel geometry ========================
const MB_ROUT = 29;        // rim outer radius
const MB_RIN = 22;         // rim inner radius
const MB_HUB = 8;          // brass hub radius
const MB_HTIP = 36;        // handle tip distance from the hub
const MB_WS = 83, MB_WC = 41;   // wheel sprite size / centre
const MB_WFRAMES = 24;     // frames covering one 45 degree sector (8 spokes => 8-fold symmetry)

function mbSpokeW(along) {
  const k = (along - MB_HUB) / (MB_RIN - MB_HUB);
  return 3.3 - 1.3 * (k < 0 ? 0 : k > 1 ? 1 : k);
}

function mbWheelFrame(ang) {
  const S = MB_WS, C = MB_WC, step = TAU / 8;
  const b = mbBuf(S, S);
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const dx = x - C, dy = y - C;
    const r = Math.sqrt(dx * dx + dy * dy);
    if (r > MB_HTIP + 4) continue;
    const th = Math.atan2(dy, dx) - ang;
    const n = Math.round(th / step);
    const da = th - n * step;
    const along = Math.cos(da) * r, lat = Math.abs(Math.sin(da) * r);
    const L = (-dx * 0.55 - dy * 0.83) / MB_ROUT;   // key light from the upper left
    let part = 0, arc = 0;
    if (r <= MB_HUB) part = 3;
    else if (r >= MB_RIN && r <= MB_ROUT) {
      part = 1;
      arc = (Math.abs(da) - step / 2) * r;          // distance along the rim from the mid-point between spokes
      if (Math.abs(arc) <= 3.4) part = 5;           // rope binding wrapped around the rim
    } else if (r < MB_RIN && along > MB_HUB - 3 && lat <= mbSpokeW(along)) part = 2;
    if (r > MB_ROUT - 4) {                           // handles stick out past the rim
      let isH = false;
      if (along >= MB_ROUT - 4 && along <= MB_HTIP && lat <= 2.5) isH = true;
      if (!isH) {
        const sa = n * step + ang;
        const tx = Math.cos(sa) * MB_HTIP, ty = Math.sin(sa) * MB_HTIP;
        if ((dx - tx) * (dx - tx) + (dy - ty) * (dy - ty) <= 10.2) isH = true;
        else {
          const bx = Math.cos(sa) * (MB_ROUT - 1), by = Math.sin(sa) * (MB_ROUT - 1);
          if ((dx - bx) * (dx - bx) + (dy - by) * (dy - by) <= 11.5) isH = true;
        }
      }
      if (isH) part = 4;
    }
    if (!part) continue;
    let col, v;
    switch (part) {
      case 1: {  // wooden rim, rounded cross-section + grain that turns with the wheel
        const u = (r - MB_RIN) / (MB_ROUT - MB_RIN);
        v = 0.53 + (0.34 - Math.abs(u - 0.40)) * 1.15 + L * 0.38;
        if (Math.sin(th * 40) > 0.55) v -= 0.11;
        if (u < 0.12 || u > 0.90) v -= 0.26;
        col = mbPick(MB_WOOD, v); break;
      }
      case 2: {  // spoke: cylindrical shading across its width
        const u = lat / mbSpokeW(along);
        v = 0.46 + (1 - u * u) * 0.38 + L * 0.26;
        if (along > MB_RIN - 3) v -= 0.12;
        if (along < MB_HUB + 2) v -= 0.08;
        col = mbPick(MB_WOOD, v); break;
      }
      case 3: {  // brass hub with turned rings and spoke bolts
        v = 0.52 + L * 0.34 + ((Math.floor(r * 1.15) & 1) ? 0.09 : -0.07);
        if (r > MB_HUB - 1.3) v -= 0.38;
        if (r < 2.3) v = 0.86;
        if (lat < 1.6 && Math.abs(along - 5.4) < 1.6) v = 0.95;
        col = mbPick(MB_BRASS, v); break;
      }
      case 4: {  // handle
        const u = lat / 2.9;
        v = 0.54 + (1 - u * u) * 0.30 + L * 0.28;
        if (along > MB_HTIP - 2.5) v -= 0.10;
        if (Math.abs(along - (MB_ROUT + 1.5)) < 1.2) v -= 0.26;   // collar where it meets the rim
        col = mbPick(MB_WOOD, v); break;
      }
      default: { // rope binding
        const u = (r - MB_RIN) / (MB_ROUT - MB_RIN);
        v = 0.46 + (0.32 - Math.abs(u - 0.40)) * 0.8 + L * 0.26;
        v += (Math.floor(Math.abs(arc) / 1.8) & 1) ? 0.24 : -0.14;
        col = mbPick(MB_ROPE, v); break;
      }
    }
    mbSet(b, x, y, col, 255);
  }
  mbOutline(b, MB_OUTLINE, 255);
  return mbBake(b, C, C);
}

function mbBasePlate(R) {
  const S = R * 2 + 5, C = R + 2, b = mbBuf(S, S);
  const dark = mbHex('#080e1a'), dith = mbHex('#132139');
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const dx = x - C, dy = y - C, r = Math.sqrt(dx * dx + dy * dy);
    if (r > R) continue;
    let col, a;
    if (r > R - 1.3) { col = MB_OUTLINE; a = 215; }
    else if (r > R - 5.5) {
      const th = Math.atan2(dy, dx);
      const da = Math.abs(mbAngDiff(th, Math.round(th / (TAU / 16)) * (TAU / 16))) * r;
      const big = Math.abs(mbAngDiff(th, Math.round(th / (TAU / 4)) * (TAU / 4))) * r < 2.0;
      col = (da < 1.6 || big) ? mbPick(MB_BRASS, big ? 1 : 0.9) : mbPick(MB_BRASS, 0.34 + (-dx - dy) / (R * 2.6));
      a = 235;
    } else if (r > R - 7) { col = MB_GROOVE; a = 210; }
    else { col = ((x + y) & 3) === 0 ? dith : dark; a = 140; }
    mbSet(b, x, y, col, a);
  }
  // four mounting bolts
  for (let i = 0; i < 4; i++) {
    const a = Math.PI / 4 + i * Math.PI / 2;
    const rx = Math.round(C + Math.cos(a) * (R - 2.6)), ry = Math.round(C + Math.sin(a) * (R - 2.6));
    mbSet(b, rx, ry, mbPick(MB_BRASS, 1), 255); mbSet(b, rx + 1, ry, mbPick(MB_BRASS, 0.7), 255);
    mbSet(b, rx, ry + 1, mbPick(MB_BRASS, 0.35), 255); mbSet(b, rx + 1, ry + 1, MB_OUTLINE, 255);
  }
  mbOutline(b, MB_OUTLINE, 205);
  return mbBake(b, C, C);
}

// ============================ ornate button plate ==========================
function mbPlate(r, ramp, pressed) {
  const S = r * 2 + 5, C = r + 2, b = mbBuf(S, S);
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const dx = x - C, dy = y - C, ax = Math.abs(dx), ay = Math.abs(dy);
    let d = Math.max(ax, ay, (ax + ay) * 0.74);
    if (ay < 3.2 && ax <= r + 2) d = Math.min(d, ax - 2);   // ornate ears, N/S/E/W
    if (ax < 3.2 && ay <= r + 2) d = Math.min(d, ay - 2);
    if (d > r) continue;
    const L = (-dx - dy) / (r * 1.9);
    let col, a = 240;
    if (d > r - 1.3) { col = MB_OUTLINE; }
    else if (d > r - 4.0) { col = mbPick(ramp, 0.48 + (pressed ? -L : L) * 0.85); }
    else if (d > r - 5.4) { col = MB_GROOVE; a = 228; }
    else if (d > r - 6.6) { col = mbPick(ramp, pressed ? 0.12 : 0.30); a = 228; }   // inner ring ornament
    else {
      col = (((x + y) & 3) === 0 || ((x - y) & 7) === 0) ? MB_FACE_B : MB_FACE_A;
      a = pressed ? 220 : 192;
    }
    mbSet(b, x, y, col, a);
  }
  for (let i = 0; i < 4; i++) {            // corner rivets
    const an = Math.PI / 4 + i * Math.PI / 2;
    const rx = Math.round(C + Math.cos(an) * (r - 2.6)), ry = Math.round(C + Math.sin(an) * (r - 2.6));
    mbSet(b, rx, ry, mbPick(ramp, 1), 255); mbSet(b, rx + 1, ry, mbPick(ramp, 0.7), 255);
    mbSet(b, rx, ry + 1, mbPick(ramp, 0.3), 255); mbSet(b, rx + 1, ry + 1, MB_OUTLINE, 255);
  }
  mbOutline(b, MB_OUTLINE, 240);
  return mbBake(b, C, C);
}


// A circular "barrel roll" arrow, generated in pixel space so every angle stays crisp.
function mbRollIcon() {
  const S = 19, C = 9, b = mbBuf(S, S);
  const RAMP = mbRamp(['#0f3a22', '#1f6b3e', '#2b8f53', '#43b06c', '#6fd88e', '#b6f3c8']);
  const gapA = -1.48, gapB = -0.10;          // the arc is open across the upper right
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const dx = x - C, dy = y - C, r = Math.sqrt(dx * dx + dy * dy);
    const th = Math.atan2(dy, dx);
    const L = (-dx * 0.6 - dy * 0.8) / 9;
    let v = -1;
    if (r >= 4.5 && r <= 8.3 && !(th > gapA && th < gapB)) {
      v = 0.46 + (1 - Math.abs(r - 6.4) / 1.9) * 0.34 + L * 0.26;
    }
    // arrowhead: sits at the top end of the arc and points clockwise (to the right)
    const hx = dx - (-2.0), hy = dy - (-6.4);
    if (hx >= 0 && hx <= 6.5 && Math.abs(hy) <= 4.6 * (1 - hx / 6.5)) v = Math.max(v, 0.74 + L * 0.2);
    if (v < 0) continue;
    mbSet(b, x, y, mbPick(RAMP, v), 255);
  }
  mbOutline(b, MB_OUTLINE, 255);
  return mbBake(b, C, C);
}

const MB_WX = 58, MB_WY = 282;      // helm centre on the 640x360 canvas
const MB_WGRAB = 58;                // radius of the "grab the helm" zone
const MB_WMAX = 40;                 // drag distance that means full throttle
const MB_WDEAD = 5;                 // dead zone

const MobileUI = {
  enabled: false, forced: false, mouseOk: false, ready: false,
  canvas: null, art: null,
  touches: new Map(),
  wheel: { ang: 0, vel: 0, active: false, id: null, dx: 0, dy: 0, mag: 0, dragAng: 0, grabT: 0, kick: 0 },
  buttons: {}, order: [],
  _axis: { x: 0, y: 0 },
  t: 0,

  // ---------------------------------------------------------------- setup
  init(canvas) {
    this.canvas = canvas || document.getElementById('screen');
    this.buttons = {}; this.order = [];          // safe to call init() more than once
    for (const def of MB_BUTTONS) {
      const b = Object.assign({}, def, {
        down: false, latch: false, id: null, press: 0, flash: 0, glow: 0,
        visible: true, dragX: 0, dragY: 0, dragLen: 0,
        frac: 1, ready: true, active: 0, charges: 0, maxCharges: 1, meter: 0,
      });
      this.buttons[def.name] = b; this.order.push(b);
    }
    const touch = (typeof window !== 'undefined') &&
      (('ontouchstart' in window) || (navigator && navigator.maxTouchPoints > 0));
    let force = false;
    try { force = /(\?|&)(touch|mobile)=1/.test(location.search) || localStorage.getItem('mvb_touch') === '1'; } catch (e) { }
    this.forced = force;
    this.attach();
    this.setEnabled(!!(touch || force));
    return this;
  },

  setEnabled(on) {
    on = !!on;
    if (on === this.enabled) { if (on) this.applyPageCss(true); return; }
    this.enabled = on;
    if (!on) { this.releaseAll(); this.applyPageCss(false); }
    else { this.mouseOk = !(('ontouchstart' in window) || (navigator && navigator.maxTouchPoints > 0)); this.applyPageCss(true); this.ensureArt(); }
  },

  applyPageCss(on) {
    if (typeof document === 'undefined') return;
    let st = document.getElementById('mb-touch-css');
    if (!on) { if (st) st.remove(); if (this.canvas) this.canvas.style.touchAction = ''; return; }
    if (this.canvas) this.canvas.style.touchAction = 'none';
    if (st) return;
    st = document.createElement('style'); st.id = 'mb-touch-css';
    st.textContent = 'html,body{overscroll-behavior:none;touch-action:manipulation;' +
      '-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}' +
      'canvas{touch-action:none}';
    (document.head || document.documentElement).appendChild(st);
  },

  // ------------------------------------------------------------- art bake
  ensureArt() {
    if (this.art) return this.art;
    const frames = [], shadows = [];
    for (let i = 0; i < MB_WFRAMES; i++) {
      const f = mbWheelFrame(i / MB_WFRAMES * (TAU / 8));
      frames.push(f); shadows.push(tintSprite(f, '#000000', 1));
    }
    const icons = {}, iconsOff = {};
    for (const k in MB_ICONS) icons[k] = makeSprite(MB_ICONS[k]);
    icons.roll = mbRollIcon();
    for (const k in icons) iconsOff[k] = tintSprite(icons[k], '#2a323e', 0.78);
    const plates = {};
    for (const b of this.order) {
      const p = mbPlate(b.r, b.ramp, false);
      plates[b.name] = {
        up: p, down: mbPlate(b.r, b.ramp, true),
        off: tintSprite(p, '#222a36', 0.66),
        hot: tintSprite(p, '#ffffff', 0.42),
        act: tintSprite(p, b.tint, 0.55),
      };
    }
    this.art = {
      frames, shadows, icons, iconsOff, plates,
      base: mbBasePlate(45),
      king: makeSprite([
        '..kkkkkkkkk..',
        '.kMqrrrrrqMk.',
        'kMYqrRRRrqYMk',
        'kMYqRRwwRRqYk',
        'kMYqrRRRrqYMk',
        '.kMqrrrrrqMk.',
        '..kkkkkkkkk..',
      ], { ax: 6, ay: 3 }),
      knob: makeSprite(['.kkk.', 'kYwYk', 'kYyYk', 'kyyyk', '.kkk.'], { ax: 2, ay: 2 }),
    };
    this.ready = true;
    return this.art;
  },

  // -------------------------------------------------------------- events
  attach() {
    if (this._attached || !this.canvas) return;
    this._attached = true;
    const c = this.canvas;
    const usePointer = typeof window !== 'undefined' && !!window.PointerEvent;
    if (usePointer) {
      c.addEventListener('pointerdown', e => this.onDown(e, e.pointerId, e.clientX, e.clientY, e), { passive: false });
      c.addEventListener('pointermove', e => this.onMove(e, e.pointerId, e.clientX, e.clientY), { passive: false });
      const up = e => this.onUp(e, e.pointerId);
      c.addEventListener('pointerup', up, { passive: false });
      c.addEventListener('pointercancel', up, { passive: false });
      window.addEventListener('pointerup', up, { passive: false });
    } else {
      c.addEventListener('touchstart', e => {
        for (let i = 0; i < e.changedTouches.length; i++) { const t = e.changedTouches[i]; this.onDown(e, t.identifier, t.clientX, t.clientY, null); }
      }, { passive: false });
      c.addEventListener('touchmove', e => {
        for (let i = 0; i < e.changedTouches.length; i++) { const t = e.changedTouches[i]; this.onMove(e, t.identifier, t.clientX, t.clientY); }
        if (this.enabled) e.preventDefault();
      }, { passive: false });
      const end = e => { for (let i = 0; i < e.changedTouches.length; i++) this.onUp(e, e.changedTouches[i].identifier); };
      c.addEventListener('touchend', end, { passive: false });
      c.addEventListener('touchcancel', end, { passive: false });
    }
    c.addEventListener('dblclick', e => { if (this.enabled) e.preventDefault(); });
    window.addEventListener('gesturestart', e => { if (this.enabled) e.preventDefault(); });
    window.addEventListener('gesturechange', e => { if (this.enabled) e.preventDefault(); });
    window.addEventListener('blur', () => this.releaseAll());
  },

  accepts(e) {
    if (!this.enabled) return false;
    if (e && e.pointerType === 'mouse' && !this.mouseOk && !this.forced) return false;
    return true;
  },

  toCanvas(cx, cy) {
    const c = this.canvas;
    if (!c) return { x: cx, y: cy };
    const r = c.getBoundingClientRect();
    return { x: (cx - r.left) / (r.width || 1) * c.width, y: (cy - r.top) / (r.height || 1) * c.height };
  },

  onDown(e, id, cx, cy, pe) {
    if (!this.accepts(e)) return;
    this.ensureArt();
    if (typeof Audio_ !== 'undefined') { Audio_.init(); Audio_.resume(); }
    const p = this.toCanvas(cx, cy);
    let owner = null;
    // the helm first: it owns the whole bottom-left corner
    const w = this.wheel;
    const inHelm = dist(p.x, p.y, MB_WX, MB_WY) <= MB_WGRAB;
    if (inHelm && w.id === null) {
      owner = 'wheel'; w.id = id; w.active = true; w.grabT = 0; w.kick = 1;
      this.dragWheel(p.x, p.y);
    } else if (inHelm) {
      owner = 'helm-busy';            // swallowed: the helm already has a finger on it
    } else {
      const b = this.pickButton(p.x, p.y);
      if (b && b.id === null) {
        owner = b.name; b.id = id; b.down = true; b.latch = true; b.press = 1;
        b.dragX = 0; b.dragY = 0; b.dragLen = 0;
        if (typeof Audio_ !== 'undefined') Audio_.tone(b.ready ? 520 : 200, 0.04, 'square', 0.08);
      }
    }
    this.touches.set(id, { x: p.x, y: p.y, owner });
    if (owner !== null) {
      if (e && e.cancelable) e.preventDefault();
      if (e && e.stopPropagation) e.stopPropagation();
      try { if (pe && this.canvas.setPointerCapture) this.canvas.setPointerCapture(id); } catch (err) { }
    }
  },

  onMove(e, id, cx, cy) {
    if (!this.enabled) return;
    const t = this.touches.get(id); if (!t) return;
    const p = this.toCanvas(cx, cy);
    t.x = p.x; t.y = p.y;
    if (t.owner === 'wheel') { this.dragWheel(p.x, p.y); if (e && e.cancelable) e.preventDefault(); }
    else if (t.owner) {
      const b = this.buttons[t.owner];
      if (b) {
        b.dragX = p.x - b.x; b.dragY = p.y - b.y; b.dragLen = Math.hypot(b.dragX, b.dragY);
        if (b.dragLen > b.r * 2.1) { b.down = false; b.id = null; t.owner = null; }   // slid off, let go
      }
      if (e && e.cancelable) e.preventDefault();
    }
  },

  onUp(e, id) {
    const t = this.touches.get(id); if (!t) return;
    this.touches.delete(id);
    if (t.owner === 'wheel') { const w = this.wheel; w.active = false; w.id = null; w.dx = 0; w.dy = 0; w.mag = 0; }
    else if (t.owner) { const b = this.buttons[t.owner]; if (b) { b.down = false; b.id = null; b.dragLen = 0; } }
    try { if (this.canvas && this.canvas.releasePointerCapture) this.canvas.releasePointerCapture(id); } catch (err) { }
    if (t.owner !== null && e && e.cancelable) e.preventDefault();
  },

  releaseAll() {
    this.touches.clear();
    const w = this.wheel; w.active = false; w.id = null; w.dx = 0; w.dy = 0; w.mag = 0;
    for (const b of this.order) { b.down = false; b.id = null; b.dragLen = 0; }
  },

  pickButton(x, y) {
    let best = null, bd = 1e9;
    for (const b of this.order) {
      if (!b.visible) continue;
      const d = Math.hypot(x - b.x, y - b.y);
      if (d <= b.r + 5 && d < bd) { bd = d; best = b; }
    }
    return best;
  },

  dragWheel(x, y) {
    const w = this.wheel;
    let dx = x - MB_WX, dy = y - MB_WY;
    const d = Math.hypot(dx, dy);
    if (d > MB_WMAX) { dx = dx / d * MB_WMAX; dy = dy / d * MB_WMAX; }
    w.dx = dx; w.dy = dy;
    const len = Math.hypot(dx, dy);
    if (len > MB_WDEAD) { w.dragAng = Math.atan2(dy, dx); w.mag = clamp((len - MB_WDEAD) / (MB_WMAX - MB_WDEAD), 0, 1); }
    else w.mag = 0;
  },

  // -------------------------------------------------------------- update
  update(dt, t) {
    if (!this.enabled) return;
    this.ensureArt();
    if (!(dt > 0)) dt = 1 / 60;
    if (dt > 0.1) dt = 0.1;
    this.t = t || (this.t + dt);
    this.updateWheel(dt);
    this.pollState();
    for (const b of this.order) {
      b.press = Math.max(0, b.press - dt * 6);
      b.flash = Math.max(0, b.flash - dt * 2.2);
      b.glow = lerp(b.glow, (b.ready && b.visible) ? 1 : 0, 1 - Math.pow(0.005, dt));
    }
  },

  updateWheel(dt) {
    const w = this.wheel;
    w.kick = Math.max(0, w.kick - dt * 3);
    let target = 0;
    if (w.active && w.mag > 0) {
      const want = mbAngDiff(0, w.dragAng + Math.PI / 2);   // "push up" = helm upright
      target = want * (0.30 + 0.70 * w.mag);
      w.grabT += dt;
    }
    const k = w.active ? 230 : 135, damp = w.active ? 18 : 6.2;
    w.vel += (target - w.ang) * k * dt;
    w.vel -= w.vel * Math.min(0.9, damp * dt);
    w.ang += w.vel * dt;
    if (w.ang > 4.4) { w.ang = 4.4; w.vel *= -0.3; }
    if (w.ang < -4.4) { w.ang = -4.4; w.vel *= -0.3; }
    if (w.vel > 26) w.vel = 26; if (w.vel < -26) w.vel = -26;
    if (!w.active) {
      this._axis.x = 0; this._axis.y = 0;
    } else {
      this._axis.x = Math.cos(w.dragAng) * w.mag;
      this._axis.y = Math.sin(w.dragAng) * w.mag;
      if (w.mag <= 0) { this._axis.x = 0; this._axis.y = 0; }
    }
  },

  // read everything the indicators need straight off the live game state
  pollState() {
    const g = (typeof G !== 'undefined') ? G : null;
    const p = g && g.player ? g.player : null;
    const st = p && p.stats ? p.stats : null;
    for (const b of this.order) {
      const wasReady = b.ready;
      b.visible = !b.req || !!(st && st[b.req]);
      b.frac = 1; b.ready = true; b.active = 0; b.charges = 0; b.maxCharges = 1; b.meter = 0;
      if (!p) { if (b.req) b.visible = false; continue; }
      const cdm = (x) => (p.cd ? p.cd(x) : x) || 1e-6;
      switch (b.name) {
        case 'fire': {
          const wid = (g && g.tree && g.tree.primary) || 'revolver';
          const wp = (typeof WEAPONS !== 'undefined' && WEAPONS[wid]) ? WEAPONS[wid] : null;
          const rate = wp ? wp.rate / ((st && st.fireRate) || 1) : 0.36;
          const cd = (p.weaponCd && p.weaponCd.primary) || 0;
          b.frac = rate > 0 ? clamp(1 - cd / rate, 0, 1) : 1;
          b.ready = cd <= 0;
          b.active = p.rampage && p.rampage.active ? 1 : 0;
          break;
        }
        case 'shield': {
          const max = cdm((st && st.absorbCd) || 1.3);
          const cd = (p.absorb && p.absorb.cd) || 0;
          b.frac = cd > 0 ? clamp(1 - cd / max, 0, 1) : 1;
          b.ready = cd <= 0 && !(p.absorb && p.absorb.active);
          if (p.absorb && p.absorb.active) {
            const win = (st && st.absorbWindow) || 0.3;
            b.active = clamp(1 - p.absorb.t / win, 0, 1);
            b.frac = b.active;
          }
          break;
        }
        case 'roll': {
          const maxC = (st && st.rollCharges) || 1;
          const ch = (p.roll && p.roll.charges !== undefined) ? p.roll.charges : maxC;
          b.charges = ch; b.maxCharges = maxC;
          const full = cdm(2.4 * ((st && st.rollCd) || 1));
          b.frac = ch >= maxC ? 1 : clamp(1 - ((p.roll && p.roll.rechargeT) || 0) / full, 0, 1);
          b.ready = ch > 0;
          b.active = (p.roll && p.roll.active) ? 1 : 0;
          break;
        }
        case 'rampage': {
          const r = p.rampage || {};
          b.meter = clamp((r.meter || 0) / 100, 0, 1);
          if (r.active) { b.active = clamp(1 - (r.t || 0) / (r.dur || 5), 0, 1); b.meter = b.active; b.frac = b.active; b.ready = false; }
          else { b.frac = b.meter; b.ready = b.meter >= 1; }
          break;
        }
        case 'dive': {
          const max = cdm(7), cd = (p.dive && p.dive.cd) || 0;
          b.frac = cd > 0 ? clamp(1 - cd / max, 0, 1) : 1;
          b.ready = cd <= 0; b.active = (p.dive && p.dive.active) ? 1 : 0;
          break;
        }
        case 'decoy': {
          const max = cdm(14), cd = p.decoyCd || 0;
          b.frac = cd > 0 ? clamp(1 - cd / max, 0, 1) : 1; b.ready = cd <= 0; break;
        }
        case 'tidal': {
          const max = cdm(12), cd = p.tidalCd || 0;
          b.frac = cd > 0 ? clamp(1 - cd / max, 0, 1) : 1; b.ready = cd <= 0; break;
        }
      }
      if (b.ready && !wasReady) b.flash = 1;
    }
  },

  // ----------------------------------------------------------------- API
  axis() { return { x: this._axis.x, y: this._axis.y }; },
  held(name) { const b = this.buttons[name]; return !!(this.enabled && b && b.visible && (b.down || b.latch)); },
  pressed(name) { const b = this.buttons[name]; return !!(this.enabled && b && b.visible && b.latch); },
  endFrame() { for (const b of this.order) b.latch = false; },

  aimAt() {
    if (!this.enabled) return null;
    for (const t of this.touches.values()) if (t.owner === null) return { x: t.x, y: t.y };
    const f = this.buttons.fire;
    if (f && f.down && f.dragLen > 11) {
      return { x: clamp(320 + f.dragX / f.dragLen * 240, 0, 640), y: clamp(180 + f.dragY / f.dragLen * 240, 0, 360) };
    }
    return null;
  },

  consumedTouch(x, y) {
    if (!this.enabled) return false;
    if (dist(x, y, MB_WX, MB_WY) <= MB_WGRAB) return true;
    for (const b of this.order) { if (!b.visible) continue; if (Math.hypot(x - b.x, y - b.y) <= b.r + 5) return true; }
    return false;
  },

  // -------------------------------------------------------------- render
  render(ctx, t) {
    if (!this.enabled) return;
    const art = this.ensureArt();
    if (t === undefined) t = this.t;
    const sm = ctx.imageSmoothingEnabled;
    ctx.imageSmoothingEnabled = false;
    ctx.save();
    this.drawWheel(ctx, art, t);
    for (const b of this.order) if (b.visible) this.drawButton(ctx, art, b, t);
    ctx.restore();
    ctx.imageSmoothingEnabled = sm;
  },

  drawWheel(ctx, art, t) {
    const w = this.wheel;
    const cx = MB_WX, cy = MB_WY;
    // mounting plate + compass ticks
    ctx.globalAlpha = w.active ? 0.82 : 0.62;
    drawSprite(ctx, art.base, cx, cy);
    // lit tick in the steered direction
    if (w.mag > 0) {
      const tx = Math.round(cx + Math.cos(w.dragAng) * 40), ty = Math.round(cy + Math.sin(w.dragAng) * 40);
      ctx.globalAlpha = 1;
      ctx.fillStyle = '#ffe48f'; ctx.fillRect(tx - 1, ty - 1, 3, 3);
      ctx.fillStyle = '#fff'; ctx.fillRect(tx, ty, 1, 1);
    }
    // frame index: the art repeats every 45 degrees (8 spokes)
    const sector = TAU / 8;
    let i = Math.round(w.ang / sector * MB_WFRAMES) % MB_WFRAMES;
    if (i < 0) i += MB_WFRAMES;
    const sp = art.frames[i], sh = art.shadows[i];
    ctx.globalAlpha = 0.34;
    drawSprite(ctx, sh, cx + 2, cy + 3);
    ctx.globalAlpha = w.active ? 0.97 : 0.86;
    drawSprite(ctx, sp, cx, cy);
    // king spoke: rope-wrapped grip, marks the true rotation of the helm
    const kd = w.ang - Math.PI / 2;
    ctx.globalAlpha = w.active ? 1 : 0.9;
    drawSprite(ctx, art.king, cx + Math.cos(kd) * (MB_ROUT + 4), cy + Math.sin(kd) * (MB_ROUT + 4), kd);
    // analog throttle: a chunky arc of pips on the rim, opening out with the push
    if (w.mag > 0.02) {
      ctx.globalAlpha = 1;
      const rr = 41, span = 0.26 + w.mag * 1.35, n = Math.max(2, Math.round(span * rr / 1.7));
      const pt = s => {
        const a = w.dragAng + (s / n - 0.5) * span;
        return [Math.round(cx + Math.cos(a) * rr), Math.round(cy + Math.sin(a) * rr)];
      };
      ctx.fillStyle = '#0b0c13';
      for (let s = 0; s <= n; s++) { const q = pt(s); ctx.fillRect(q[0] - 1, q[1] - 1, 4, 4); }
      for (let s = 0; s <= n; s++) { const q = pt(s); ctx.fillStyle = (s & 1) ? '#ffd27a' : '#ffe48f'; ctx.fillRect(q[0], q[1], 2, 2); }
      // thumb knob at the drag point
      drawSprite(ctx, art.knob, cx + w.dx, cy + w.dy);
    }
    ctx.globalAlpha = 1;
  },

  drawButton(ctx, art, b, t) {
    const P = art.plates[b.name];
    const x = Math.round(b.x), y = Math.round(b.y);
    const dn = b.down || b.press > 0.35;
    const oy = dn ? 1 : 0;
    const dim = !b.ready && b.active <= 0;
    const big = b.r >= 30;
    const ls = big ? 7 : (b.name === 'rampage' ? 5 : b.r >= 22 ? 6 : 5);
    const ly = y + oy + b.r - (big ? 19 : b.r >= 22 ? 16 : 15);
    const iy = y + oy - (big ? 7 : 5);

    // ---- plate
    ctx.globalAlpha = dim ? 0.80 : (b.down ? 1 : 0.94);
    drawSprite(ctx, dim ? P.off : (dn ? P.down : P.up), x, y + oy);
    // ---- ready pulse / flash
    if (b.flash > 0) {
      ctx.globalAlpha = Math.min(0.55, b.flash * 0.55);
      drawSprite(ctx, P.hot, x, y + oy);
      ctx.globalAlpha = Math.min(0.85, b.flash);
      this.ringPips(ctx, x, y + oy, Math.round(b.r + 1 + (1 - b.flash) * 11), 1, '#ffffff', null, 1, 3);
    } else if (b.ready && !b.down) {
      ctx.globalAlpha = (0.10 + 0.09 * Math.sin(t * 4 + b.x)) * b.glow;
      drawSprite(ctx, P.hot, x, y + oy);
    }
    ctx.globalAlpha = 1;
    // ---- rampage: liquid fill meter behind the icon
    if (b.name === 'rampage') this.fillMeter(ctx, b, x, y + oy, t);
    // ---- ability running: the whole plate blazes in its own colour
    if (b.active > 0 && b.name !== 'fire') {
      ctx.globalAlpha = 0.45 + 0.35 * Math.sin(t * 26);
      drawSprite(ctx, P.act, x, y + oy);
      ctx.globalAlpha = 1;
    }
    // ---- cooldown / charge ring, sitting in the bezel
    const rr = b.r - 3;
    const frac = b.active > 0 ? b.active : b.frac;
    const on = dim ? '#5d6880' : (b.active > 0 ? '#ffffff' : b.tint);
    this.ringPips(ctx, x, y + oy, rr, frac, on, '#0e1626', big ? 2 : 1, 2);
    // ---- icon
    ctx.globalAlpha = dim ? 0.85 : 1;
    drawSprite(ctx, dim ? art.iconsOff[b.icon] : art.icons[b.icon], x, iy);
    ctx.globalAlpha = 1;
    // ---- roll charge pips
    if (b.name === 'roll' && b.maxCharges > 1) {
      const n = Math.min(4, b.maxCharges), w = n * 5 - 1, x0 = x - ((w / 2) | 0), py = ly - 7;
      for (let i = 0; i < n; i++) {
        const lit = i < b.charges;
        ctx.fillStyle = '#0b0c13'; ctx.fillRect(x0 + i * 5 - 1, py - 1, 5, 5);
        ctx.fillStyle = lit ? '#6fd88e' : '#39424f'; ctx.fillRect(x0 + i * 5, py, 3, 3);
        if (lit) { ctx.fillStyle = '#b6f3c8'; ctx.fillRect(x0 + i * 5, py, 1, 1); }
      }
    }
    // ---- label
    pixelText(ctx, b.label, x, ly, ls, dim ? '#7c869c' : b.tint, 'center');
  },

  // a ring of chunky pixel ticks: the cooldown sweep / charge meter
  ringPips(ctx, cx, cy, rr, frac, colOn, colOff, size, spacing) {
    if (rr < 4) return;
    const N = Math.max(16, Math.round(TAU * rr / (spacing || 2)));
    const lit = frac * N;
    const s = size + 1;
    for (let i = 0; i < N; i++) {
      const isOn = i < lit;
      if (!isOn && !colOff) continue;
      const a = -Math.PI / 2 + (i + 0.5) / N * TAU;
      const px = Math.round(cx + Math.cos(a) * rr), py = Math.round(cy + Math.sin(a) * rr);
      ctx.fillStyle = isOn ? colOn : colOff;
      ctx.fillRect(px - (s >> 1), py - (s >> 1), s, s);
    }
  },

  // Otter Rampage: a rising posterised "liquid" inside the plate face
  fillMeter(ctx, b, x, y, t) {
    const r = b.r - 8, h = r * 2;
    const k = clamp(b.meter, 0, 1);
    if (k <= 0 || r < 3) return;
    const fh = Math.round(h * k);
    const full = b.ready || b.active > 0;
    const surf = b.active > 0 ? '#ffe48f' : full ? '#ffd27a' : '#f08040';
    ctx.globalAlpha = 0.62;
    for (let row = 0; row < fh; row++) {
      const yy = y + r - row, dy = yy - y;
      const half = Math.round(Math.sqrt(Math.max(0, r * r - dy * dy)));
      if (half <= 0) continue;
      if (row === fh - 1) continue;
      const band = ((row + Math.floor(t * 10)) % 5) === 0;
      ctx.fillStyle = b.active > 0 ? (Math.floor(t * 12) % 2 ? '#d45434' : '#b23328')
        : full ? (Math.floor(t * 5) % 2 ? '#d45434' : '#b23328')
          : band ? '#a12a20' : '#6e1a16';
      ctx.fillRect(x - half, yy, half * 2, 1);
    }
    // wobbling surface line + a dithered row above it
    const sy = y + r - fh + 1;
    const sdy = sy - y;
    const shalf = Math.round(Math.sqrt(Math.max(0, r * r - sdy * sdy)));
    if (shalf > 0) {
      ctx.globalAlpha = 0.85;
      ctx.fillStyle = surf;
      const wob = Math.round(Math.sin(t * 6) * 1);
      ctx.fillRect(x - shalf, sy + wob, shalf * 2, 1);
      ctx.globalAlpha = 0.5;
      for (let i = -shalf; i < shalf; i += 2) ctx.fillRect(x + i, sy + wob - 1, 1, 1);
    }
    ctx.globalAlpha = 1;
  },
};

// ---- Cinematic intro, dialogue, end screens -----------------------------
const Intro = {
  t: 0, done: false, drops: [], bubbles: [], shakeT: 0, splashed: false,
  lines: [
    'The boat never even slowed down.',
    'Mom was still singing when the propeller found her.',
    'Three days later an otter found me. He said he knew the village those boats came from.',
    'He also said he had a gun.',
  ],
  reset() { this.t = 0; this.done = false; this.drops = []; this.bubbles = []; this.splashed = false; },
  update(dt) {
    this.t += dt; this.shakeT -= dt;
    if (this.t > 0.8 && (Input.anyKey || Input.mouse.clicked)) { this.done = true; return; }
    if (this.t > 0.55 && this.t < 0.6) this.shakeT = 0.25;
    for (let i = this.drops.length - 1; i >= 0; i--) { const d = this.drops[i]; d.x += d.vx * dt; d.y += d.vy * dt; d.vy += 300 * dt; d.life -= dt; if (d.life <= 0) this.drops.splice(i, 1); }
    for (let i = this.bubbles.length - 1; i >= 0; i--) { const b = this.bubbles[i]; b.y -= b.s * dt; b.x += Math.sin(this.t * 3 + b.ph) * 10 * dt; if (b.y < -10) this.bubbles.splice(i, 1); }
    if (this.t > 10.2 && Math.random() < 0.6) this.bubbles.push({ x: rand(0, 640), y: 380, s: rand(30, 90), ph: rand(0, TAU), r: randi(1, 4) });
    if (this.t > 12.4) this.done = true;
  },
  jumpPos() {
    // leap from cliff edge (150,150) to water (330,262)
    const k = clamp((this.t - 9.0) / 1.15, 0, 1);
    const x = lerp(140, 330, k), y = lerp(150, 262, k) - Math.sin(k * Math.PI) * 70;
    return { x, y, k };
  },
  render(ctx) {
    const t = this.t;
    ctx.save();
    if (this.shakeT > 0) ctx.translate(rand(-4, 4), rand(-4, 4));
    // sky
    const sky = ctx.createLinearGradient(0, 0, 0, 200); sky.addColorStop(0, '#2a1a4a'); sky.addColorStop(0.55, '#c0503a'); sky.addColorStop(1, '#f2a05a');
    ctx.fillStyle = sky; ctx.fillRect(0, 0, 640, 200);
    // sun
    ctx.fillStyle = '#ffd27a'; ctx.beginPath(); ctx.arc(470, 178, 34, 0, TAU); ctx.fill();
    ctx.fillStyle = '#f2a05a'; for (let i = 0; i < 4; i++) ctx.fillRect(430, 160 + i * 10, 80, 3);
    // distant village silhouettes on the horizon
    ctx.fillStyle = '#3a1f30';
    const huts = [520, 548, 575, 600, 622]; huts.forEach((x, i) => { ctx.fillRect(x, 186, 20, 10); ctx.beginPath(); ctx.moveTo(x - 2, 186); ctx.lineTo(x + 10, 178); ctx.lineTo(x + 22, 186); ctx.fill(); if (Math.floor(t * 3 + i) % 4 !== 0) { ctx.fillStyle = '#ffe48f'; ctx.fillRect(x + 8, 190, 3, 3); ctx.fillStyle = '#3a1f30'; } });
    ctx.fillRect(500, 194, 140, 4); // dock line
    for (let i = 0; i < 5; i++) { ctx.fillRect(505 + i * 26, 190, 14, 5); }
    // sea with posterized wave bands
    for (let y = 196; y < 360; y += 2) {
      const depth = (y - 196) / 164;
      const wave = Math.sin(y * 0.3 + t * 2) + Math.sin(y * 0.11 - t * 1.3);
      const shade = Math.floor((wave + 2) / 4 * 3);
      const cols = depth < 0.15 ? ['#6f4a6a', '#8a5c78', '#c08a7a'] : depth < 0.5 ? ['#1d4a7a', '#245a90', '#3a7ab0'] : ['#123a66', '#174a7e', '#1d5a96'];
      ctx.fillStyle = cols[shade]; ctx.fillRect(0, y, 640, 2);
      if (shade === 2 && hash2(y, Math.floor(t * 4)) > 0.7) { ctx.fillStyle = '#ffd7a0'; const sx = (hash2(y, 7) * 640 + t * 20) % 640; ctx.fillRect(sx, y, 14, 1); }
    }
    // cliff (left)
    ctx.fillStyle = '#2a2430'; ctx.beginPath(); ctx.moveTo(0, 150); ctx.lineTo(120, 148); ctx.lineTo(170, 160); ctx.lineTo(190, 200); ctx.lineTo(200, 260); ctx.lineTo(175, 300); ctx.lineTo(160, 360); ctx.lineTo(0, 360); ctx.fill();
    ctx.fillStyle = '#3d3545'; ctx.beginPath(); ctx.moveTo(0, 152); ctx.lineTo(118, 150); ctx.lineTo(160, 165); ctx.lineTo(150, 200); ctx.lineTo(0, 210); ctx.fill();
    ctx.fillStyle = '#4f8f5a'; ctx.fillRect(0, 146, 122, 5); ctx.fillStyle = '#6fd88e'; for (let i = 0; i < 12; i++) ctx.fillRect(i * 11, 144 + (i % 2), 3, 3);
    // foam where waves hit the cliff
    ctx.fillStyle = `rgba(230,246,255,${(0.5 + Math.sin(t * 3) * 0.3).toFixed(2)})`; ctx.fillRect(170, 258 + Math.sin(t * 3) * 3, 40, 3); ctx.fillRect(185, 280 + Math.cos(t * 2.5) * 3, 30, 2);
    // characters
    const rigOpts = (aim, roll, exp) => ({
      t, aim, facing: 1, tilt: 0, swimPhase: t * 2.5, rollPhase: roll,
      hurt: false, exp, rage: false, recoil: 0, flash: 0,
      speed: 0, armored: true, gunSprite: SP.guns.revolver,
    });
    if (t < 9.0) {
      // the pair waiting on the cliff edge; the otter hops aboard at the end
      const mx = 120, my = 140;
      ctx.save(); ctx.translate(mx, my); ctx.scale(1.15, 1.15);
      Rig.draw(ctx, 0, 0, Object.assign(rigOpts(-0.25, null, t > 7.6 ? 'angry' : 'idle'), { riderHidden: t < 8.5 }));
      ctx.restore();
      if (t < 8.5) {
        // the otter is still standing beside him, pacing and checking the gun
        let ox = 62, oy = 128;
        if (t > 8.2) { const k = clamp((t - 8.2) / 0.3, 0, 1); ox = lerp(62, mx + 4, k); oy = lerp(128, my - 14, k) - Math.sin(k * Math.PI) * 26; }
        else if (t > 7.6) oy = 128 - Math.abs(Math.sin((t - 7.6) * 10)) * 7;
        ctx.save(); ctx.translate(ox, oy); ctx.scale(1.5, 1.5);
        ctx.drawImage(CH.otterTail.c, -16, 2);
        ctx.drawImage(CH.otterTorso.c, -CH.otterTorso.ax, -CH.otterTorso.ay);
        const hd = otterHeadWithFace(t > 7.6 ? 'angry' : 'idle', Rig.blink, t, false);
        ctx.drawImage(hd, -CH.otterHead.ax, -CH.otterHead.ay - 9);
        ctx.drawImage(SP.guns.revolver.c, 4, -2);
        ctx.restore();
      }
    } else if (t < 10.6) {
      const j = this.jumpPos();
      const rot = j.k * 1.25;
      const sink = Math.max(0, t - 10.1) * 90;
      ctx.save(); ctx.beginPath(); ctx.rect(0, 0, 640, 264); ctx.clip();
      ctx.save(); ctx.translate(j.x, j.y + sink); ctx.rotate(rot); ctx.scale(1.15, 1.15);
      Rig.draw(ctx, 0, 0, rigOpts(-0.3, null, 'angry'));
      ctx.restore(); ctx.restore();
      if (j.k >= 0.96 && !this.splashed) {
        this.splashed = true; Audio_.splash(3); this.shakeT = 0.3;
        for (let i = 0; i < 110; i++) {
          const a = rand(-Math.PI * 0.95, -Math.PI * 0.05), sp = rand(60, 320);
          this.drops.push({ x: 330 + rand(-14, 14), y: 262, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rand(0.6, 1.5), c: Math.random() < 0.3 ? '#8ac6ff' : '#eaf8ff' });
        }
      }
    }
    // splash column
    if (this.splashed && t < 10.9) {
      const k = (t - 10.1) / 0.8, h = Math.sin(Math.min(1, k) * Math.PI) * 74;
      for (let i = 0; i < 6; i++) {
        const w = Math.round(30 - i * 4.5), hh = Math.round(h * (0.35 + i * 0.13));
        ctx.fillStyle = i % 2 ? 'rgba(138,198,255,0.85)' : 'rgba(234,248,255,0.92)';
        ctx.fillRect(330 - (w >> 1) + Math.round(Math.sin(t * 30 + i) * 1.5), 262 - hh, w, hh);
      }
      ctx.fillStyle = '#ffffff'; ctx.fillRect(327, 262 - Math.round(h), 6, 3);
    }
    // splash droplets & foam
    for (const d of this.drops) { ctx.fillStyle = d.c; ctx.fillRect(Math.round(d.x), Math.round(d.y), 2, 2); }
    if (this.splashed && t < 11) { const k = Math.max(0, t - 10.1); ctx.strokeStyle = `rgba(230,246,255,${Math.max(0, 0.9 - k).toFixed(2)})`; ctx.lineWidth = 2; ctx.beginPath(); ctx.ellipse(330, 264, 20 + k * 120, 6 + k * 30, 0, 0, TAU); ctx.stroke(); }
    // dive: water rises to fill the screen
    if (t > 10.0) {
      const k = clamp((t - 10.0) / 1.4, 0, 1);
      ctx.fillStyle = `rgba(14,60,120,${(k * 0.95).toFixed(2)})`; ctx.fillRect(0, 0, 640, 360);
      ctx.fillStyle = `rgba(8,30,80,${(k * 0.6).toFixed(2)})`; ctx.fillRect(0, 360 - k * 360, 640, k * 360);
      for (const b of this.bubbles) { ctx.strokeStyle = 'rgba(220,245,255,0.8)'; ctx.lineWidth = 1; ctx.strokeRect(Math.round(b.x), Math.round(b.y), b.r, b.r); }
      if (t > 11.6) { const f = clamp((t - 11.6) / 0.8, 0, 1); ctx.fillStyle = `rgba(0,0,0,${f.toFixed(2)})`; ctx.fillRect(0, 0, 640, 360); }
    }
    // title
    if (t > 0.5) {
      const k = clamp((t - 0.5) / 0.15, 0, 1);
      const ty = lerp(-40, 14, k);
      pixelText(ctx, 'MANATEE', 320, ty, 30, '#e6f2ff', 'center');
      if (t > 0.9) pixelText(ctx, 'VS', 320, ty + 30, 14, '#ff6161', 'center');
      if (t > 1.2) { const k2 = clamp((t - 1.2) / 0.15, 0, 1); pixelText(ctx, 'BOATS', 320, lerp(-40, ty + 44, k2), 30, '#ffe48f', 'center'); }
    }
    // story lines typed out
    if (t > 3 && t < 9.8) {
      const idx = Math.min(this.lines.length - 1, Math.floor((t - 3) / 1.6));
      const line = this.lines[idx], lt = (t - 3 - idx * 1.6);
      const n = Math.min(line.length, Math.floor(lt * 45));
      ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(0, 306, 640, 24);
      pixelText(ctx, line.slice(0, n), 320, 312, 9, '#fff', 'center');
    }
    if (t > 8.3 && t < 10) pixelText(ctx, '"Let\'s go get them."', 320, 290, 8, '#ffe48f', 'center');
    if (t > 0.8 && Math.floor(t * 2) % 2 === 0) pixelText(ctx, 'press any key to skip', 634, 350, 6, '#889', 'right');
    ctx.restore();
  },
};

const Dialogue = {
  t: 0, text: 'Oh, a manatee! Free meat for tonight!', done: false, shotFired: false,
  reset() { this.t = 0; this.done = false; this.shotFired = false; },
  update(dt) { this.t += dt; if (this.t > 3) this.done = true; },
  renderWorld(ctx, cam) { /* the bubble is drawn in HUD space so the text stays crisp */ },
  renderHUD(ctx) {
    const f = G.fisherman; if (!f || !f.alive) return;
    // anchor the bubble to his screen position through the zoom
    if (this.t > 0.6) {
      const sp = G.worldToScreen(f.x, f.y - 34);
      const sx = Math.round(sp.x), sy = Math.round(sp.y);
      const n = Math.min(this.text.length, Math.floor((this.t - 0.6) * 30));
      const w = Math.max(70, textWidth(this.text, 7) + 20);
      const bx = clamp(sx - w / 2, 6, 634 - w), by = clamp(sy - 26, 44, 300);
      UIKit.panel(ctx, bx, by, w, 24, 'parchment');
      ctx.fillStyle = '#e8dcc0';
      ctx.beginPath(); ctx.moveTo(sx - 6, by + 23); ctx.lineTo(sx + 6, by + 23); ctx.lineTo(sx, by + 33); ctx.fill();
      ctx.fillStyle = '#2a2016';
      ctx.beginPath(); ctx.moveTo(sx - 7, by + 24); ctx.lineTo(sx - 5, by + 24); ctx.lineTo(sx, by + 34); ctx.fill();
      ctx.beginPath(); ctx.moveTo(sx + 7, by + 24); ctx.lineTo(sx + 5, by + 24); ctx.lineTo(sx, by + 34); ctx.fill();
      pixelText(ctx, this.text.slice(0, n), bx + 10, by + 8, 7, '#2a2016', 'left', false);
    }
    if (!this.done) return;
    const touch = typeof MobileUI !== 'undefined' && MobileUI.enabled;
    UIKit.panel(ctx, 60, 298, 520, 40, 'dark');

                         : 'WASD swim   SPACE roll   E / right-click shield   TAB workshop',

function drawEndScreen(ctx, t, win) {

    320, 302, 10, Math.floor(t * 2) % 2 ? '#ffffff' : '#ffe48f', '#14141c', 'center');
