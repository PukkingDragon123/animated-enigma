    this.sbw = this.W >> 1; this.sbh = this.H >> 1;
    this.depth = new Float32Array(this.gw * this.gh);
    this._warp = new Float32Array(this.gw * this.gh);
    this._patch = new Float32Array(this.gw * this.gh);
    this.buildDepthGrid();
    this.sb = new Uint8ClampedArray(this.sbw * this.sbh * 4);
    this.paintSand();
    const rng = new SeededRandom(90210);
    this.scatterSeabed(rng);
    this.buildPlants(rng);
    this.spawnFish();
    Ocean._cache = { key, depth: this.depth, sb: this.sb, kelp: this.kelp, turf: this.turf, sbw: this.sbw, sbh: this.sbh, reefs: this.reefs };
    this._warp = this._patch = null;
  }

  buildDepthGrid() {
    const gw = this.gw, gh = this.gh, c = this.cell, sh = this.shoreY;
    const d = this.depth, w = this._warp, p = this._patch;
    for (let gy = 0; gy < gh; gy++) {
      const wy = gy * c;
      for (let gx = 0; gx < gw; gx++) {
        const wx = gx * c, i = gy * gw + gx;
        const n = vnoise(wx * 0.0021, wy * 0.0021) * 0.56 + vnoise(wx * 0.0058, wy * 0.0058) * 0.29 + vnoise(wx * 0.016, wy * 0.016) * 0.15;
        // the shelf drops away fast, then noise carves banks, channels & reefs
        let v = clamp((wy - sh) / 980, 0, 1.25) * 0.94 + (n - 0.47) * 0.46;
        const near = (wy - sh) / 170;
        if (near < 1) v = Math.min(v, Math.max(0, near) * 0.26);
        d[i] = clamp(v, 0, 1);
        w[i] = vnoise(wx * 0.0062, wy * 0.0062);
        p[i] = vnoise(wx * 0.0125 + 40, wy * 0.0125 - 17);
      }
    }
  }

  depthAt(x, y) { return this.sample(this.depth, x, y); }

  // ---- base sand, dunes, silt & seagrass meadows -----------------------
  paintSand() {
    const sw = this.sbw, sh2 = this.sbh, buf = this.sb;
    const y0 = Math.max(0, (this.shoreY - 60) >> 1);
    const rowD = new Float32Array(sw), rowW = new Float32Array(sw), rowP = new Float32Array(sw);
    const K = _OS_K;
    for (let y = y0; y < sh2; y++) {
      const wy = y * 2;
      this.fillRow(rowD, this.depth, wy, 0, sw, 2);
      this.fillRow(rowW, this._warp, wy, 0, sw, 2);
      this.fillRow(rowP, this._patch, wy, 0, sw, 2);
      let i = (y * sw) << 2;
      for (let x = 0; x < sw; x++, i += 4) {
        const wx = x * 2, dp = rowD[x];
        let band = (dp * 15.999) | 0; if (band > 15) band = 15;
        const ramp = this.sandPal[band];
        // wind-blown ripple dunes: a warped sine, posterized into 5 shades
        const ph = (wy * 0.086 + rowW[x] * 16 + _OS[((wx * 0.030 * K) | 0) & _OS_M] * 2.4) * K;
        const rp = _OS[(ph | 0) & _OS_M] + _OS[((wx * 0.052 * K + wy * 0.018 * K) | 0) & _OS_M] * 0.45;
        let s = rp > 0.75 ? 0 : rp > 0.22 ? 1 : rp > -0.28 ? 2 : rp > -0.85 ? 3 : 4;
        const h = hash2(x, y);
        if (h > 0.965) s = s > 0 ? s - 1 : 1;         // shell grit
        else if (h < 0.028) s = s < 4 ? s + 1 : 3;    // dark pebble
        let r = ramp[s][0], g = ramp[s][1], b = ramp[s][2];
        // seagrass meadows tint big soft patches olive-green
        const mw = rowP[x];
        if (mw > 0.60 && dp < 0.52) {
          const k = Math.min(1, (mw - 0.60) * 4.2) * (1 - dp / 0.52) * 0.72;
          const dith = ((x + (y & 1)) & 1) === 0 ? 1 : 0.7;
          r += (52 - r) * k * dith; g += (104 - g) * k * dith; b += (58 - b) * k * dith;
        }
        buf[i] = r; buf[i + 1] = g; buf[i + 2] = b; buf[i + 3] = 255;
      }
    }
  }

  // ---- seabed pixel helpers (build time only) --------------------------
  _px(x, y, r, g, b) {
    x = Math.round(x); y = Math.round(y);
    if (x < 0 || y < 0 || x >= this.sbw || y >= this.sbh) return;
    const i = (y * this.sbw + x) << 2, d = this.sb;
    d[i] = r; d[i + 1] = g; d[i + 2] = b;
  }
  _pc(x, y, c) { this._px(x, y, c[0], c[1], c[2]); }
  _shade(x, y, k) {
    x = Math.round(x); y = Math.round(y);
    if (x < 0 || y < 0 || x >= this.sbw || y >= this.sbh) return;
    const i = (y * this.sbw + x) << 2, d = this.sb;
    d[i] *= k; d[i + 1] *= k; d[i + 2] *= k;
  }
  _disc(cx, cy, r, c) { const r2 = r * r; for (let y = -r; y <= r; y++) for (let x = -r; x <= r; x++) if (x * x + y * y <= r2) this._pc(cx + x, cy + y, c); }
  _shadow(cx, cy, r) { const r2 = r * r; for (let y = -r; y <= r; y++) for (let x = -r; x <= r; x++) { const q = x * x + y * y; if (q <= r2) this._shade(cx + x + 1, cy + y + 2, q > r2 * 0.55 ? 0.86 : 0.72); } }
  _thick(x0, y0, x1, y1, w, c) {
    const dx = x1 - x0, dy = y1 - y0;
    const n = Math.max(1, Math.ceil(Math.max(Math.abs(dx), Math.abs(dy))));
    const h = (w - 1) / 2;
    for (let i = 0; i <= n; i++) {
      const x = x0 + dx * i / n, y = y0 + dy * i / n;
      for (let oy = -h; oy <= h; oy++) for (let ox = -h; ox <= h; ox++) this._pc(x + ox, y + oy, c);
    }
  }

  // ---- individual seabed props -----------------------------------------
  _rock(rng, cx, cy, r) {
    const pal = this.rockPal[rng.int(0, this.rockPal.length - 1)];
    this._shadow(cx, cy, r);
    const lobes = [{ x: 0, y: 0, r: r * 0.88 }];
    const nl = rng.int(3, 5);
    for (let i = 0; i < nl; i++) lobes.push({ x: rng.range(-r * 0.5, r * 0.5), y: rng.range(-r * 0.45, r * 0.45), r: rng.range(r * 0.42, r * 0.8) });
    const R = Math.ceil(r) + 2;
    for (let y = -R; y <= R; y++) for (let x = -R; x <= R; x++) {
      let inside = false, edge = 9;
      for (let i = 0; i < lobes.length; i++) {
        const L = lobes[i], dx = x - L.x, dy = y - L.y;
        const dd = Math.sqrt(dx * dx + dy * dy) - L.r;
        if (dd < 0) inside = true;
        if (dd < edge) edge = dd;
      }
      if (!inside) continue;
      const tt = (-x * 0.8 - y * 1.1) / (r * 2) + 0.5;
      let s = tt > 0.70 ? 0 : tt > 0.52 ? 1 : tt > 0.34 ? 2 : 3;
      if (edge > -1.4) s = Math.min(4, s + 1);
      if (hash2(cx + x, cy + y) > 0.90) s = Math.max(0, s - 1);
      this._pc(cx + x, cy + y, pal[s]);
    }
    // algae crust on the sunlit top
    if (rng.next() < 0.7) {
      const moss = this.weedPal[rng.int(0, 3)];
      for (let i = 0; i < r * 2.4; i++) {
        const a = rng.range(0, TAU), d = rng.range(0, r * 0.7);
        this._pc(cx + Math.cos(a) * d, cy + Math.sin(a) * d * 0.8 - r * 0.25, moss);
      }
    }
  }

  _brain(rng, cx, cy, r, pal) {
    this._shadow(cx, cy, r);
    const f = rng.range(1.5, 2.3), o = rng.range(0, 9), R = Math.ceil(r);
    for (let y = -R; y <= R; y++) for (let x = -R; x <= R; x++) {
      const q = x * x + y * y; if (q > r * r) continue;
      const d = Math.sqrt(q);
      const w = Math.sin(d * f + Math.sin(x * 0.8 + o) * 1.25 + Math.sin(y * 0.72 - o) * 1.25);
      let c = w > 0.3 ? pal[0] : w > -0.3 ? pal[1] : pal[2];
      if (d > r - 1.1) c = pal[3];
      this._pc(cx + x, cy + y, c);
    }
  }

  _branchArm(rng, x, y, a, len, w, depth, pal) {
    const x2 = x + Math.cos(a) * len, y2 = y + Math.sin(a) * len * 0.85;
    this._thick(x, y, x2, y2, w, depth === 0 ? pal[1] : pal[2]);
    if (depth > 0) {
      this._branchArm(rng, x2, y2, a + rng.range(0.35, 0.85), len * 0.62, Math.max(1, w - 1), depth - 1, pal);
      this._branchArm(rng, x2, y2, a - rng.range(0.35, 0.85), len * 0.62, Math.max(1, w - 1), depth - 1, pal);
    } else { this._pc(x2, y2, pal[0]); this._pc(x2 + 1, y2, pal[0]); }
  }
  _branchCoral(rng, cx, cy, r, pal) {
    this._shadow(cx, cy, Math.max(2, r * 0.6));
    const n = rng.int(4, 7), a0 = rng.range(0, TAU);
    for (let i = 0; i < n; i++) this._branchArm(rng, cx, cy, a0 + i / n * TAU + rng.range(-0.25, 0.25), r * rng.range(0.65, 1.0), Math.max(2, (r * 0.3) | 0), 2, pal);
    this._disc(cx, cy, Math.max(1, (r * 0.26) | 0), pal[2]);
  }

  _fanCoral(rng, cx, cy, r, pal) {
    this._shadow(cx, cy, Math.max(2, r * 0.45));
    const a0 = rng.range(0, TAU), spread = rng.range(1.1, 1.8), ribs = rng.int(7, 11);
    for (let i = 0; i < ribs; i++) {
      const f = ribs > 1 ? i / (ribs - 1) - 0.5 : 0;
      const a = a0 + f * spread, len = r * (1 - Math.abs(f) * 0.42);
      let x = cx, y = cy;
      for (let s = 0; s < len; s++) {
        const aa = a + Math.sin(s * 0.3 + i) * 0.06;
        x += Math.cos(aa); y += Math.sin(aa) * 0.9;
        this._pc(x, y, s > len - 2.5 ? pal[0] : pal[1]);
      }
    }
    for (let k = 0; k < 2; k++) {
      const rr = r * (0.45 + k * 0.3);
      for (let i = 0; i <= 20; i++) {
        const a = a0 + (i / 20 - 0.5) * spread * 0.92;
        this._pc(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr * 0.9, pal[2]);
      }
    }
    this._disc(cx, cy, 1, pal[3]);
  }

  _plateCoral(rng, cx, cy, r, pal) {
    this._shadow(cx, cy, r);
    const ry = Math.max(2, r * rng.range(0.58, 0.86)), R = Math.ceil(r), RY = Math.ceil(ry);
    for (let y = -RY; y <= RY; y++) for (let x = -R; x <= R; x++) {
      const q = (x * x) / (r * r) + (y * y) / (ry * ry); if (q > 1) continue;
      const ring = (q * 4.5) | 0;
      let c = q > 0.88 ? pal[3] : (ring & 1) ? pal[1] : pal[0];
      if (y > ry * 0.45) c = pal[2];
      this._pc(cx + x, cy + y, c);
    }
  }

  _anemone(rng, cx, cy, r, pal) {
    this._disc(cx, cy, Math.max(1, r * 0.55), pal[3]);
    const n = rng.int(10, 16), a0 = rng.range(0, TAU);
    for (let i = 0; i < n; i++) {
      const a = a0 + i / n * TAU, L = r * rng.range(0.8, 1.3);
      for (let s = 0; s <= L; s++) {
        const aa = a + Math.sin(s * 0.55 + i) * 0.28;
        this._pc(cx + Math.cos(aa) * s, cy + Math.sin(aa) * s * 0.85, s > L - 1.5 ? pal[0] : pal[1]);
      }
    }
  }

  _starfish(rng, cx, cy, r, pair) {
    const a0 = rng.range(0, TAU);
    for (let i = 0; i < 5; i++) {
      const a = a0 + i * TAU / 5;
      for (let s = 0; s <= r; s++) {
        const w = (1 - s / r) * 1.7;
        for (let o = -w; o <= w; o += 1) this._pc(cx + Math.cos(a) * s - Math.sin(a) * o, cy + Math.sin(a) * s + Math.cos(a) * o, pair[0]);
      }
    }
    this._disc(cx, cy, 1, pair[1]);
  }

  _shell(rng, cx, cy, pair) {
    if (rng.next() < 0.5) {
      const a0 = rng.range(0, TAU), r = rng.int(2, 4);
      for (let i = -2; i <= 2; i++) { const a = a0 + i * 0.32; for (let s = 0; s <= r; s++) this._pc(cx + Math.cos(a) * s, cy + Math.sin(a) * s, (i & 1) ? pair[1] : pair[0]); }
    } else {
      let a = rng.range(0, TAU);
      for (let s = 0; s < 13; s++) { const rr = s * 0.26; this._pc(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr, s > 8 ? pair[1] : pair[0]); a += 0.64; }
    }
  }

  _urchin(rng, cx, cy, r) {
    const body = rng.next() < 0.35 ? [58, 40, 92] : [36, 28, 48];
    const spike = rng.next() < 0.35 ? [110, 74, 168] : [24, 18, 34];
    this._shadow(cx, cy, r);
    const n = rng.int(10, 15), a0 = rng.range(0, TAU);
    for (let i = 0; i < n; i++) {
      const a = a0 + i / n * TAU + rng.range(-0.12, 0.12), L = r + rng.range(1.6, 3.6);
      for (let s = r - 1; s <= L; s++) this._px(cx + Math.cos(a) * s, cy + Math.sin(a) * s * 0.9, spike[0], spike[1], spike[2]);
    }
    this._disc(cx, cy, r, body);
    this._px(cx - 1, cy - 1, body[0] + 34, body[1] + 28, body[2] + 44);
  }

  _turfPatch(rng, cx, cy, r) {
    const c0 = this.weedPal[rng.int(0, 3)], c1 = this.weedPal[rng.int(0, 4)];
    const n = (r * r * 0.5) | 0;
    for (let i = 0; i < n; i++) {
      const a = rng.range(0, TAU), d = rng.range(0, r);
      const x = cx + Math.cos(a) * d, y = cy + Math.sin(a) * d * 0.8;
      const h = rng.range(2, 5), lean = rng.range(-1.2, 1.2);
      for (let s = 0; s < h; s++) this._pc(x + lean * (s / h) * (s / h), y - s, s > h - 1.6 ? c1 : c0);
    }
  }

  // ---- scatter everything ---------------------------------------------
  scatterSeabed(rng) {
    const W = this.W, H = this.H, sh = this.shoreY;
    // reef zones: the only places corals get really dense, so the seabed
    // stays mostly open sand with reefs as landmarks
    const reefs = [];
    for (let i = 0; i < 30; i++) {
      for (let k = 0; k < 60; k++) {
        const x = rng.range(100, W - 100), y = rng.range(sh + 110, H - 100);
        if (this.depthAt(x, y) < 0.40) { reefs.push({ x, y, r: rng.range(70, 190) }); break; }
      }
    }
    this.reefs = reefs;
    const inReef = (x, y) => { for (let i = 0; i < reefs.length; i++) { const r = reefs[i]; if (dist(x, y, r.x, r.y) < r.r * 1.25) return true; } return false; };
    // boulders: sparse in the lagoon, common on the mid shelf
    for (let i = 0; i < 1600; i++) {
      const x = rng.range(20, W - 20), y = rng.range(sh + 36, H - 20), dp = this.depthAt(x, y);
      if (rng.next() > 0.10 + dp * 0.42) continue;
      this._rock(rng, x >> 1, y >> 1, rng.range(2.5, 8) * (0.7 + dp * 0.8));
    }
    // reef corals
    for (const rf of reefs) {
      const n = (rf.r * 0.34) | 0;
      for (let i = 0; i < n; i++) {
        const a = rng.range(0, TAU), d = Math.sqrt(rng.range(0, 1));
        const x = rf.x + Math.cos(a) * rf.r * d, y = rf.y + Math.sin(a) * rf.r * d * 0.85;
        if (x < 10 || y < sh + 24 || x > W - 10 || y > H - 10) continue;
        if (this.depthAt(x, y) > 0.66) continue;
        this._coral(rng, x >> 1, y >> 1);
      }
      // coral rubble skirt
      for (let i = 0; i < rf.r * 0.35; i++) {
        const a = rng.range(0, TAU), d = rng.range(0.85, 1.3);
        const pal = this.coralPal[rng.int(0, 7)];
        this._pc((rf.x + Math.cos(a) * rf.r * d) >> 1, (rf.y + Math.sin(a) * rf.r * d * 0.85) >> 1, pal[3]);
      }
    }
    // a thin sprinkle of lone coral heads out on the open sand
    for (let i = 0; i < 2600; i++) {
      const x = rng.range(20, W - 20), y = rng.range(sh + 44, H - 20);
      const dp = this.depthAt(x, y);
      if (dp > 0.5 || rng.next() > 0.10 - dp * 0.12) continue;
      this._coral(rng, x >> 1, y >> 1);
    }
    // anemones & urchins hug the reefs
    for (let i = 0; i < 1400; i++) {
      const x = rng.range(20, W - 20), y = rng.range(sh + 40, H - 20);
      if (this.depthAt(x, y) > 0.55 || (!inReef(x, y) && rng.next() > 0.08)) continue;
      this._anemone(rng, x >> 1, y >> 1, rng.range(2, 4), this.coralPal[rng.int(0, 7)]);
    }
    for (let i = 0; i < 1600; i++) {
      const x = rng.range(20, W - 20), y = rng.range(sh + 40, H - 20);
      if (this.depthAt(x, y) > 0.62 || (!inReef(x, y) && rng.next() > 0.09)) continue;
      this._urchin(rng, x >> 1, y >> 1, rng.range(1.6, 2.8));
    }
    for (let i = 0; i < 420; i++) {
      const x = rng.range(20, W - 20), y = rng.range(sh + 30, H - 20);
      if (this.depthAt(x, y) > 0.62) continue;
      this._starfish(rng, x >> 1, y >> 1, rng.range(2.2, 4), this.starPal[rng.int(0, this.starPal.length - 1)]);
    }
    for (let i = 0; i < 1400; i++) {
      const x = rng.range(10, W - 10), y = rng.range(sh + 20, H - 10);
      if (this.depthAt(x, y) > 0.6) continue;
      this._shell(rng, x >> 1, y >> 1, this.shellPal[rng.int(0, this.shellPal.length - 1)]);
    }
    // seagrass meadows: clumped, following the big olive patches
    for (let i = 0; i < 3000; i++) {
      const x = rng.range(10, W - 10), y = rng.range(sh + 30, H - 10);
      const dp = this.depthAt(x, y);
      if (dp > 0.5 || this.sample(this._patch, x, y) < 0.58 || rng.next() > 0.5) continue;
      this._turfPatch(rng, x >> 1, y >> 1, rng.range(4, 11));
    }
  }
  _coral(rng, sx, sy) {
    const pal = this.coralPal[rng.int(0, 7)], k = rng.next();
    if (k < 0.30) this._brain(rng, sx, sy, rng.range(3, 8), pal);
    else if (k < 0.62) this._branchCoral(rng, sx, sy, rng.range(4, 11), pal);
    else if (k < 0.84) this._fanCoral(rng, sx, sy, rng.range(4, 10), pal);
    else this._plateCoral(rng, sx, sy, rng.range(4, 9), pal);
  }

  // ---- swaying plants (drawn as sprites over the seabed) ---------------
  // put a colour through the exact same water column the per-pixel pass uses,
  // so sprites drawn over the seabed sit in the same fog
  fogCss(c, dp, mulv) {
    let band = (dp * 15.999) | 0; band = clamp(band, 0, 15);
    const v = this.visLUT[band], w = this.waterRamp[band];
    const r = clamp(w[0] + (c[0] * mulv * this.absR[band] - w[0]) * v, 0, 255) | 0;
    const g = clamp(w[1] + (c[1] * mulv * this.absG[band] - w[1]) * v, 0, 255) | 0;
    const b = clamp(w[2] + (c[2] * mulv * this.absB[band] - w[2]) * v, 0, 255) | 0;
    return 'rgb(' + r + ',' + g + ',' + b + ')';
  }
  buildPlants(rng) {
    const W = this.W, H = this.H, sh = this.shoreY;
    this.kelp = []; this.turf = [];
    for (let i = 0; i < 12000 && this.kelp.length < 1500; i++) {
      const x = rng.range(8, W - 8), y = rng.range(sh + 34, H - 8);
      const dp = this.depthAt(x, y);
      if (dp > 0.66 || rng.next() > 0.30 - dp * 0.22) continue;
      const base = this.weedPal[rng.int(0, this.weedPal.length - 1)];
      const hgt = rng.range(9, 34) * (1 - dp * 0.35);
      this.kelp.push({
        x, y, dp, sh: hgt, segs: Math.max(4, (hgt / 2.6) | 0), w: rng.next() < 0.3 ? 2 : 1,
        amp: rng.range(1.4, 4.2), lean: rng.range(-2, 2), sp: rng.range(0.7, 1.5), ph: rng.range(0, TAU),
        leaf: rng.next() < 0.45,
        c0: this.fogCss(base, dp, 1.32), c1: this.fogCss(base, dp, 1.0), c2: this.fogCss(base, dp, 0.68),
      });
    }
    for (let i = 0; i < 12000 && this.turf.length < 1100; i++) {
      const x = rng.range(8, W - 8), y = rng.range(sh + 26, H - 8);
      const dp = this.depthAt(x, y);
      if (dp > 0.56 || this.sample(this._patch, x, y) < 0.52 || rng.next() > 0.45) continue;
      const base = this.weedPal[rng.int(0, 4)];
      this.turf.push({
        x, y, dp, n: rng.int(5, 9), r: rng.range(3, 8), h: rng.range(5, 12),
        seed: rng.int(1, 99999), sp: rng.range(1.1, 2.0), ph: rng.range(0, TAU),
        c1: this.fogCss(base, dp, 1.0), c0: this.fogCss(base, dp, 1.3),
      });
    }
  }

  spawnFish() {
    const rng = new SeededRandom(5150);
    this.fish = [];
    const cols = ['#ffd27a', '#8ac6ff', '#ff9ecb', '#6fd88e', '#e6f2ff', '#ff9a3c'];
    for (let s = 0; s < 14; s++) {
      const cx = rng.range(120, this.W - 120), cy = rng.range(this.shoreY + 140, this.H - 120);
      const col = cols[rng.int(0, cols.length - 1)], n = rng.int(4, 11);
      for (let i = 0; i < n; i++) {
        this.fish.push({
          x: cx + rng.range(-60, 60), y: cy + rng.range(-40, 40), a: rng.range(0, TAU),
          s: rng.range(16, 42), ph: rng.range(0, TAU), size: rng.range(3, 8),
          school: s, col, hx: cx, hy: cy,
        });
      }
    }
    this.schools = [];
    for (let s = 0; s < 14; s++) this.schools.push({ x: rng.range(120, this.W - 120), y: rng.range(this.shoreY + 140, this.H - 120), a: rng.range(0, TAU) });
  }

  buildCurrents() {
    this.currents = [];
    const rng = new SeededRandom(1337);
    for (let i = 0; i < 7; i++) this.currents.push({
      x: rng.range(200, this.W - 200), y: rng.range(this.shoreY + 300, this.H - 200), r: rng.range(160, 320),
      s: rng.range(40, 90) * (rng.next() < 0.5 ? -1 : 1), type: 'eddy',
    });
    this.currents.push({ x: this.W / 2, y: this.H * 0.62, r: 9999, s: 18, type: 'drift', ang: rng.range(0, TAU) });
    this.streaks = [];
    for (let i = 0; i < 120; i++) this.streaks.push({ x: rng.range(0, this.W), y: rng.range(this.shoreY, this.H), life: rng.range(0, 3), vx: 0, vy: 0 });
  }

  // =====================================================================
  //  public field API (unchanged semantics)
  // =====================================================================
  idx(x, y) { const cx = clamp(Math.floor(x / this.cell), 0, this.gw - 1), cy = clamp(Math.floor(y / this.cell), 0, this.gh - 1); return cy * this.gw + cx; }
  addBlood(x, y, amt) { this.blood[this.idx(x, y)] += amt; this.bloodOn = true; }
  addFoam(x, y, amt) { this.foam[this.idx(x, y)] += amt; this.foamOn = true; }
  addOil(x, y, amt) { this.oil[this.idx(x, y)] += amt; this.oilOn = true; }
  splatBlood(x, y, amt, spread = 20) { for (let i = 0; i < 6; i++) this.addBlood(x + rand(-spread, spread), y + rand(-spread, spread), amt / 6); }
  ripple(x, y, maxR = 30, speed = 40, alpha = 0.7) { if (this.ripples.length < 400) this.ripples.push({ x, y, r: 2, maxR, speed, alpha }); }
  newWake(owner, width = 6) { const w = { pts: [], owner, width, dead: false }; this.wakes.push(w); return w; }

  flow(x, y) {
    let fx = 0, fy = 0;
    for (const c of this.currents) {
      if (c.type === 'drift') { fx += Math.cos(c.ang) * c.s; fy += Math.sin(c.ang) * c.s; continue; }
      const dx = x - c.x, dy = y - c.y, d = Math.hypot(dx, dy);
      if (d > c.r || d < 1) continue;
      if (c.type === 'lane') { const k = Math.min(1, c.life / 1.5); fx += Math.cos(c.ang) * c.s * k; fy += Math.sin(c.ang) * c.s * k; continue; }
      if (c.type === 'whirl') { const k = (1 - d / c.r) * Math.min(1, c.life / 0.8); fx += (-dy / d * c.s - dx / d * c.s * 0.7) * k; fy += (dx / d * c.s - dy / d * c.s * 0.7) * k; continue; }
      const k = (1 - d / c.r) * Math.min(1, d / 60);
      fx += -dy / d * c.s * k; fy += dx / d * c.s * k;
      fx += -dx / d * c.s * 0.15 * k; fy += -dy / d * c.s * 0.15 * k;
    }
    return { x: fx, y: fy };
  }

  waveHeight(x, y, t) {
    const w = Math.sin(y * 0.075 + x * 0.020 + t * 1.30) * 0.46
      + Math.sin(y * 0.031 - x * 0.012 - t * 0.62) * 0.30
      + Math.sin(x * 0.060 + y * 0.050 + t * 2.00) * 0.20
      + Math.sin(x * 0.033 + y * 0.0132 + t * 0.90) * 0.20;
    return w + (this.jelOn ? this.sample(this.jh, x, y) * 0.45 : 0);
  }
  waveLevel(w) { return w < -0.72 ? 0 : w < -0.36 ? 1 : w < 0 ? 2 : w < 0.36 ? 3 : w < 0.66 ? 4 : w < 0.88 ? 5 : 6; }

  // =====================================================================
  //  jelly water: a damped spring/wave grid the world can shove around
  // =====================================================================
  disturb(x, y, strength, vx = 0, vy = 0) {
    const c = this.cell, gw = this.gw, gh = this.gh, v = this.jv;
    const gx = Math.round(x / c), gy = Math.round(y / c);
    if (gx < 1 || gy < 1 || gx >= gw - 1 || gy >= gh - 1) return;
    const s = clamp(strength, -8, 8) * 0.22;
    const i = gy * gw + gx;
    v[i] -= s;
    v[i - 1] -= s * 0.5; v[i + 1] -= s * 0.5; v[i - gw] -= s * 0.5; v[i + gw] -= s * 0.5;
    v[i - gw - 1] -= s * 0.25; v[i - gw + 1] -= s * 0.25; v[i + gw - 1] -= s * 0.25; v[i + gw + 1] -= s * 0.25;
    const sp = Math.hypot(vx, vy);
    if (sp > 1) {
      const ax = Math.round((x + vx / sp * c * 1.7) / c), ay = Math.round((y + vy / sp * c * 1.7) / c);
      if (ax >= 1 && ay >= 1 && ax < gw - 1 && ay < gh - 1) {
        const j = ay * gw + ax, b = s * 0.8;
        v[j] += b; v[j - 1] += b * 0.4; v[j + 1] += b * 0.4; v[j - gw] += b * 0.4; v[j + gw] += b * 0.4;
      }
    }
    this.jelOn = true; this._jelClean = false;
  }
  // damped wave equation + numerical viscosity: the viscosity term kills the
  // single-cell checkerboard mode so the surface is gelatinous, never jittery
  jelStep() {
    const h = this.jh, n2 = this.jh2, v = this.jv, gw = this.gw, gh = this.gh;
    let maxa = 0;
    for (let y = 1; y < gh - 1; y++) {
      const r = y * gw;
      for (let x = 1; x < gw - 1; x++) {
        const i = r + x, hc = h[i];
        const lap = (h[i - 1] + h[i + 1] + h[i - gw] + h[i + gw]) * 0.25 - hc;
        let vv = (v[i] + lap * 0.50) * 0.968;
        if (vv > 2.5) vv = 2.5; else if (vv < -2.5) vv = -2.5;
        v[i] = vv;
        let nh = (hc + vv + lap * 0.22) * 0.990;
        if (nh > 2.5) nh = 2.5; else if (nh < -2.5) nh = -2.5;
        n2[i] = nh;
        const a = nh < 0 ? -nh : nh; if (a > maxa) maxa = a;
      }
    }
    // double buffered: reading a half-updated grid makes the solver blow up
    this.jh = n2; this.jh2 = h;
    return maxa;
  }
  jelGrad() {
    const h = this.jh, gx = this.jgx, gy = this.jgy, gw = this.gw, gh = this.gh;
    for (let y = 1; y < gh - 1; y++) {
      const r = y * gw;
      for (let x = 1; x < gw - 1; x++) {
        const i = r + x;
        gx[i] = (h[i + 1] - h[i - 1]) * 0.5;
        gy[i] = (h[i + gw] - h[i - gw]) * 0.5;
      }
    }
  }

  // =====================================================================
  //  update
  // =====================================================================
  update(dt, t) {
    this.frame++;
    for (let i = this.currents.length - 1; i >= 0; i--) { const c = this.currents[i]; if (c.life !== undefined) { c.life -= dt; if (c.life <= 0) this.currents.splice(i, 1); } }
    if (this.frame % 2 === 0) { if (this.bloodOn) this.bloodOn = this.diffuse(this.blood, this._blood2, 0.19, 0.9915) > 0.004; }
    else { if (this.foamOn) this.foamOn = this.diffuse(this.foam, this._foam2, 0.22, 0.93) > 0.01; }
    if (this.frame % 3 === 0 && this.oilOn) this.oilOn = this.diffuse(this.oil, this._oil2, 0.08, 0.996) > 0.01;
    // jelly: fixed timestep so it stays buttery regardless of framerate
    if (this.jelOn) {
      this.jelAcc += dt;
      let steps = 0, maxa = 0;
      while (this.jelAcc >= 1 / 60 && steps < 3) { maxa = this.jelStep(); this.jelAcc -= 1 / 60; steps++; }
      if (steps) {
        this.jelGrad();
        if (maxa < 0.004) {
          this.jh.fill(0); this.jh2.fill(0); this.jv.fill(0); this.jgx.fill(0); this.jgy.fill(0);
          this.jelOn = false; this._jelClean = true;
        }
      }
    } else this.jelAcc = 0;
    for (let i = this.ripples.length - 1; i >= 0; i--) {
      const r = this.ripples[i]; r.r += r.speed * dt;
      if (r.r >= r.maxR) this.ripples.splice(i, 1);
    }
    for (let i = this.wakes.length - 1; i >= 0; i--) {
      const w = this.wakes[i];
      while (w.pts.length && t - w.pts[0].t > 2.2) w.pts.shift();
      if (w.dead && !w.pts.length) this.wakes.splice(i, 1);
    }
    for (const s of this.streaks) {
      const f = this.flow(s.x, s.y);
      s.x += f.x * dt * 1.5; s.y += f.y * dt * 1.5; s.life -= dt; s.vx = f.x; s.vy = f.y;
      if (s.life <= 0 || s.x < 0 || s.y < this.shoreY || s.x > this.W || s.y > this.H) {
        s.x = rand(0, this.W); s.y = rand(this.shoreY, this.H); s.life = rand(2, 5);
      }
    }
    // schools drift, fish steer toward their school centre
    for (let i = 0; i < this.schools.length; i++) {
      const sc = this.schools[i];
      sc.a += Math.sin(t * 0.3 + i * 1.7) * dt * 0.9;
      sc.x += Math.cos(sc.a) * 26 * dt; sc.y += Math.sin(sc.a) * 26 * dt;
      if (sc.x < 100 || sc.x > this.W - 100) { sc.a = Math.PI - sc.a; sc.x = clamp(sc.x, 100, this.W - 100); }
      if (sc.y < this.shoreY + 100 || sc.y > this.H - 100) { sc.a = -sc.a; sc.y = clamp(sc.y, this.shoreY + 100, this.H - 100); }
    }
    for (const f of this.fish) {
      f.ph += dt * 6;
      const sc = this.schools[f.school];
      const want = angleTo(f.x, f.y, sc.x, sc.y);
      const far = dist(f.x, f.y, sc.x, sc.y);
      f.a = angleLerp(f.a, want, clamp((far - 25) / 120, 0, 1) * dt * 2.4);
      f.a += Math.sin(f.ph * 0.3) * dt * 0.7;
      const fl = this.flow(f.x, f.y);
      f.x += (Math.cos(f.a) * f.s + fl.x * 0.5) * dt; f.y += (Math.sin(f.a) * f.s + fl.y * 0.5) * dt;
      if (f.x < 0 || f.x > this.W) f.a = Math.PI - f.a;
      if (f.y < this.shoreY + 60 || f.y > this.H) f.a = -f.a;
    }
  }

  diffuse(src, dst, k, decay) {
    const gw = this.gw, gh = this.gh;
    let maxv = 0;
    for (let y = 0; y < gh; y++) {
      const y0 = y * gw, ym = y > 0 ? y0 - gw : y0, yp = y < gh - 1 ? y0 + gw : y0;
      for (let x = 0; x < gw; x++) {
        const c = src[y0 + x];
        if (c < 0.001) { dst[y0 + x] = 0; continue; }
        const xm = x > 0 ? x - 1 : x, xp = x < gw - 1 ? x + 1 : x;
        const avg = (src[ym + x] + src[yp + x] + src[y0 + xm] + src[y0 + xp]) * 0.25;
        const v = (c + (avg - c) * k) * decay;
        dst[y0 + x] = v; if (v > maxv) maxv = v;
      }
      for (let x = 0; x < gw; x++) {
        const c = src[y0 + x]; if (c < 0.02) continue;
        const xm = x > 0 ? x - 1 : x, xp = x < gw - 1 ? x + 1 : x;
        const give = c * k * 0.25;
        if (src[ym + x] < 0.001) dst[ym + x] += give;
        if (src[yp + x] < 0.001) dst[yp + x] += give;
        if (src[y0 + xm] < 0.001) dst[y0 + xm] += give;
        if (src[y0 + xp] < 0.001) dst[y0 + xp] += give;
      }
    }
    src.set(dst);
    return maxv;
  }

  sample(field, wx, wy) {
    const fx = wx / this.cell - 0.5, fy = wy / this.cell - 0.5;
    const x0 = Math.floor(fx), y0 = Math.floor(fy);
    if (x0 < 0 || y0 < 0 || x0 >= this.gw - 1 || y0 >= this.gh - 1) return 0;
    const tx = fx - x0, ty = fy - y0, i = y0 * this.gw + x0;
    const a = field[i], b = field[i + 1], c = field[i + this.gw], d = field[i + this.gw + 1];
    return (a * (1 - tx) + b * tx) * (1 - ty) + (c * (1 - tx) + d * tx) * ty;
  }

  // bilinear-resolve one horizontal strip of a grid field (no per-pixel div)
  fillRow(out, field, wy, wx0, n, step) {
    const c = this.cell, gw = this.gw, gh = this.gh;
    const fy = wy / c - 0.5;
    let y0 = Math.floor(fy), ty = fy - y0;
    if (y0 < 0) { y0 = 0; ty = 0; } else if (y0 > gh - 2) { y0 = gh - 2; ty = 1; }
    const r0 = y0 * gw, r1 = r0 + gw, sy = 1 - ty, dtx = step / c;
    let fx = wx0 / c - 0.5;
    let x0 = Math.floor(fx), tx = fx - x0;
    for (let i = 0; i < n; i++) {
      if (x0 < 0) out[i] = field[r0] * sy + field[r1] * ty;
      else if (x0 > gw - 2) { const j = gw - 1; out[i] = field[r0 + j] * sy + field[r1 + j] * ty; }
      else {
        const a = field[r0 + x0], b = field[r0 + x0 + 1], cc = field[r1 + x0], d = field[r1 + x0 + 1];
        out[i] = (a + (b - a) * tx) * sy + (cc + (d - cc) * tx) * ty;
      }
      tx += dtx;
      if (tx >= 1) { const k = tx | 0; x0 += k; tx -= k; }
    }
  }

  // =====================================================================
  //  render the background (640x360)
  // =====================================================================
  render(ctx, cam, t) {
    const camX = Math.round(cam.x), camY = Math.round(cam.y);
    const ox = camX & 1, oy = camY & 1;
    const cx2 = camX - ox, cy2 = camY - oy;
    this.cx2 = cx2; this.cy2 = cy2;
    const d = this.data, lw = this.lw, lh = this.lh, shore = this.shoreY;
    const wLUT = this.waterLUT, visLUT = this.visLUT, shoal = this.shoalLUT;
    const absR = this.absR, absG = this.absG, absB = this.absB;
    const cR = this.cR, cG = this.cG, cB = this.cB;
    const sb = this.sb, sbw = this.sbw, sbh = this.sbh, sbx0 = cx2 >> 1;
    const rD = this.rD, rJ = this.rJ, rGX = this.rGX, rGY = this.rGY, rB = this.rB, rF = this.rF, rO = this.rO;
    const jelOn = this.jelOn, bloodOn = this.bloodOn, foamOn = this.foamOn, oilOn = this.oilOn;
    const bloodC = this.bloodC, bloodB = this.bloodBright, foamC = this.foamC, oilC = this.oilC;
    const K = _OS_K, M = _OS_M, S = _OS;
    const sparkT = Math.floor(t * 5) * 7;
    const REFR = 12.0, JW = 0.78;
    // wave term constants: [xFreq, yFreq, timeFreq, amp]
    const A1 = 0.46, A2 = 0.30, A3 = 0.20, A4 = 0.20;
    const d1 = 0.020 * 2 * K, d2 = -0.012 * 2 * K, d3 = 0.060 * 2 * K, d4 = 0.033 * 2 * K;
    // caustic term constants
    const e1 = 0.079 * 2 * K, e2 = -0.061 * 2 * K, e3 = 0.031 * 2 * K;
    let p = 0;
    for (let py = 0; py < lh; py++) {
      const wy = cy2 + py * 2;
      // ------------------------------------------------ beach & village land
      if (wy < shore - 10) {
        let wx = cx2;
        for (let px = 0; px < lw; px++, p += 4, wx += 2) {
          const n = vnoise(wx * 0.05, wy * 0.05);
          const gl = shore - 120 + n * 60;
          let r, g, b;
          if (wy < gl - 6) {
            const v = 0.94 + hash2(wx >> 3, wy >> 3) * 0.12;
            const c = hash2(wx >> 1, (wy >> 1) + 31) > 0.955 ? this.grassC3 : hash2(wx >> 2, wy >> 2) > 0.5 ? this.grassC : this.grassC2;
            r = c[0] * v; g = c[1] * v; b = c[2] * v;
          } else if (wy < gl + 2 && hash2(wx >> 1, wy >> 1) > 0.45) {
            const c = this.grassC2; r = c[0]; g = c[1]; b = c[2];
          } else {
            const wet = wy > shore - 34 ? clamp((wy - (shore - 34)) / 24, 0, 1) : 0;
            const h = hash2(wx >> 1, wy >> 1);
            let c = h > 0.90 ? this.sandW : h > 0.62 ? this.sandD : this.sandL;
            // tide ribbons
            const tide = S[((wx * 0.03 * K + n * 900) | 0) & M];
            if (tide > 0.72 && wet > 0.05) c = this.sandW;
            r = c[0] * (1 - wet * 0.28); g = c[1] * (1 - wet * 0.26); b = c[2] * (1 - wet * 0.16);
            if (h > 0.995) { r = 240; g = 232; b = 214; }  // shells on the beach
          }
          d[p] = r; d[p + 1] = g; d[p + 2] = b;
        }
        continue;
      }
      // ------------------------------------------------------------- water
      this.fillRow(rD, this.depth, wy, cx2, lw, 2);
      if (jelOn) { this.fillRow(rJ, this.jh, wy, cx2, lw, 2); this.fillRow(rGX, this.jgx, wy, cx2, lw, 2); this.fillRow(rGY, this.jgy, wy, cx2, lw, 2); }
      if (bloodOn) this.fillRow(rB, this.blood, wy, cx2, lw, 2);
      if (foamOn) this.fillRow(rF, this.foam, wy, cx2, lw, 2);
      if (oilOn) this.fillRow(rO, this.oil, wy, cx2, lw, 2);
      let p1 = (wy * 0.075 + cx2 * 0.020 + t * 1.30) * K;
      let p2 = (wy * 0.031 - cx2 * 0.012 - t * 0.62) * K;
      let p3 = (cx2 * 0.060 + wy * 0.050 + t * 2.00) * K;
      let p4 = (cx2 * 0.033 + wy * 0.0132 + t * 0.90) * K;
      let q1 = (cx2 * 0.079 + wy * 0.048 + t * 1.15) * K;
      let q2 = (-cx2 * 0.061 + wy * 0.086 - t * 0.95) * K;
      let q3 = (cx2 * 0.031 - wy * 0.027 + t * 0.55) * K;
      const sbyBase = wy >> 1;
      const nearShore = wy < shore + 70;
      let wx = cx2;
      for (let px = 0; px < lw; px++, p += 4, wx += 2) {
        let wv = A1 * S[(p1 | 0) & M] + A2 * S[(p2 | 0) & M] + A3 * S[(p3 | 0) & M] + A4 * S[(p4 | 0) & M];
        p1 += d1; p2 += d2; p3 += d3; p4 += d4;
        const dp = rD[px];
        let band = (dp * 15.999) | 0; if (band > 15) band = 15; else if (band < 0) band = 0;
        let jh = 0, gx = 0, gy = 0;
        if (jelOn) { jh = rJ[px]; gx = rGX[px]; gy = rGY[px]; }
        wv = wv * shoal[band] + jh * JW;
        const lvl = wv < -0.72 ? 0 : wv < -0.36 ? 1 : wv < 0 ? 2 : wv < 0.36 ? 3 : wv < 0.66 ? 4 : wv < 0.88 ? 5 : 6;
        const vis = visLUT[band];
        const wi = (band * 7 + lvl) * 3;
        const wr = wLUT[wi], wg = wLUT[wi + 1], wb = wLUT[wi + 2];
        let r, g, b;
        if (vis > 0) {
          // --- animated caustics: three warped sine fields, posterized -----
          const s3 = S[(q3 | 0) & M];
          const s1 = S[((q1 + s3 * 210) | 0) & M];
          const s2 = S[((q2 - s3 * 170) | 0) & M];
          const cv = s1 + s2 + s3 * 0.55;
          let cl = cv > 1.98 ? 3 : cv > 1.50 ? 2 : cv > 0.95 ? 1 : 0;
          if (band >= 10) cl = 0; else if (band >= 7 && cl > 0) cl--;
          // --- seabed, refracted by the swell + the jelly field ------------
          let ox2 = wv * 2.4 + gx * REFR; if (ox2 > 6) ox2 = 6; else if (ox2 < -6) ox2 = -6;
          let oy2 = wv * 1.6 + gy * REFR; if (oy2 > 6) oy2 = 6; else if (oy2 < -6) oy2 = -6;
          let sx = sbx0 + px + (ox2 | 0);
          let sy = sbyBase + (oy2 | 0);
          if (sx < 0) sx = 0; else if (sx >= sbw) sx = sbw - 1;
          if (sy < 0) sy = 0; else if (sy >= sbh) sy = sbh - 1;
          const si = (sy * sbw + sx) << 2, ci = band * 4 + cl;
          const sr = sb[si] * absR[band] + cR[ci], sg = sb[si + 1] * absG[band] + cG[ci], sbb = sb[si + 2] * absB[band] + cB[ci];
          r = wr + (sr - wr) * vis; g = wg + (sg - wg) * vis; b = wb + (sbb - wb) * vis;
        } else {
          r = wr; g = wg; b = wb;
          // deep-water plankton glints keep the gloom alive
          if ((px & 3) === 0 && (py & 3) === 0 && hash2(wx >> 2, (wy >> 2) + sparkT) > 0.986) { r += 26; g += 44; b += 58; }
        }
        q1 += e1; q2 += e2; q3 += e3;
        // --- specular sun glitter on the crests --------------------------
        if (lvl >= 5) {
          const hs = hash2(wx >> 2, (wy >> 2) + sparkT);
          if (hs > (lvl === 6 ? 0.972 : 0.992)) { r = 226; g = 250; b = 255; }
          else if (hs > 0.93 && lvl === 6) { r = (r + 300) * 0.5; g = (g + 330) * 0.5; b = (b + 340) * 0.5; }
        }
        // --- drifting fields ---------------------------------------------

    for (let i = l.length - 1; i >= 0; i--) {
      const p = l[i];
      p.life -= dt;
      if (p.life <= 0) { l[i] = l[l.length - 1]; l.pop(); continue; }
      switch (p.type) {
        case 'drop': case 'blood': case 'debris': case 'shell':
          p.x += p.vx * dt; p.y += p.vy * dt;
          if (p.z !== undefined) {
            p.z += p.vz * dt; p.vz -= 380 * dt;
            if (p.z <= 0 && p.vz < 0) {
              p.z = 0;
              if (p.type === 'drop') { this.ocean.addFoam(p.x, p.y, 0.08); p.life = 0; if (Math.random() < 0.25) this.ocean.ripple(p.x, p.y, 8, 30, 0.4); }
              else if (p.type === 'blood') { this.ocean.addBlood(p.x, p.y, p.amt); p.life = 0; }
              else if (p.type === 'debris') { p.vz = 0; p.vx *= 0.3; p.vy *= 0.3; p.vr *= 0.2; p.floating = true; if (!p.splashed) { p.splashed = true; this.ocean.addFoam(p.x, p.y, 0.2); } }
              else if (p.type === 'shell') { p.life = Math.min(p.life, 0.3); p.vx = 0; p.vy = 0; }
            }
          }
          if (p.floating && flowFn) { const f = flowFn(p.x, p.y); p.x += f.x * dt; p.y += f.y * dt; p.rot += p.vr * dt; }
          else if (p.rot !== undefined) p.rot += p.vr * dt;
          break;
        case 'smoke': p.x += p.vx * dt; p.y += p.vy * dt; p.size += 6 * dt; p.vx *= 0.98; break;
        case 'fire': p.x += p.vx * dt; p.y += p.vy * dt; p.size *= 0.97; break;
        case 'spark': p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.92; p.vy *= 0.92; break;
        case 'bubble': p.x += p.vx * dt; p.y += p.vy * dt; break;
      }
    }
    for (let i = this.explosions.length - 1; i >= 0; i--) {
      const e = this.explosions[i]; e.life += dt;
      e.r = e.maxR * Math.min(1, Math.pow(e.life / e.dur, 0.45));
      if (e.life > e.dur) this.explosions.splice(i, 1);
    }
    for (let i = this.texts.length - 1; i >= 0; i--) { const t = this.texts[i]; t.life -= dt; t.y += t.vy * dt; if (t.life <= 0) this.texts.splice(i, 1); }
  }
  // draw particles that sit under sprites (floating debris, foam bits)
  renderUnder(ctx, cam) {
    for (const p of this.list) {
      if (p.type !== 'debris' || !p.floating) continue;
      const sx = p.x - cam.x, sy = p.y - cam.y; if (sx < -10 || sy < -10 || sx > 650 || sy > 370) continue;
      ctx.save(); ctx.translate(Math.round(sx), Math.round(sy)); ctx.rotate(p.rot); ctx.globalAlpha = Math.min(1, p.life);
      ctx.fillStyle = p.color; ctx.fillRect(-p.w / 2 | 0, -p.h / 2 | 0, p.w, p.h); ctx.restore();
    }
  }
  render(ctx, cam) {
    ctx.globalAlpha = 1;
    for (const p of this.list) {
      const sx = p.x - cam.x, sy = p.y - cam.y; if (sx < -20 || sy < -20 || sx > 660 || sy > 380) continue;
      switch (p.type) {
        case 'drop': ctx.fillStyle = p.color; ctx.fillRect(Math.round(sx), Math.round(sy - p.z), p.size, p.size); break;
        case 'blood': ctx.fillStyle = p.color; ctx.fillRect(Math.round(sx), Math.round(sy - p.z), p.size, p.size); break;
        case 'debris': if (p.floating) break;
          ctx.save(); ctx.translate(Math.round(sx), Math.round(sy - p.z)); ctx.rotate(p.rot); ctx.fillStyle = p.color; ctx.fillRect(-p.w / 2 | 0, -p.h / 2 | 0, p.w, p.h); ctx.restore(); break;
        case 'shell': ctx.save(); ctx.translate(Math.round(sx), Math.round(sy - p.z)); ctx.rotate(p.rot); ctx.globalAlpha = Math.min(1, p.life * 3); ctx.drawImage(SP.shell.c, -1, -1); ctx.restore(); ctx.globalAlpha = 1; break;
        case 'smoke': { const k = p.life / p.maxLife; ctx.fillStyle = p.color + (0.55 * k).toFixed(2) + ')'; const s = Math.round(p.size); ctx.fillRect(Math.round(sx - s / 2), Math.round(sy - s / 2), s, s); break; }
        case 'fire': { const k = p.life / p.maxLife; ctx.fillStyle = k > 0.6 ? '#ffe48f' : k > 0.3 ? '#ff9a3c' : '#c8302e'; const s = Math.max(1, Math.round(p.size)); ctx.fillRect(Math.round(sx - s / 2), Math.round(sy - s / 2), s, s); break; }
        case 'spark': ctx.fillStyle = p.color; ctx.fillRect(Math.round(sx), Math.round(sy), 1, 1); if (p.life > 0.2) ctx.fillRect(Math.round(sx - p.vx * 0.01), Math.round(sy - p.vy * 0.01), 1, 1); break;
        case 'bubble': ctx.strokeStyle = 'rgba(220,245,255,0.7)'; ctx.lineWidth = 1; ctx.strokeRect(Math.round(sx), Math.round(sy), p.size, p.size); break;
      }
    }
    // explosions: chunky posterized rings
    for (const e of this.explosions) {
      const sx = Math.round(e.x - cam.x), sy = Math.round(e.y - cam.y), k = e.life / e.dur;
      const r = Math.round(e.r);
      ctx.beginPath(); ctx.arc(sx, sy, r, 0, TAU); ctx.fillStyle = k < 0.3 ? '#fff6d5' : k < 0.55 ? '#ffd27a' : k < 0.8 ? '#ff9a3c' : 'rgba(60,50,55,0.6)'; ctx.fill();
      if (k > 0.2) { ctx.beginPath(); ctx.arc(sx, sy, Math.round(r * 0.72), 0, TAU); ctx.fillStyle = k < 0.5 ? '#ffe48f' : k < 0.75 ? '#e6802a' : 'rgba(30,25,30,0.7)'; ctx.fill(); }
      if (k > 0.4) { ctx.beginPath(); ctx.arc(sx, sy, Math.round(r * 0.42), 0, TAU); ctx.fillStyle = k < 0.7 ? '#c8302e' : 'rgba(20,18,22,0.8)'; ctx.fill(); }
      if (k < 0.5 && e.water) { // shock ring on the water
        ctx.strokeStyle = `rgba(255,255,255,${(1 - k * 2).toFixed(2)})`; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.ellipse(sx, sy, Math.round(r * 1.5), Math.round(r * 1.1), 0, 0, TAU); ctx.stroke();
      }
    }
    for (const t of this.texts) {
      ctx.globalAlpha = Math.min(1, t.life * 2);
      pixelText(ctx, t.str, Math.round(t.x - cam.x), Math.round(t.y - cam.y), t.size, t.color, 'center');
    }
    ctx.globalAlpha = 1;
  }
}

class SkillTree {
  constructor() { this.unlocked = new Set(); this.scrap = { metal: 0, wood: 0, fuel: 0, powder: 0, tech: 0 }; this.primary = 'revolver'; this.sidearm = null; this.totalCollected = 0; }

  available(node) {
    if (!node.req.length) return true;

  }
  canAfford(node) { for (const k in node.cost) if ((this.scrap[k] || 0) < node.cost[k]) return false; return true; }
  buy(node) {

    for (const id of this.unlocked) {

}

// ---- Entities: player, enemies, projectiles, pickups, rocks --------------
let G = null; // the running Game (set in game.js)

function circleHit(ax, ay, ar, bx, by, br) { const dx = bx - ax, dy = by - ay; const r = ar + br; return dx * dx + dy * dy < r * r; }

// ============================ ROCK ====================================
class Rock {
  constructor(x, y, r, seed) { this.x = x; this.y = y; this.r = r; this.sprite = makeRock(seed, r); this.glow = 0; }
  render(ctx, cam, t) {
    const sx = Math.round(this.x - cam.x), sy = Math.round(this.y - cam.y);
    if (sx < -90 || sy < -90 || sy > 460 || sx > 740) return;
    // surf breaking on the rock: the dilated silhouette, dithered so it
    // shimmers, and pulsing with the swell instead of a drawn-on ellipse
    const fm = this.sprite.foam;
    if (fm) {
      const pulse = 0.34 + Math.sin(t * 2.1 + this.x * 0.05) * 0.2;
      ctx.save();
      ctx.globalAlpha = clamp(pulse, 0.08, 0.6);
      ctx.drawImage(fm.c, sx - fm.ax, sy - fm.ay);
      ctx.globalAlpha = clamp(pulse * 0.7, 0.05, 0.4);
      ctx.drawImage(fm.c, sx - fm.ax, sy - fm.ay + 1);
      ctx.restore();
    }
    if (this.glow > 0) {
      if (!this.glowSprite) this.glowSprite = tintSprite(this.sprite, '#ffe48f', 0.9);
      ctx.save();
      ctx.globalAlpha = clamp(this.glow * (0.5 + Math.sin(t * 12) * 0.3), 0, 1);
      ctx.drawImage(this.glowSprite.c, sx - this.glowSprite.ax, sy - this.glowSprite.ay);
      ctx.restore();
    }
    drawSprite(ctx, this.sprite, sx, sy);
  }
}

// ============================ PICKUP ==================================
class Pickup {
  constructor(x, y, type) { this.x = x; this.y = y; this.type = type; const a = rand(0, TAU), s = rand(40, 120); this.vx = Math.cos(a) * s; this.vy = Math.sin(a) * s; this.z = 0; this.vz = rand(60, 140); this.life = 30; this.ph = rand(0, TAU); this.dead = false; this.magnetized = false; }
  update(dt) {

    const mr = 42 * p.stats.magnet;
    if (d < mr && this.z <= 0) {
      this.magnetized = true;
      const k = Math.min(1, (mr - d) / mr + 0.3);

    } else { this.vx *= 0.9; this.vy *= 0.9; const f = G.ocean.flow(this.x, this.y); this.vx += f.x * 0.05; this.vy += f.y * 0.05; }

    if (this.z > 0 || this.vz > 0) { this.z += this.vz * dt; this.vz -= 320 * dt; if (this.z <= 0 && this.vz < 0) { this.z = 0; this.vz = 0; G.ocean.addFoam(this.x, this.y, 0.15); } }
    if (d < 12) {
      this.dead = true;
      const n = 1 + p.stats.scrapBonus;
      G.tree.addScrap(this.type, n);
      G.particles.text(this.x, this.y - 6, '+' + n, SCRAP_COLORS[this.type], 7);
      Audio_.pickup(SCRAP_TYPES.indexOf(this.type));
      G.stats.scrapCollected += n;
    }
  }
  render(ctx, cam, t) {
    const sx = this.x - cam.x, sy = this.y - cam.y - this.z; if (sx < -10 || sy < -10 || sx > 650 || sy > 370) return;
    const bob = this.z > 0 ? 0 : Math.sin(t * 4 + this.ph) * 1.5;
    if (this.z <= 0) { ctx.fillStyle = 'rgba(6,18,48,0.3)'; ctx.fillRect(Math.round(sx - 3), Math.round(sy + 3), 7, 3); }
    if (this.life < 5 && Math.floor(t * 8) % 2 === 0) return;

    if (Math.sin(t * 5 + this.ph) > 0.85) { ctx.fillStyle = '#fff'; ctx.fillRect(Math.round(sx - 3), Math.round(sy + bob - 4), 1, 1); }
  }
}

// ============================ PROJECTILE ==============================
class Projectile {
  constructor(o) {
    Object.assign(this, { x: 0, y: 0, vx: 0, vy: 0, life: 1, dmg: 10, owner: 'player', sprite: SP.bullet, pierce: 0, ricochet: 0, explode: 0, knock: 40, absorbable: true, size: 3, z: 0, vz: 0, arc: false, slow: 0, crit: false, burn: 0, hits: null, trail: false, dead: false, homing: 0, weapon: null }, o);
    this.hits = new Set(); this.age = 0;
  }
  update(dt) {
    this.age += dt; this.life -= dt;
    if (this.life <= 0) { if (this.explode) this.detonate(); this.dead = true; return; }
    if (this.arc) { this.z += this.vz * dt; this.vz -= 300 * dt; if (this.z <= 0 && this.age > 0.1) { this.detonate(); this.dead = true; return; } }
    if (this.homing && this.owner === 'player') {
      const tgt = G.nearestEnemy(this.x, this.y, 200);
      if (tgt) { const a = angleTo(this.x, this.y, tgt.x, tgt.y), cur = Math.atan2(this.vy, this.vx), sp = Math.hypot(this.vx, this.vy); const na = angleLerp(cur, a, this.homing * dt); this.vx = Math.cos(na) * sp; this.vy = Math.sin(na) * sp; }
    }
    this.x += this.vx * dt; this.y += this.vy * dt;
    if (this.x < -50 || this.y < -50 || this.x > G.ocean.W + 50 || this.y > G.ocean.H + 50) { this.dead = true; return; }
    // rocks block bullets (not arcing ones)
    if (!this.arc && this.z <= 0) for (const r of G.rocks) if (circleHit(this.x, this.y, this.size, r.x, r.y, r.r - 2)) {
      G.particles.sparks(this.x, this.y, 4); if (this.explode) this.detonate(); this.dead = true; return;
    }
    if (this.arc && this.z > 0) return; // in the air
    if (this.owner === 'player') {
      for (const e of G.enemies) {
        if (e.dead || this.hits.has(e)) continue;
        if (circleHit(this.x, this.y, this.size, e.x, e.y, e.radius)) { this.onHit(e); if (this.dead) return; }
      }
      if (G.boss && !G.boss.dead && !this.hits.has(G.boss) && circleHit(this.x, this.y, this.size, G.boss.x, G.boss.y, G.boss.radius)) this.onHit(G.boss);
      if (G.fisherman && G.fisherman.alive && circleHit(this.x, this.y, this.size + 4, G.fisherman.x, G.fisherman.y - 8, 10)) { G.fisherman.shot(this); this.dead = true; }
    } else {
      const p = G.player;
      if (p.dead) return;
      const d = dist(this.x, this.y, p.x, p.y);
      if (p.absorb.active && this.absorbable && d < 34) { p.absorbHit(this); this.dead = true; return; }
      if (d < 12 + this.size && !p.diving) {
        if (p.rolling) { this.dead = true; G.particles.sparks(this.x, this.y, 3); return; }
        if (this.explode) { this.detonate(); this.dead = true; return; }
        p.damage(this.dmg, this.x, this.y);
        if (this.slow) p.slowed = Math.max(p.slowed, this.slow);
        this.dead = true; return;
      }
      // decoy buoy takes hits
      if (G.buoy && !G.buoy.dead && dist(this.x, this.y, G.buoy.x, G.buoy.y) < 10) { G.buoy.hp -= this.dmg; G.particles.sparks(this.x, this.y, 3); this.dead = true; }
    }
  }
  onHit(e) {
    this.hits.add(e);
    let dmg = this.dmg;
    if (this.crit) dmg *= G.player.stats.critMult;
    const l = Math.hypot(this.vx, this.vy) || 1;
    e.hit(dmg, this.vx / l * this.knock, this.vy / l * this.knock, this);
    if (this.burn) e.burn = Math.max(e.burn || 0, 4);
    if (this.explode) { this.detonate(); this.dead = true; return; }
    if (this.pierce > 0) { this.pierce--; return; }
    if (this.ricochet > 0) {
      const tgt = G.nearestEnemy(this.x, this.y, 170, e);
      if (tgt) { this.ricochet--; const a = angleTo(this.x, this.y, tgt.x, tgt.y); this.vx = Math.cos(a) * l; this.vy = Math.sin(a) * l; this.life = Math.max(this.life, 0.6); G.particles.sparks(this.x, this.y, 5); return; }
    }
    this.dead = true;
  }
  detonate() {

    const r = this.explode;

    G.shake(r / 12);
    if (this.owner === 'player') {
      for (const e of G.enemies) if (!e.dead && dist(this.x, this.y, e.x, e.y) < r + e.radius) { const a = angleTo(this.x, this.y, e.x, e.y); e.hit(this.dmg * (this.hits.has(e) ? 0.5 : 1), Math.cos(a) * this.knock * 2, Math.sin(a) * this.knock * 2, this); }
      const b = G.boss; if (b && !b.dead && dist(this.x, this.y, b.x, b.y) < r + b.radius) b.hit(this.dmg * (this.hits.has(b) ? 0.5 : 1), 0, 0, this);
    } else {
      const p = G.player;
      if (!p.diving && dist(this.x, this.y, p.x, p.y) < r + 10) p.damage(this.dmg, this.x, this.y);
      // enemy explosions hurt other boats too (dynamite is indiscriminate)
      for (const e of G.enemies) if (!e.dead && dist(this.x, this.y, e.x, e.y) < r + e.radius) e.hit(this.dmg * 0.5, 0, 0, null);
    }
  }
  render(ctx, cam) {
    const sx = this.x - cam.x, sy = this.y - cam.y - this.z; if (sx < -20 || sy < -20 || sx > 660 || sy > 380) return;
    const a = Math.atan2(this.vy, this.vx);
    if (this.z > 0) { ctx.fillStyle = 'rgba(6,18,48,0.35)'; ctx.fillRect(Math.round(sx) - 2, Math.round(this.y - cam.y) - 1, 4, 2); }
    if (this.trail) { ctx.strokeStyle = this.owner === 'player' ? 'rgba(255,230,150,0.5)' : 'rgba(255,120,120,0.5)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(Math.round(sx), Math.round(sy)); ctx.lineTo(Math.round(sx - this.vx * 0.02), Math.round(sy - this.vy * 0.02)); ctx.stroke(); }
    const sc = this.crit ? 1.5 : 1;
    drawSprite(ctx, this.sprite, sx, sy, this.arc ? this.age * 8 : a, sc, sc);
  }
}

// ============================ WRECK (sinking boat) ======================
class Wreck {
  constructor(sprite, x, y, angle, radius) { this.sprite = sprite; this.x = x; this.y = y; this.angle = angle; this.t = 0; this.dur = 2.2 + radius / 20; this.radius = radius; this.dead = false; this.smokeT = 0; }

    if (this.smokeT <= 0) { this.smokeT = 0.08; G.particles.smoke(this.x + rand(-this.radius, this.radius) * 0.5, this.y + rand(-4, 4), 1, 'rgba(30,28,34,', 5); if (Math.random() < 0.5) G.particles.fire(this.x + rand(-this.radius, this.radius) * 0.4, this.y, 1); if (Math.random() < 0.3) G.particles.bubbles(this.x + rand(-8, 8), this.y + rand(-4, 4), 1); }

    G.ocean.addOil(this.x, this.y, 0.02);
  }
  render(ctx, cam) {
    const k = this.t / this.dur, sx = this.x - cam.x, sy = this.y - cam.y;

    // it lists and sinks: squash on one axis, darken

// ============================ PLAYER (manatee + otter) ==================

  constructor(x, y, tree) {

    this.absorb = { active: false, t: 0, cd: 0, flash: 0 };

    this.weaponCd = { primary: 0, sidearm: 0 };
    this.recoil = { primary: 0, sidearm: 0 }; this.flash = { primary: 0, sidearm: 0 };
    this.aim = 0; this.target = null; this.invuln = 0; this.hurt = 0; this.boost = 0; this.slowed = 0; this.slipT = 0;
    this.swimPhase = 0; this.joyT = 0; this.regenAcc = 0; this.secondWindUsed = false; this.usedSecondWind = false;

  }

    for (const k of ['primary', 'sidearm']) { this.weaponCd[k] -= dt; this.recoil[k] = Math.max(0, this.recoil[k] - dt); this.flash[k] -= dt; }
    if (this.roll.charges < st.rollCharges) { this.roll.rechargeT -= dt; if (this.roll.rechargeT <= 0) { this.roll.charges++; this.roll.rechargeT = this.cd(2.4 * st.rollCd); } }

    if (Input.actHit('roll') && !this.roll.active && this.roll.charges > 0 && !this.dive.active) this.startRoll(inp);
    if (Input.actHit('shield') && !this.absorb.active && this.absorb.cd <= 0 && !this.roll.active) { this.absorb.active = true; this.absorb.t = 0; G.ocean.ripple(this.x, this.y, 40, 120, 0.6); }
    if (Input.actHit('rampage') && this.rampage.meter >= 100 && !this.rampage.active) this.startRampage();
    if (st.dive && Input.actHit('dive') && !this.dive.active && this.dive.cd <= 0 && !this.roll.active) { this.dive.active = true; this.dive.t = 0; G.particles.splash(this.x, this.y, 1.6); G.particles.bubbles(this.x, this.y, 8); Audio_.splash(1.2); }

// ============================ FISHERMAN on the pier ======================
class Fisherman {
  constructor(x, y) { this.x = x; this.y = y; this.alive = true; this.t = 0; this.deadT = 0; this.fallVy = 0; this.fallX = x; this.fallY = y; this.rot = 0; this.sunk = false; }
  shot(proj) {
    if (!this.alive) return; this.alive = false; this.deadT = 0;
    G.particles.blood(this.x, this.y - 10, 2.5, Math.atan2(proj.vy, proj.vx));
    G.particles.sparks(this.x, this.y - 10, 8); G.shake(6); Audio_.hurt();
    // Gore takes a HEIGHT as its last argument, not a screen offset, so the
    // blood pools at his feet on the pier rather than behind him.
    if (typeof Gore !== 'undefined') { const a = Math.atan2(proj.vy, proj.vx); Gore.burst(this.x, this.y, 2.2, a, 12); Gore.spray(this.x, this.y, a, 2.4, 12); Gore.mist(this.x, this.y, 8, 12); }
    Toon.impact(this.x, this.y - 12, 1.8, '#ff6161');
    this.fallVx = Math.cos(Math.atan2(proj.vy, proj.vx)) * 40; this.fallVy = -60; this.fallZ = 0;
    G.onFishermanShot();
  }
  update(dt) {
    this.t += dt;
    if (!this.alive && !this.sunk) {
      this.deadT += dt; this.fallVy += 220 * dt; this.fallY += this.fallVy * dt; this.fallX += this.fallVx * dt; this.rot += dt * 4;
      if (this.fallY > G.ocean.shoreY + 26) { this.sunk = true; G.particles.splash(this.fallX, this.fallY, 2.2); G.particles.blood(this.fallX, this.fallY, 3); G.ocean.splatBlood(this.fallX, this.fallY, 4, 24); Audio_.splash(1.5); }
      if (Math.random() < 0.6) G.particles.blood(this.fallX, this.fallY - 10, 0.15);
    }
  }
  render(ctx, cam, t) {
    if (this.sunk) return;
    if (this.alive) {
      const sx = this.x - cam.x, sy = this.y - cam.y + Math.sin(t * 2) * 0.5;
      drawSprite(ctx, SP.fisherman, sx, sy);
      // fishing rod
      ctx.strokeStyle = '#5c3a1c'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(Math.round(sx + 5), Math.round(sy - 10)); ctx.lineTo(Math.round(sx + 16), Math.round(sy - 24)); ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.beginPath(); ctx.moveTo(Math.round(sx + 16), Math.round(sy - 24)); ctx.lineTo(Math.round(sx + 18), Math.round(sy + 12 + Math.sin(t * 3) * 2)); ctx.stroke();
    } else drawSprite(ctx, SP.fishermanDead, this.fallX - cam.x, this.fallY - cam.y, this.rot);
  }
}

// ---- BOSS: The Village Chief, riding a shark -----------------------------
class Boss {
  constructor(x, y) {
    this.x = x; this.y = y; this.vx = 0; this.vy = 0; this.angle = 0; this.radius = 26;
    this.maxHp = 1500; this.hp = this.maxHp; this.phase = 1; this.dead = false; this.name = 'VILLAGE CHIEF';
    this.state = 'enter'; this.stateT = 0; this.spearT = 1.5; this.flash = 0; this.orbitDir = 1; this.circleDur = 3;
    this.chargeDir = 0; this.chargeT = 0; this.chargeCount = 0; this.stunDur = 3; this.whirlT = 0; this.summonT = 0; this.volleyT = 0; this.bleedT = 0;
    this.wake = G.ocean.newWake(this, 16); this.sweep = null; this.bob = 0; this.roarT = 0; this.intro = 2.5; this.wasStunnedHits = 0;
  }
  get stunned() { return this.state === 'stunned'; }
  get charging() { return this.state === 'charge'; }
  setState(s) { this.state = s; this.stateT = 0; }
  update(dt, t) {
    if (this.dead) return;
    const p = G.player; this.stateT += dt; this.flash -= dt; this.intro -= dt;
    const d = dist(this.x, this.y, p.x, p.y), toP = angleTo(this.x, this.y, p.x, p.y);
    const p2 = this.phase === 2;
    let desired = this.angle, speed = 0;
    switch (this.state) {
      case 'enter': desired = toP; speed = 200; if (this.stateT > 1.6 || d < 260) this.setState('circle'); break;
      case 'circle': {
        const r = 240;
        if (d > r + 60) desired = toP; else if (d < r - 60) desired = toP + Math.PI; else desired = toP + Math.PI / 2 * this.orbitDir;
        speed = p2 ? 190 : 150;
        this.spearT -= dt;
        if (this.spearT <= 0) { this.spearT = p2 ? 1.1 : 1.6; this.throwSpear(toP, p); }
        if (p2) {
          this.whirlT -= dt; if (this.whirlT <= 0) { this.whirlT = 7; this.spawnWhirlpool(p); }
          this.volleyT -= dt; if (this.volleyT <= 0) { this.volleyT = 5.5; this.volley(toP); }
        }

        break;
      }
      case 'windup': {
        speed = 0; desired = toP; this.vx *= Math.pow(0.05, dt); this.vy *= Math.pow(0.05, dt);
        this.angle = angleLerp(this.angle, toP + Math.sin(this.stateT * 40) * 0.08, Math.min(1, dt * 6));
        if (Math.random() < 0.7) G.particles.spray(this.x - Math.cos(this.angle) * 30, this.y - Math.sin(this.angle) * 30, this.angle + Math.PI, 2, 90);
        G.ocean.addFoam(this.x - Math.cos(this.angle) * 28, this.y - Math.sin(this.angle) * 28, 0.3);
        if (p.stats.rockSense) for (const r of G.rocks) r.glow = 1;
        const wind = this.chargeCount > 0 ? 0.45 : (p2 ? 0.7 : 1.0);
        if (this.stateT >= wind) { this.chargeDir = toP; this.angle = toP; this.setState('charge'); this.chargeT = 0; Audio_.roar(); G.shake(5); G.particles.splash(this.x, this.y, 2); }
        break;
      }
      case 'charge': {
        this.chargeT += dt;
        if (p2 && this.chargeT < 0.35) this.chargeDir = angleLerp(this.chargeDir, toP, dt * 2.5); // phase 2 tracks briefly
        desired = this.chargeDir; this.angle = this.chargeDir;
        speed = p2 ? 640 : 560;
        // heavy spray & foam
        G.particles.spray(this.x + Math.cos(this.angle) * 30, this.y + Math.sin(this.angle) * 30, this.angle + 1.2, 2, 160);
        G.particles.spray(this.x + Math.cos(this.angle) * 30, this.y + Math.sin(this.angle) * 30, this.angle - 1.2, 2, 160);
        G.ocean.addFoam(this.x, this.y, 0.5);
        if (p2 && Math.random() < 0.5) G.particles.blood(this.x - Math.cos(this.angle) * 20, this.y - Math.sin(this.angle) * 20, 0.2);
        // hit player
        if (!p.dead && !p.diving && dist(this.x, this.y, p.x, p.y) < this.radius + 10) {
          if (p.rolling) { /* rolled through */ }
          else if (p.invuln <= 0) { p.damage(p2 ? 38 : 30, this.x, this.y); p.vx += Math.cos(this.angle) * 400; p.vy += Math.sin(this.angle) * 400; G.particles.splash(p.x, p.y, 2.5); }
        }
        // crash into rocks?
        for (const r of G.rocks) if (dist(this.x, this.y, r.x, r.y) < r.r + this.radius - 4) { this.crash(r); break; }
        if (this.state !== 'charge') break;
        // bounds
        const nx = this.x + Math.cos(this.angle) * 40, ny = this.y + Math.sin(this.angle) * 40;
        if (nx < 20 || nx > G.ocean.W - 20 || ny < G.ocean.shoreY + 20 || ny > G.ocean.H - 20 || this.chargeT > 1.6) {
          if (p2 && this.chargeCount === 0) { this.chargeCount = 1; this.setState('windup'); }
          else this.setState('circle');
        }
        break;
      }
      case 'stunned': {
        speed = 0; this.vx *= Math.pow(0.02, dt); this.vy *= Math.pow(0.02, dt);
        this.angle += Math.sin(this.stateT * 6) * dt * 0.5;
        if (Math.random() < 0.3) G.particles.bubbles(this.x + rand(-20, 20), this.y + rand(-10, 10), 1);
        if (p.stats.rockSense) for (const r of G.rocks) r.glow = 0;
        if (this.stateT >= this.stunDur) { if (p2) this.tailSweep(); this.setState('circle'); this.orbitDir *= -1; }
        break;
      }
      case 'enrage': {
        speed = 0; this.vx *= Math.pow(0.05, dt); this.vy *= Math.pow(0.05, dt);
        this.angle += dt * 6;
        if (Math.random() < 0.8) G.particles.blood(this.x + rand(-20, 20), this.y + rand(-10, 10), 0.4);
        G.ocean.addFoam(this.x + rand(-30, 30), this.y + rand(-20, 20), 0.3);
        if (this.stateT > 1.6) { this.setState('circle'); this.summon(); this.whirlT = 2; this.volleyT = 3; }
        break;
      }
    }
    // steering
    if (this.state !== 'charge' && this.state !== 'windup' && this.state !== 'stunned' && this.state !== 'enrage') this.angle = angleLerp(this.angle, desired, Math.min(1, dt * (p2 ? 2.6 : 2)));
    if (speed > 0) { this.vx = lerp(this.vx, Math.cos(this.angle) * speed, Math.min(1, dt * (this.state === 'charge' ? 12 : 3))); this.vy = lerp(this.vy, Math.sin(this.angle) * speed, Math.min(1, dt * (this.state === 'charge' ? 12 : 3))); }
    this.x += this.vx * dt; this.y += this.vy * dt;
    this.x = clamp(this.x, 30, G.ocean.W - 30); this.y = clamp(this.y, G.ocean.shoreY + 20, G.ocean.H - 30);
    // rocks (non-charging): slide around
    if (this.state !== 'charge') for (const r of G.rocks) { const dr = dist(this.x, this.y, r.x, r.y); if (dr < r.r + this.radius) { const a = angleTo(r.x, r.y, this.x, this.y); this.x = r.x + Math.cos(a) * (r.r + this.radius); this.y = r.y + Math.sin(a) * (r.r + this.radius); } }
    // wake
    const spd = Math.hypot(this.vx, this.vy);
    if (G.ocean.disturb && spd > 20) G.ocean.disturb(this.x, this.y, Math.min(6, spd / 70), this.vx, this.vy);
    const stx = this.x - Math.cos(this.angle) * 30, sty = this.y - Math.sin(this.angle) * 30;
    const last = this.wake.pts[this.wake.pts.length - 1];
    if (spd > 30 && (!last || dist(last.x, last.y, stx, sty) > 5)) { this.wake.pts.push({ x: stx, y: sty, t }); G.ocean.addFoam(stx, sty, 0.1 + spd / 2000); }
    // fin cuts the water: ripples
    if (spd > 60 && Math.random() < 0.3) G.ocean.ripple(this.x, this.y, 30, 60, 0.4);
    // phase 2 bleeding trail
    if (p2) { this.bleedT -= dt; if (this.bleedT <= 0) { this.bleedT = 0.3; G.ocean.addBlood(this.x + rand(-8, 8), this.y + rand(-8, 8), 0.10); } }
    // sweep shockwave
    if (this.sweep) {
      this.sweep.r += dt * 260; this.sweep.life -= dt;
      const dsw = dist(this.sweep.x, this.sweep.y, p.x, p.y);
      if (!this.sweep.hit && Math.abs(dsw - this.sweep.r) < 14 && !p.rolling && !p.diving) { this.sweep.hit = true; p.damage(20, this.sweep.x, this.sweep.y); }
      if (this.sweep.life <= 0) this.sweep = null;
    }
    // ram the player while circling (weaker)
    if (!p.dead && !p.diving && !p.rolling && this.state === 'circle' && dist(this.x, this.y, p.x, p.y) < this.radius + 10 && p.invuln <= 0) p.damage(12, this.x, this.y);
  }
  throwSpear(toP, p) {
    const lead = dist(this.x, this.y, p.x, p.y) / 380;
    const a = angleTo(this.x, this.y, p.x + p.vx * lead, p.y + p.vy * lead) + rand(-0.05, 0.05);
    G.projectiles.push(new Projectile({ x: this.x + Math.cos(a) * 10, y: this.y + Math.sin(a) * 10, vx: Math.cos(a) * 380, vy: Math.sin(a) * 380, life: 1.6, dmg: 14, owner: 'enemy', sprite: SP.spear, size: 4, trail: true, knock: 0 }));
    Audio_.shot('harpoon');
  }
  volley(toP) {
    for (let i = -2; i <= 2; i++) { const a = toP + i * 0.22; G.projectiles.push(new Projectile({ x: this.x, y: this.y, vx: Math.cos(a) * 330, vy: Math.sin(a) * 330, life: 1.8, dmg: 12, owner: 'enemy', sprite: SP.spear, size: 4, trail: true, knock: 0 })); }
    G.particles.text(this.x, this.y - 40, 'SPEAR VOLLEY', '#ff6161', 8); Audio_.shot('harpoon');
  }
  spawnWhirlpool(p) {
    const x = clamp(p.x + rand(-40, 40), 100, G.ocean.W - 100), y = clamp(p.y + rand(-40, 40), G.ocean.shoreY + 100, G.ocean.H - 100);
    G.ocean.currents.push({ type: 'whirl', x, y, r: 110, s: 150, life: 6 });
    G.particles.splash(x, y, 2); G.ocean.ripple(x, y, 110, 200, 0.8); Audio_.splash(2);
    G.particles.text(x, y - 30, 'WHIRLPOOL!', '#8ac6ff', 8);
  }
  summon() {
    G.banner('THE CHIEF CALLS FOR BACKUP', '#ff6161', 1.5);
    for (let i = 0; i < 3; i++) { const a = rand(0, TAU); G.spawnEnemy(i < 2 ? 'jetski' : 'dinghy', G.player.x + Math.cos(a) * 270, G.player.y + Math.sin(a) * 270); }
  }
  tailSweep() {
    this.sweep = { x: this.x, y: this.y, r: 20, life: 0.7, hit: false };
    G.particles.splash(this.x, this.y, 3); G.ocean.ripple(this.x, this.y, 180, 300, 1); G.shake(8); Audio_.splash(2.5);
    G.particles.text(this.x, this.y - 40, 'TAIL SWEEP!', '#ffe48f', 9);
  }
  crash(rock) {
    this.setState('stunned');
    this.stunDur = (this.phase === 2 ? 2.4 : 3.2) + (G.player.stats.rockSense ? 1.5 : 0);
    this.vx *= -0.2; this.vy *= -0.2;
    const a = angleTo(rock.x, rock.y, this.x, this.y); this.x = rock.x + Math.cos(a) * (rock.r + this.radius); this.y = rock.y + Math.sin(a) * (rock.r + this.radius);
    G.particles.splash(this.x, this.y, 4); G.particles.debris(this.x, this.y, 14, ['#7c818b', '#5e636d', '#9a9ea8']); G.particles.sparks(this.x, this.y, 14);
    G.particles.blood(this.x, this.y, 2); G.shake(16); Audio_.stun(); G.ocean.ripple(this.x, this.y, 120, 280, 1);
    Toon.burst(this.x, this.y, 3.2); Toon.shock(this.x, this.y, 150, 0.6);
    for (let i = 0; i < 5; i++) Toon.emote(this.x + rand(-24, 24), this.y - 30, 'star');
    G.banner('STUNNED! HIT HIM NOW!', '#ffe48f', 1.4); G.particles.text(this.x, this.y - 40, 'CRASH!', '#ffe48f', 12);
    G.stats.bossCrashes++;
    this.hp -= 40; // the rock itself hurts
  }
  hit(dmg, kx, ky, proj) {
    if (this.dead || this.state === 'enter' || this.state === 'enrage') return;
    let mult = this.stunned ? 2.5 : this.charging ? 0.35 : 0.5;
    const real = dmg * mult;
    this.hp -= real; this.flash = 0.08; G.stats.damageDealt += real;
    G.particles.sparks(this.x, this.y, 3); if (Math.random() < 0.7) G.particles.blood(this.x, this.y, 0.4);
    Toon.impact(this.x, this.y, this.stunned ? 1.6 : 0.7, this.stunned ? '#ffe48f' : '#ffffff');
    G.particles.text(this.x + rand(-10, 10), this.y - 30, Math.round(real) + (this.stunned ? '!' : ''), this.stunned ? '#ffe48f' : proj && proj.crit ? '#ffe48f' : '#c8d0d8', this.stunned ? 9 : 7);
    Audio_.hit();
    if (this.phase === 1 && this.hp <= this.maxHp * 0.5) {
      this.phase = 2; this.setState('enrage'); Audio_.roar(); G.shake(14);
      G.banner('PHASE 2: BLOOD FRENZY', '#ff6161', 2.2);
      G.particles.splash(this.x, this.y, 4); G.ocean.ripple(this.x, this.y, 220, 320, 1); G.ocean.splatBlood(this.x, this.y, 6, 40);
      for (const pr of G.projectiles) if (pr.owner === 'player') pr.dead = true;
      const p = G.player, a = angleTo(this.x, this.y, p.x, p.y); p.vx += Math.cos(a) * 350; p.vy += Math.sin(a) * 350;
    }
    if (this.hp <= 0) this.die();
  }
  die() {
    this.dead = true; this.wake.dead = true;
    G.particles.explode(this.x, this.y, 90, { debris: 30, oil: 2, debrisColors: ['#b57d3f', '#5b6f8c', '#f2c744'] });
    G.particles.blood(this.x, this.y, 4); G.ocean.splatBlood(this.x, this.y, 5, 70); G.shake(24);
    Toon.burst(this.x, this.y, 5); Toon.shock(this.x, this.y, 260, 0.9);
    for (let i = 0; i < 3; i++) setTimeout(() => { if (G) { G.particles.explode(this.x + rand(-40, 40), this.y + rand(-30, 30), 50); G.particles.blood(this.x + rand(-30, 30), this.y + rand(-30, 30), 3); } }, 250 + i * 300);
    const drops = { metal: 14, wood: 12, fuel: 10, powder: 10, tech: 12 };
    for (const k in drops) for (let i = 0; i < drops[k]; i++) G.pickups.push(new Pickup(this.x, this.y, k));
    G.stats.kills++; G.onBossKilled();
  }
  render(ctx, cam, t) {
    if (this.dead) return;
    const sx = this.x - cam.x, sy = this.y - cam.y;
    const p2 = this.phase === 2;
    // telegraph line during windup
    if (this.state === 'windup') {
      const p = G.player, a = angleTo(this.x, this.y, p.x, p.y);
      ctx.setLineDash([6, 6]); ctx.lineDashOffset = -t * 60;
      ctx.strokeStyle = `rgba(255,${p2 ? 80 : 200},60,${(0.4 + Math.sin(t * 20) * 0.2).toFixed(2)})`; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(Math.round(sx), Math.round(sy)); ctx.lineTo(Math.round(sx + Math.cos(a) * 900), Math.round(sy + Math.sin(a) * 900)); ctx.stroke();
      ctx.setLineDash([]);
    }
    const bob = Math.sin(t * 2 + 1) * 1.5;
    const hurtF = this.flash > 0 || (this.stunned && Math.floor(t * 8) % 2 === 0);
    const spr = hurtF ? (p2 ? CH.sharkRageHurt : CH.sharkHurt) : (p2 ? CH.sharkRage : CH.shark);
    const thrash = this.state === 'windup' ? Math.sin(t * 40) * 0.06 : 0;
    const spd = Math.hypot(this.vx, this.vy);
    const wig = Math.sin(t * (8 + spd / 40)) * Math.min(0.12, spd / 3000);
    const ang = this.angle + thrash + wig;
    ctx.save();
    ctx.translate(Math.round(sx), Math.round(sy + bob));
    ctx.rotate(ang);
    // the shark lengthens as it lunges
    const lunge = this.state === 'charge' ? 1.10 : 1;
    ctx.scale(lunge, 2 - lunge);
    ctx.drawImage(spr.c, -spr.ax, -spr.ay);
    // the Chief rides just behind the dorsal, leaning with the turn
    const chief = hurtF ? CH.chiefHurt : CH.chief;
    ctx.save();
    ctx.translate(6, 0);
    ctx.rotate(this.stunned ? Math.sin(t * 7) * 0.5 : -wig * 2.2);
    if (this.stunned) ctx.translate(0, Math.sin(t * 9) * 2);
    ctx.drawImage(chief.c, -chief.ax, -chief.ay);
    // his spear, raised in windup and levelled in the charge
    const raise = this.state === 'windup' ? Math.sin(t * 26) * 0.35 - 0.9 : this.charging ? 0.05 : -0.35;
    ctx.save(); ctx.translate(2, -2); ctx.rotate(raise);
    ctx.drawImage(SP.spear.c, -4, -SP.spear.ay);
    ctx.restore();
    ctx.restore();
    ctx.restore();
    if (this.stunned) {
      for (let i = 0; i < 3; i++) { const a = t * 5 + i * TAU / 3; drawSprite(ctx, SP.star, sx + Math.cos(a) * 22, sy - 26 + Math.sin(a) * 6); }
    }
    if (this.state === 'enrage') { ctx.strokeStyle = `rgba(255,60,40,${(0.6 + Math.sin(t * 30) * 0.3).toFixed(2)})`; ctx.lineWidth = 3; ctx.beginPath(); ctx.ellipse(Math.round(sx), Math.round(sy), 40 + this.stateT * 60, 30 + this.stateT * 45, 0, 0, TAU); ctx.stroke(); }
    if (this.sweep) { ctx.strokeStyle = `rgba(230,246,255,${Math.min(1, this.sweep.life * 2).toFixed(2)})`; ctx.lineWidth = 4; ctx.beginPath(); ctx.ellipse(Math.round(this.sweep.x - cam.x), Math.round(this.sweep.y - cam.y), Math.round(this.sweep.r), Math.round(this.sweep.r * 0.8), 0, 0, TAU); ctx.stroke(); }
  }
}

// ---- Spawn director: discrete, clearable waves --------------------------
// You must WIPE OUT a wave before the upgrade screen opens. Between waves the
// ocean goes quiet, you spend your salvage, then you call the next one in.
const WAVES = [
  { name: 'WAVE 1',  sub: 'Fishing dinghies leave the pier',            pool: { dinghy: 1 },                                                        count: 8,  interval: 1.5, max: 5,  burst: [['dinghy', 3]] },
  { name: 'WAVE 2',  sub: 'Net boats. Absorb the nets [E / right-click]', pool: { dinghy: 2, netter: 1.4 },                                          count: 11, interval: 1.4, max: 6,  burst: [['netter', 3]] },
  { name: 'WAVE 3',  sub: 'Harpooners keep their distance',             pool: { dinghy: 1.6, netter: 1, harpooner: 1.4 },                           count: 13, interval: 1.3, max: 7,  burst: [['harpooner', 3]] },
  { name: 'WAVE 4',  sub: 'Speedboats on strafing runs',                pool: { dinghy: 1.2, netter: 1, harpooner: 1, speedboat: 1.5 },             count: 15, interval: 1.2, max: 8,  burst: [['speedboat', 4]] },
  { name: 'WAVE 5',  sub: 'Jetski bombers. Roll away from them',        pool: { dinghy: 1, netter: 1, harpooner: 1, speedboat: 1, jetski: 2.2 },    count: 17, interval: 1.1, max: 9,  burst: [['jetski', 5]] },
  { name: 'WAVE 6',  sub: 'Dynamite skiffs. Absorb the sticks',         pool: { netter: 1, harpooner: 1, speedboat: 1, jetski: 1, dynaboat: 1.8 },  count: 18, interval: 1.05, max: 9, burst: [['dynaboat', 4]] },
  { name: 'WAVE 7',  sub: 'The Trawler',                                pool: { dinghy: 1, netter: 1, harpooner: 1, speedboat: 1, jetski: 1, dynaboat: 1, trawler: 0.5 }, count: 20, interval: 1.0, max: 10, burst: [['trawler', 1], ['dinghy', 4]] },
  { name: 'WAVE 8',  sub: 'Gunboats out of the harbour',                pool: { netter: 1, harpooner: 1.2, speedboat: 1, jetski: 1, dynaboat: 1, trawler: 0.4, gunboat: 0.8 }, count: 22, interval: 0.95, max: 11, burst: [['gunboat', 2], ['speedboat', 3]] },
  { name: 'WAVE 9',  sub: 'The whole fleet is awake now',               pool: { netter: 1, harpooner: 1.2, speedboat: 1.2, jetski: 1.4, dynaboat: 1.2, trawler: 0.5, gunboat: 0.9 }, count: 25, interval: 0.9, max: 12, burst: [['jetski', 5], ['gunboat', 2]] },
  { name: 'WAVE 10', sub: 'They are not holding anything back',         pool: { harpooner: 1.2, speedboat: 1.3, jetski: 1.4, dynaboat: 1.3, trawler: 0.7, gunboat: 1.1 }, count: 28, interval: 0.85, max: 13, burst: [['trawler', 2], ['gunboat', 3]] },
  { name: 'WAVE 11', sub: 'Everything they have left',                  pool: { speedboat: 1.3, jetski: 1.5, dynaboat: 1.3, trawler: 0.8, gunboat: 1.3 }, count: 32, interval: 0.8, max: 14, burst: [['gunboat', 3], ['dynaboat', 4]] },
  { name: 'THE VILLAGE CHIEF', sub: 'He rides a shark. Bait his charge into the rocks', boss: true, pool: { jetski: 1, dinghy: 1 }, count: 999, interval: 5.0, max: 4 },
];

class Director {
  constructor() {
    this.time = 0; this.waveIdx = -1; this.spawnT = 0;
    this.started = false; this.bossSpawned = false;
    this.state = 'idle';        // idle | fighting | cleared
    this.remaining = 0; this.clearedAt = 0; this.wavesCleared = 0;
  }
  // enemies get tougher every wave; hazards read this too
  get difficulty() { return 1 + Math.max(0, this.waveIdx) * 0.09; }
  currentWave() { return WAVES[clamp(this.waveIdx, 0, WAVES.length - 1)]; }
  get isBossWave() { return !!this.currentWave().boss; }
  get cleared() { return this.state === 'cleared'; }
  get lastWave() { return this.waveIdx >= WAVES.length - 1; }

  begin() { this.started = true; this.startWave(0); }

  startWave(i) {
    this.waveIdx = i;
    const w = WAVES[i]; if (!w) return;
    this.state = 'fighting';
    this.remaining = w.count;
    this.spawnT = 0.8;
    G.banner(w.name, w.boss ? '#ff6161' : '#ffe48f', 2.4, w.sub);
    if (typeof Hazards !== 'undefined' && Hazards.difficulty !== undefined) Hazards.difficulty = this.difficulty;
    if (w.burst) for (const [type, n] of w.burst) { this.spawnBurst(type, n); this.remaining -= n; }
    if (w.boss && !this.bossSpawned) { this.bossSpawned = true; G.spawnBoss(); }
  }

  next() {
    if (this.state !== 'cleared') return false;
    if (this.lastWave) return false;
    this.startWave(this.waveIdx + 1);
    return true;
  }

  update(dt) {
    if (!this.started) return;
    this.time += dt;
    if (this.state !== 'fighting') return;
    const w = this.currentWave(); if (!w) return;
    const alive = G.enemies.length;

    if (w.boss) {
      // the boss wave ends with the Chief, not with a body count
      this.spawnT -= dt;
      if (this.spawnT <= 0 && alive < w.max) { this.spawnT = w.interval * rand(0.7, 1.3); this.spawnOne(w); }
      return;
    }

    if (this.remaining > 0) {
      this.spawnT -= dt;
      if (this.spawnT <= 0 && alive < w.max) {
        this.spawnT = w.interval * rand(0.75, 1.25);
        this.spawnOne(w); this.remaining--;
      }
    } else if (alive === 0) {
      this.clear();
    }
  }

  clear() {
    this.state = 'cleared'; this.clearedAt = this.time; this.wavesCleared++;
    G.onWaveCleared(this.waveIdx);
  }

  spawnOne(w) { const pos = this.spawnPos(); G.spawnEnemy(this.pickType(w.pool), pos.x, pos.y); }
  pickType(pool) { let tot = 0; for (const k in pool) tot += pool[k]; let r = Math.random() * tot; for (const k in pool) { r -= pool[k]; if (r <= 0) return k; } return Object.keys(pool)[0]; }
  spawnPos() {
    const p = G.player;
    for (let i = 0; i < 12; i++) {
      const a = rand(0, TAU), r = rand(230, 300);
      const x = p.x + Math.cos(a) * r, y = p.y + Math.sin(a) * r;
      if (x > 30 && x < G.ocean.W - 30 && y > G.ocean.shoreY + 10 && y < G.ocean.H - 30) return { x, y };
    }
    return { x: clamp(p.x + 260, 30, G.ocean.W - 30), y: clamp(p.y, G.ocean.shoreY + 40, G.ocean.H - 30) };
  }
  spawnBurst(type, n) {
    const base = rand(0, TAU), p = G.player;
    for (let i = 0; i < n; i++) {
      const a = base + (i - n / 2) * 0.25, r = 270;
      const x = clamp(p.x + Math.cos(a) * r, 30, G.ocean.W - 30);
      const y = clamp(p.y + Math.sin(a) * r, G.ocean.shoreY + 20, G.ocean.H - 30);
      G.spawnEnemy(type, x, y);
    }
  }
}
