// ---- Math & helpers ------------------------------------------------------
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const dist = (ax, ay, bx, by) => Math.hypot(bx - ax, by - ay);
const angleTo = (ax, ay, bx, by) => Math.atan2(by - ay, bx - ax);
const rand = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const sign = v => v < 0 ? -1 : 1;
function angleLerp(a, b, t) {
  let d = ((b - a + Math.PI) % TAU + TAU) % TAU - Math.PI;
  return a + d * t;
}
function angleDiff(a, b) {
  return ((b - a + Math.PI) % TAU + TAU) % TAU - Math.PI;
}
function approach(v, target, step) {
  if (v < target) return Math.min(v + step, target);
  return Math.max(v - step, target);
}
// Cheap deterministic hash noise (for water & rocks)
function hash2(x, y) {
  let h = (x * 374761393 + y * 668265263) | 0;
  h = (h ^ (h >>> 13)) * 1274126177 | 0;
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
  return lerp(lerp(a, b, u), lerp(c, d, u), v);
}
class SeededRandom {
  constructor(seed) { this.s = seed >>> 0 || 1; }
  next() { let s = this.s; s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; this.s = s; return s / 4294967296; }
  range(a, b) { return a + this.next() * (b - a); }
  int(a, b) { return Math.floor(this.range(a, b + 1)); }
}
function hexToRgb(hex) {
  const n = parseInt(hex.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function rgba(r, g, b, a) { return `rgba(${r|0},${g|0},${b|0},${a})`; }
function fmtTime(t) {
  const m = Math.floor(t / 60), s = Math.floor(t % 60);
  return `${m}:${s < 10 ? '0' : ''}${s}`;
}
// Draw crisp pixel text (rendered on the low-res canvas so it stays chunky)
function pixelText(ctx, text, x, y, size, color, align = 'left', shadow = true) {
  ctx.font = `bold ${size}px monospace`;
  ctx.textAlign = align;
  ctx.textBaseline = 'top';
  if (shadow) { ctx.fillStyle = '#000'; ctx.fillText(text, x + 1, y + 1); }
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
}
function wrapText(ctx, text, maxWidth, size) {
  ctx.font = `bold ${size}px monospace`;
  const words = text.split(' '), lines = []; let cur = '';
  for (const w of words) {
    const test = cur ? cur + ' ' + w : w;
    if (ctx.measureText(test).width > maxWidth && cur) { lines.push(cur); cur = w; } else cur = test;
  }
  if (cur) lines.push(cur);
  return lines;
}

// ---- Tiny procedural synth so the ocean isn't silent ---------------------
const Audio_ = {
  ctx: null, master: null, enabled: true, muted: false,
  init() {
    if (this.ctx) return;
    try {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.35;
      this.master.connect(this.ctx.destination);
    } catch (e) { this.enabled = false; }
  },
  resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  noiseBuf: null,
  getNoise() {
    if (this.noiseBuf) return this.noiseBuf;
    const len = this.ctx.sampleRate * 1;
    const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    return this.noiseBuf = buf;
  },
  tone(freq, dur, type = 'square', vol = 0.2, slide = 0) {
    if (!this.enabled || !this.ctx || this.muted) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t + dur + 0.02);
  },
  noise(dur, vol = 0.2, lp = 2000, hp = 100) {
    if (!this.enabled || !this.ctx || this.muted) return;
    const t = this.ctx.currentTime;
    const s = this.ctx.createBufferSource(); s.buffer = this.getNoise();
    const f = this.ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = lp;
    const f2 = this.ctx.createBiquadFilter(); f2.type = 'highpass'; f2.frequency.value = hp;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    s.connect(f); f.connect(f2); f2.connect(g); g.connect(this.master);
    s.start(t); s.stop(t + dur + 0.02);
  },
  shot(kind) {
    switch (kind) {
      case 'revolver': this.noise(0.12, 0.35, 3000, 400); this.tone(180, 0.08, 'square', 0.15, -120); break;
      case 'shotgun': this.noise(0.25, 0.5, 1800, 150); this.tone(90, 0.15, 'sawtooth', 0.2, -60); break;
      case 'rifle': this.noise(0.18, 0.4, 5000, 800); this.tone(400, 0.1, 'square', 0.12, -300); break;
      case 'smg': this.noise(0.06, 0.2, 4000, 600); break;
      case 'harpoon': this.tone(600, 0.2, 'sawtooth', 0.15, -500); this.noise(0.1, 0.2, 2500, 300); break;
      case 'grenade': this.tone(120, 0.2, 'square', 0.2, 80); break;
      case 'flak': this.noise(0.2, 0.4, 2200, 200); this.tone(140, 0.12, 'square', 0.2, -80); break;
      default: this.noise(0.1, 0.3, 3000, 300);
    }
  },
  explosion(size = 1) { this.noise(0.5 * size, 0.6, 900, 40); this.tone(60, 0.4 * size, 'sine', 0.4, -40); },
  splash(size = 1) { this.noise(0.25 * size, 0.25 * size, 1500, 300); },
  hit() { this.tone(220, 0.08, 'square', 0.15, -100); },
  hurt() { this.tone(160, 0.25, 'sawtooth', 0.3, -100); this.noise(0.2, 0.3, 800, 100); },
  absorb() { this.tone(500, 0.15, 'sine', 0.3, 700); this.tone(800, 0.2, 'triangle', 0.2, 400); },
  pickup(i) { this.tone(500 + i * 120, 0.08, 'square', 0.12, 300); },
  roll() { this.noise(0.3, 0.3, 1200, 200); this.tone(200, 0.2, 'sine', 0.15, 150); },
  rampage() { for (let i = 0; i < 4; i++) setTimeout(() => this.tone(300 + i * 150, 0.2, 'square', 0.25, 200), i * 90); },
  buy() { this.tone(660, 0.1, 'square', 0.15); setTimeout(() => this.tone(990, 0.15, 'square', 0.15), 90); },
  deny() { this.tone(160, 0.15, 'square', 0.15, -60); },
  stun() { this.noise(0.4, 0.6, 700, 60); this.tone(80, 0.5, 'sawtooth', 0.3, -50); },
  roar() { this.tone(90, 0.8, 'sawtooth', 0.35, 40); this.noise(0.6, 0.3, 500, 60); },
};

/* ===== src/input.js ===== */
// ---- Input --------------------------------------------------------------
const Input = {
  keys: {}, pressed: {}, mouse: { x: 320, y: 180, down: false, rdown: false, clicked: false, rclicked: false },
  canvas: null, scale: 1, offX: 0, offY: 0,
  init(canvas) {
    this.canvas = canvas;
    window.addEventListener('keydown', e => {
      if (['Space', 'Tab', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
      if (!this.keys[e.code]) this.pressed[e.code] = true;
      this.keys[e.code] = true;
      this.anyKey = true;
      Audio_.init(); Audio_.resume();
    });
    window.addEventListener('keyup', e => { this.keys[e.code] = false; });
    window.addEventListener('blur', () => { this.keys = {}; this.mouse.down = false; this.mouse.rdown = false; });
    canvas.addEventListener('mousemove', e => this.updateMouse(e));
    canvas.addEventListener('mousedown', e => {
      this.updateMouse(e);
      Audio_.init(); Audio_.resume();
      if (e.button === 0) { this.mouse.down = true; this.mouse.clicked = true; }
      if (e.button === 2) { this.mouse.rdown = true; this.mouse.rclicked = true; }
      this.anyKey = true;
    });
    window.addEventListener('mouseup', e => {
      if (e.button === 0) this.mouse.down = false;
      if (e.button === 2) this.mouse.rdown = false;
    });
    canvas.addEventListener('contextmenu', e => e.preventDefault());
    canvas.addEventListener('wheel', e => { this.wheel += Math.sign(e.deltaY); e.preventDefault(); }, { passive: false });
  },
  wheel: 0, anyKey: false,
  updateMouse(e) {
    const r = this.canvas.getBoundingClientRect();
    this.mouse.x = (e.clientX - r.left) / r.width * this.canvas.width;
    this.mouse.y = (e.clientY - r.top) / r.height * this.canvas.height;
  },
  down(code) { return !!this.keys[code]; },
  hit(code) { return !!this.pressed[code]; },
  axis() {
    let x = 0, y = 0;
    if (this.down('KeyA') || this.down('ArrowLeft')) x -= 1;
    if (this.down('KeyD') || this.down('ArrowRight')) x += 1;
    if (this.down('KeyW') || this.down('ArrowUp')) y -= 1;
    if (this.down('KeyS') || this.down('ArrowDown')) y += 1;
    const l = Math.hypot(x, y); if (l > 1) { x /= l; y /= l; }
    return { x, y };
  },
  endFrame() { this.pressed = {}; this.mouse.clicked = false; this.mouse.rclicked = false; this.wheel = 0; this.anyKey = false; },
};

const SP = {};
function makeSprite(rows, opts = {}) {
  const pal = Object.assign({}, PAL, opts.pal || {});
  const h = rows.length, w = Math.max(...rows.map(r => r.length));
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  for (let y = 0; y < h; y++) for (let x = 0; x < rows[y].length; x++) {
    const col = pal[rows[y][x]];
    if (col) { ctx.fillStyle = col; ctx.fillRect(x, y, 1, 1); }
  }
  return { c, w, h, ax: opts.ax ?? w / 2, ay: opts.ay ?? h / 2 };
}
function flipSprite(s) {
  const c = document.createElement('canvas'); c.width = s.w; c.height = s.h;
  const ctx = c.getContext('2d'); ctx.translate(s.w, 0); ctx.scale(-1, 1); ctx.drawImage(s.c, 0, 0);
  return { c, w: s.w, h: s.h, ax: s.w - s.ax, ay: s.ay };
}
function tintSprite(s, color, alpha = 0.7) {
  const c = document.createElement('canvas'); c.width = s.w; c.height = s.h;
  const ctx = c.getContext('2d'); ctx.drawImage(s.c, 0, 0);
  ctx.globalCompositeOperation = 'source-atop'; ctx.globalAlpha = alpha; ctx.fillStyle = color; ctx.fillRect(0, 0, s.w, s.h);
  return { c, w: s.w, h: s.h, ax: s.ax, ay: s.ay };
}
// draw sprite at world->screen position with rotation/scale
function drawSprite(ctx, s, x, y, rot = 0, sx = 1, sy = 1) {
  ctx.save(); ctx.translate(Math.round(x), Math.round(y));
  if (rot) ctx.rotate(rot);
  if (sx !== 1 || sy !== 1) ctx.scale(sx, sy);
  ctx.drawImage(s.c, -s.ax, -s.ay);
  ctx.restore();
}

// ============================ PROCEDURAL ROCKS =========================
function makeRock(seed, size) {
  const rng = new SeededRandom(seed);
  const w = size * 2 + 4, h = Math.round(size * 1.6) + 4;
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  const cx = w / 2, cy = h / 2;
  const ox = rng.range(0, 100), oy = rng.range(0, 100);
  const mask = [];
  for (let y = 0; y < h; y++) { mask.push([]); for (let x = 0; x < w; x++) {
    const nx = (x - cx) / (size), ny = (y - cy) / (size * 0.8);
    const ang = Math.atan2(ny, nx);
    const bump = Math.sin(ang * 3 + ox) * 0.08 + Math.sin(ang * 5 + oy) * 0.06 + Math.sin(ang * 7 + ox * 2) * 0.04;
    const r = Math.hypot(nx, ny) + bump + (vnoise(x * 0.09 + ox, y * 0.09 + oy) - 0.5) * 0.22;
    mask[y].push(r < 0.93);
  } }
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    if (!mask[y][x]) continue;
    const edge = !(mask[y - 1]?.[x] && mask[y + 1]?.[x] && mask[y][x - 1] && mask[y][x + 1]);
    let col;
    if (edge) col = PAL.k;
    else {
      const shade = vnoise(x * 0.18 + ox, y * 0.18 + oy) * 0.7 + (cy - y) / h * 0.7 + (cx - x) / w * 0.35;
      col = shade > 0.78 ? '#9a9ea8' : shade > 0.55 ? '#7c818b' : shade > 0.32 ? '#5e636d' : '#454a53';
      // cracks & moss
      if (vnoise(x * 0.6 + oy, y * 0.6 + ox) > 0.78) col = '#3a3e46';
      if (shade > 0.6 && vnoise(x * 0.3 + ox * 3, y * 0.3 + oy * 3) > 0.72) col = '#4f8f5a';
      // wet dark base near the waterline (bottom edge)
      const below = mask[y + 2]?.[x] === false || mask[y + 1]?.[x] === false;
      if (below) col = '#33373f';
    }
    ctx.fillStyle = col; ctx.fillRect(x, y, 1, 1);
  }
  return { c, w, h, ax: cx, ay: cy };
}

// ---- Ocean: waves, currents, blood & foam fields, wakes, ripples ---------
class Ocean {
  constructor(worldW, worldH, shoreY) {
    this.W = worldW; this.H = worldH; this.shoreY = shoreY;
    this.cell = 16;
    this.gw = Math.ceil(worldW / this.cell) + 1; this.gh = Math.ceil(worldH / this.cell) + 1;
    this.blood = new Float32Array(this.gw * this.gh);
    this.blood2 = new Float32Array(this.gw * this.gh);
    this.foam = new Float32Array(this.gw * this.gh);
    this.foam2 = new Float32Array(this.gw * this.gh);
    this.oil = new Float32Array(this.gw * this.gh);
    this.lw = 320; this.lh = 180;
    this.low = document.createElement('canvas'); this.low.width = this.lw; this.low.height = this.lh;
    this.lctx = this.low.getContext('2d');
    this.img = this.lctx.createImageData(this.lw, this.lh);
    this.ripples = [];
    this.wakes = [];   // {pts:[{x,y,t,w}], owner}
    this.streaks = [];
    this.fish = [];
    this.frame = 0;
    // colour palette (posterized water levels)
    this.pal = ['#113a6c', '#164a84', '#1b5898', '#2569ad', '#4a92cf', '#8ccbf0', '#e8f8ff'].map(hexToRgb);
    this.shallow = ['#1f7a95', '#268ea8', '#2f9fb8', '#3fb2c6', '#7ad3de', '#b4e9ee', '#ecfcff'].map(hexToRgb);
    this.sand = hexToRgb('#d9c27f'); this.sandDark = hexToRgb('#b99d5e'); this.grass = hexToRgb('#5f9a4a');
    this.bloodC = hexToRgb('#6e0a12'); this.bloodBright = hexToRgb('#c41c26'); this.foamC = hexToRgb('#eef9ff');
    this.oilC = hexToRgb('#1a1418');
    // currents: rotating eddies + a drift lane
    this.currents = [];
    const rng = new SeededRandom(1337);
    for (let i = 0; i < 7; i++) this.currents.push({
      x: rng.range(200, worldW - 200), y: rng.range(shoreY + 300, worldH - 200), r: rng.range(160, 320),
      s: rng.range(40, 90) * (rng.next() < 0.5 ? -1 : 1), type: 'eddy',
    });
    this.currents.push({ x: worldW / 2, y: worldH * 0.62, r: 9999, s: 18, type: 'drift', ang: rng.range(0, TAU) });
    for (let i = 0; i < 260; i++) this.streaks.push({ x: rng.range(0, worldW), y: rng.range(shoreY, worldH), life: rng.range(0, 3) });
    for (let i = 0; i < 40; i++) this.fish.push({ x: rng.range(0, worldW), y: rng.range(shoreY + 80, worldH), a: rng.range(0, TAU), s: rng.range(20, 45), ph: rng.range(0, TAU), size: rng.range(4, 9) });
  }
  idx(x, y) { const cx = clamp(Math.floor(x / this.cell), 0, this.gw - 1), cy = clamp(Math.floor(y / this.cell), 0, this.gh - 1); return cy * this.gw + cx; }
  addBlood(x, y, amt) { this.blood[this.idx(x, y)] += amt; }
  addFoam(x, y, amt) { this.foam[this.idx(x, y)] += amt; }
  addOil(x, y, amt) { this.oil[this.idx(x, y)] += amt; }
  splatBlood(x, y, amt, spread = 20) {
    for (let i = 0; i < 6; i++) this.addBlood(x + rand(-spread, spread), y + rand(-spread, spread), amt / 6);
  }
  ripple(x, y, maxR = 30, speed = 40, alpha = 0.7) { if (this.ripples.length < 400) this.ripples.push({ x, y, r: 2, maxR, speed, alpha }); }
  newWake(owner, width = 6) { const w = { pts: [], owner, width, dead: false }; this.wakes.push(w); return w; }
  // steady flow at a point (currents)
  flow(x, y) {
    let fx = 0, fy = 0;
    for (const c of this.currents) {
      if (c.type === 'drift') { fx += Math.cos(c.ang) * c.s; fy += Math.sin(c.ang) * c.s; continue; }
      const dx = x - c.x, dy = y - c.y, d = Math.hypot(dx, dy);
      if (d > c.r || d < 1) continue;
      if (c.type === 'lane') { const k = Math.min(1, c.life / 1.5); fx += Math.cos(c.ang) * c.s * k; fy += Math.sin(c.ang) * c.s * k; continue; }
      if (c.type === 'whirl') { const k = (1 - d / c.r) * Math.min(1, c.life / 0.8); fx += (-dy / d * c.s - dx / d * c.s * 0.7) * k; fy += (dx / d * c.s - dy / d * c.s * 0.7) * k; continue; }
      const k = (1 - d / c.r) * Math.min(1, d / 60);
      fx += -dy / d * c.s * k; fy += dx / d * c.s * k;
      // slight inward pull
      fx += -dx / d * c.s * 0.15 * k; fy += -dy / d * c.s * 0.15 * k;
    }
    return { x: fx, y: fy };
  }
  waveHeight(x, y, t) {
    // long, anisotropic swells rolling toward the shore, plus small chop
    return Math.sin(y * 0.075 + x * 0.02 + t * 1.3) * 0.45 + Math.sin(y * 0.031 - x * 0.012 - t * 0.6) * 0.3
      + Math.sin(x * 0.06 + y * 0.05 + t * 2.0) * 0.2 + Math.sin(x * 0.19 - y * 0.11 + t * 3) * 0.08 + Math.sin((x + y * 0.4) * 0.033 + t * 0.9) * 0.2;
  }
  waveLevel(w) { return w < -0.7 ? 0 : w < -0.35 ? 1 : w < 0.35 ? 2 : w < 0.68 ? 3 : w < 0.86 ? 4 : 5; }
  update(dt, t) {
    this.frame++;
    for (let i = this.currents.length - 1; i >= 0; i--) { const c = this.currents[i]; if (c.life !== undefined) { c.life -= dt; if (c.life <= 0) this.currents.splice(i, 1); } }
    // diffuse blood/foam/oil on alternating frames (cheap & smooth)
    if (this.frame % 2 === 0) this.diffuse(this.blood, this.blood2, 0.16, 0.9975);
    else { this.diffuse(this.foam, this.foam2, 0.22, 0.93); }
    if (this.frame % 3 === 0) this.diffuse(this.oil, this.blood2, 0.08, 0.996);
    for (let i = this.ripples.length - 1; i >= 0; i--) {
      const r = this.ripples[i]; r.r += r.speed * dt;
      if (r.r >= r.maxR) this.ripples.splice(i, 1);
    }
    for (let i = this.wakes.length - 1; i >= 0; i--) {
      const w = this.wakes[i];
      while (w.pts.length && t - w.pts[0].t > 2.2) w.pts.shift();
      if (w.dead && !w.pts.length) this.wakes.splice(i, 1);
    }
    for (const s of this.streaks) {
      const f = this.flow(s.x, s.y);
      s.x += f.x * dt * 1.5; s.y += f.y * dt * 1.5; s.life -= dt; s.vx = f.x; s.vy = f.y;
      if (s.life <= 0 || s.x < 0 || s.y < this.shoreY || s.x > this.W || s.y > this.H) {
        s.x = rand(0, this.W); s.y = rand(this.shoreY, this.H); s.life = rand(2, 5);
      }
    }
    for (const f of this.fish) {
      f.ph += dt * 6; f.a += Math.sin(f.ph * 0.3) * dt * 0.8;
      const fl = this.flow(f.x, f.y);
      f.x += (Math.cos(f.a) * f.s + fl.x * 0.5) * dt; f.y += (Math.sin(f.a) * f.s + fl.y * 0.5) * dt;
      if (f.x < 0 || f.x > this.W) f.a = Math.PI - f.a;
      if (f.y < this.shoreY + 60 || f.y > this.H) f.a = -f.a;
    }
  }
  diffuse(src, dst, k, decay) {
    const gw = this.gw, gh = this.gh;
    for (let y = 0; y < gh; y++) {
      const y0 = y * gw, ym = y > 0 ? y0 - gw : y0, yp = y < gh - 1 ? y0 + gw : y0;
      for (let x = 0; x < gw; x++) {
        const c = src[y0 + x];
        if (c < 0.001) { dst[y0 + x] = 0; continue; }
        const xm = x > 0 ? x - 1 : x, xp = x < gw - 1 ? x + 1 : x;
        const avg = (src[ym + x] + src[yp + x] + src[y0 + xm] + src[y0 + xp]) * 0.25;
        dst[y0 + x] = (c + (avg - c) * k) * decay;
      }
      // spread into empty neighbours
      for (let x = 0; x < gw; x++) {
        const c = src[y0 + x]; if (c < 0.02) continue;
        const xm = x > 0 ? x - 1 : x, xp = x < gw - 1 ? x + 1 : x;
        const give = c * k * 0.25;
        if (src[ym + x] < 0.001) dst[ym + x] += give;
        if (src[yp + x] < 0.001) dst[yp + x] += give;
        if (src[y0 + xm] < 0.001) dst[y0 + xm] += give;
        if (src[y0 + xp] < 0.001) dst[y0 + xp] += give;
      }
    }
    src.set(dst);
  }
  sample(field, wx, wy) {
    // bilinear sample of a grid field at world coords

        ctx.beginPath(); ctx.ellipse(sx, sy, Math.round(r * 1.5), Math.round(r * 1.1), 0, 0, TAU); ctx.stroke();
      }
    }
    for (const t of this.texts) {
      ctx.globalAlpha = Math.min(1, t.life * 2);
      pixelText(ctx, t.str, Math.round(t.x - cam.x), Math.round(t.y - cam.y), t.size, t.color, 'center');
    }
    ctx.globalAlpha = 1;
  }
}

class SkillTree {
  constructor() { this.unlocked = new Set(); this.scrap = { metal: 0, wood: 0, fuel: 0, powder: 0, tech: 0 }; this.primary = 'revolver'; this.sidearm = null; this.totalCollected = 0; }
  has(id) { return this.unlocked.has(id); }
  available(node) {
    if (!node.req.length) return true;
    return node.reqAny ? node.req.some(r => this.unlocked.has(r)) : node.req.every(r => this.unlocked.has(r));
  }
  canAfford(node) { for (const k in node.cost) if ((this.scrap[k] || 0) < node.cost[k]) return false; return true; }
  buy(node) {
    if (this.unlocked.has(node.id) || !this.available(node) || !this.canAfford(node)) return false;
    for (const k in node.cost) this.scrap[k] -= node.cost[k];
    this.unlocked.add(node.id);
    return true;
  }
  addScrap(type, n) { this.scrap[type] = (this.scrap[type] || 0) + n; this.totalCollected += n; }
  stats() {
    const s = baseStats();
    for (const id of this.unlocked) {
      const n = SKILL_BY_ID[id]; if (!n) continue;
      if (n.apply) n.apply(s);
      if (n.weapon) s.weapons.push(n.weapon);
    }
    return s;
  }
  weaponsUnlocked() { return WEAPON_ORDER.filter(w => w === 'revolver' || [...this.unlocked].some(id => SKILL_BY_ID[id]?.weapon === w)); }
}

let G = null; // the running Game (set in game.js)

function circleHit(ax, ay, ar, bx, by, br) { const dx = bx - ax, dy = by - ay; const r = ar + br; return dx * dx + dy * dy < r * r; }

// ============================ ROCK ====================================
class Rock {
  constructor(x, y, r, seed) { this.x = x; this.y = y; this.r = r; this.sprite = makeRock(seed, r); this.glow = 0; }
  render(ctx, cam, t) {
    const sx = this.x - cam.x, sy = this.y - cam.y;
    if (sx < -80 || sy < -80 || sx > 720 || sy > 440) return;
    // foam ring where waves break on the rock
    ctx.strokeStyle = `rgba(230,246,255,${(0.35 + Math.sin(t * 3 + this.x) * 0.15).toFixed(2)})`; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(Math.round(sx), Math.round(sy + 2), Math.round(this.r + 3 + Math.sin(t * 2 + this.y) * 1.5), Math.round(this.r * 0.8 + 3), 0, 0, TAU); ctx.stroke();
    if (this.glow > 0) {
      ctx.strokeStyle = `rgba(255,220,80,${(this.glow * (0.6 + Math.sin(t * 12) * 0.3)).toFixed(2)})`; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.ellipse(Math.round(sx), Math.round(sy), Math.round(this.r + 8), Math.round(this.r * 0.8 + 8), 0, 0, TAU); ctx.stroke();
    }
    drawSprite(ctx, this.sprite, sx, sy);
  }
}

// ============================ PICKUP ==================================
class Pickup {
  constructor(x, y, type) { this.x = x; this.y = y; this.type = type; const a = rand(0, TAU), s = rand(40, 120); this.vx = Math.cos(a) * s; this.vy = Math.sin(a) * s; this.z = 0; this.vz = rand(60, 140); this.life = 30; this.ph = rand(0, TAU); this.dead = false; this.magnetized = false; }
  update(dt) {
    this.life -= dt; if (this.life <= 0) this.dead = true;
    const p = G.player;
    const d = dist(this.x, this.y, p.x, p.y);
    const mr = 42 * p.stats.magnet;
    if (d < mr && this.z <= 0) {

  damage(amt, sx, sy) {

  // ---- weapons ----------------------------------------------------------
  updateWeapons(dt, t) {
    const st = this.stats;

    this.target = G.nearestEnemy(this.x, this.y, 420, null, true);

    else if (this.target) { const lead = 0.15; this.aim = angleTo(this.x, this.y, this.target.x + (this.target.vx || 0) * lead, this.target.y + (this.target.vy || 0) * lead); wantFire = !G.holdFire; }

    if (this.rampage.active) {

        const a = (Math.random() < 0.6 && tgt) ? angleTo(this.x, this.y, tgt.x, tgt.y) + rand(-0.15, 0.15) : this.rampage.aim;

  fire(slot, wid) {

  // ---- render ------------------------------------------------------------

// ============================ ENEMIES ====================================
const ENEMY_TYPES = {
  dinghy: { hp: 30, speed: 100, turn: 2.6, radius: 12, behavior: 'chase', ram: 12, drops: { wood: 2, metal: 1 }, name: 'Fishing Dinghy', wake: 6 },
  netter: { hp: 48, speed: 85, turn: 2.2, radius: 13, behavior: 'orbit', orbit: 150, attackCd: 3.0, attack: 'net', ram: 8, drops: { wood: 2, tech: 1 }, name: 'Net Boat', wake: 7 },
  harpooner: { hp: 58, speed: 88, turn: 2.2, radius: 14, behavior: 'kite', orbit: 260, attackCd: 2.4, attack: 'harpoon', ram: 8, drops: { metal: 3, wood: 1 }, name: 'Harpooner', wake: 7 },
  speedboat: { hp: 55, speed: 215, turn: 3.2, radius: 15, behavior: 'strafe', attackCd: 0.18, attack: 'pistol', ram: 15, drops: { fuel: 3, metal: 1 }, name: 'Speedboat', wake: 9 },
  jetski: { hp: 22, speed: 200, turn: 5, radius: 8, behavior: 'zigzag', ram: 0, kamikaze: 22, drops: { fuel: 2 }, name: 'Jetski Bomber', wake: 4 },
  dynaboat: { hp: 62, speed: 78, turn: 2.0, radius: 14, behavior: 'orbit', orbit: 210, attackCd: 2.8, attack: 'dynamite', ram: 8, drops: { powder: 3, wood: 1 }, name: 'Dynamite Skiff', wake: 7 },
  trawler: { hp: 280, speed: 58, turn: 1.1, radius: 25, behavior: 'chase', attackCd: 2.2, attack: 'buckshot', attackRange: 230, ram: 25, drops: { metal: 4, wood: 4, tech: 2 }, name: 'Trawler', wake: 14, big: true },
  gunboat: { hp: 220, speed: 92, turn: 1.7, radius: 22, behavior: 'kite', orbit: 230, attackCd: 2.1, attack: 'turret', ram: 15, drops: { metal: 5, powder: 3, tech: 3 }, name: 'Gunboat', wake: 12, big: true },

class Enemy {
  constructor(type, x, y) {
    const c = this.cfg = ENEMY_TYPES[type]; this.type = type;
    this.x = x; this.y = y; this.vx = 0; this.vy = 0; this.hp = c.hp; this.maxHp = c.hp; this.radius = c.radius;
    this.angle = angleTo(x, y, G.player.x, G.player.y); this.speed = c.speed; this.throttle = 1;
    this.attackT = rand(0.5, c.attackCd || 2); this.state = 'approach'; this.stateT = rand(0, 2); this.orbitDir = Math.random() < 0.5 ? -1 : 1;
    this.dead = false; this.flash = 0; this.burn = 0; this.burnT = 0; this.kx = 0; this.ky = 0; this.ramCd = 0; this.bob = rand(0, TAU);
    this.wake = G.ocean.newWake(this, c.wake); this.sprite = SP.boats[type]; this.hurtSprite = SP.boatsHurt[type];

  }
  targetPos() { if (G.buoy && !G.buoy.dead) return G.buoy; return G.player; }
  update(dt, t) {
    const c = this.cfg, p = this.targetPos(); this.age += dt;

    if (this.burn > 0) { this.burn -= dt; this.burnT -= dt; if (this.burnT <= 0) { this.burnT = 0.5; this.hit(G.player.stats.burn * 0.5, 0, 0, null, true); G.particles.fire(this.x, this.y, 2); G.particles.smoke(this.x, this.y, 1); } }

        else { desired = toP; throttle = 0.9; if (this.stateT > 1.4) { this.state = 'approach'; this.stateT = 0; } }
        break;
      }
      case 'zigzag': { this.zig += dt * 7; desired = toP + Math.sin(this.zig) * 0.9 * Math.min(1, d / 120); break; }
    }
    // rock avoidance
    for (const r of G.rocks) {
      const dr = dist(this.x, this.y, r.x, r.y);
      if (dr < r.r + this.radius + 40) {
        const ar = angleTo(this.x, this.y, r.x, r.y), diff = angleDiff(this.angle, ar);
        if (Math.abs(diff) < 1.2) desired = this.angle - sign(diff) * 1.4 * (1 - (dr - r.r - this.radius) / 40);
        if (dr < r.r + this.radius) { const a = angleTo(r.x, r.y, this.x, this.y); this.x = r.x + Math.cos(a) * (r.r + this.radius); this.y = r.y + Math.sin(a) * (r.r + this.radius); if (Math.hypot(this.vx, this.vy) > 120) { this.hit(10, Math.cos(a) * 100, Math.sin(a) * 100, null); G.particles.splash(this.x, this.y, 1); } }
      }
    }
    // separation
    for (const e of G.enemies) { if (e === this || e.dead) continue; const de = dist(this.x, this.y, e.x, e.y), min = this.radius + e.radius + 4; if (de < min && de > 0.01) { const a = angleTo(e.x, e.y, this.x, this.y); const push = (min - de) * 4; this.kx += Math.cos(a) * push; this.ky += Math.sin(a) * push; } }

    const sp = this.speed * throttle * (this.slowT > 0 ? 0.5 : 1);
    this.vx = lerp(this.vx, Math.cos(this.angle) * sp, Math.min(1, dt * 2.5)); this.vy = lerp(this.vy, Math.sin(this.angle) * sp, Math.min(1, dt * 2.5));

    if (!last || dist(last.x, last.y, stx, sty) > 5) { this.wake.pts.push({ x: stx, y: sty, t }); G.ocean.addFoam(stx, sty, 0.05 + spd / 3000); }
    if (spd > 150 && Math.random() < 0.5) G.particles.spray(this.x + Math.cos(this.angle) * this.radius, this.y + Math.sin(this.angle) * this.radius, this.angle + Math.PI / 2 * (Math.random() < 0.5 ? 1 : -1), 1, 60);
    if (Math.abs(angleDiff(this.angle, desired)) > 0.8 && spd > 80 && Math.random() < 0.3) G.particles.spray(stx, sty, this.angle + Math.PI, 1, 50);
    // attacks

    if (!pl.dead && !pl.diving && dp < this.radius + 11) {
      if (c.kamikaze) { this.die(true); G.particles.explode(this.x, this.y, 44); pl.damage(c.kamikaze, this.x, this.y); return; }
      if (c.ram && this.ramCd <= 0 && spd > 30 && !pl.rolling) { this.ramCd = 1.0; pl.damage(c.ram, this.x, this.y); this.kx -= Math.cos(this.angle) * 80; this.ky -= Math.sin(this.angle) * 80; G.particles.splash((this.x + pl.x) / 2, (this.y + pl.y) / 2, 1.2); }
      else if (pl.rolling && !pl.stats.rollDmg) { const a = angleTo(pl.x, pl.y, this.x, this.y); this.kx += Math.cos(a) * 120; this.ky += Math.sin(a) * 120; }
    }
    // decoy buoy ram
    if (G.buoy && !G.buoy.dead && dist(this.x, this.y, G.buoy.x, G.buoy.y) < this.radius + 8 && this.ramCd <= 0) { this.ramCd = 0.8; G.buoy.hp -= 15; G.particles.splash(G.buoy.x, G.buoy.y, 0.8); }
    this.slowT -= dt;
  }
  updateAttack(dt, d, toP, p) {
    const c = this.cfg;

    G.particles.explode(this.x, this.y, 90, { debris: 30, oil: 2, debrisColors: ['#b57d3f', '#5b6f8c', '#f2c744'] });
    G.particles.blood(this.x, this.y, 8); G.ocean.splatBlood(this.x, this.y, 14, 60); G.shake(24);
    for (let i = 0; i < 3; i++) setTimeout(() => { if (G) { G.particles.explode(this.x + rand(-40, 40), this.y + rand(-30, 30), 50); G.particles.blood(this.x + rand(-30, 30), this.y + rand(-30, 30), 3); } }, 250 + i * 300);
    const drops = { metal: 14, wood: 12, fuel: 10, powder: 10, tech: 12 };
    for (const k in drops) for (let i = 0; i < drops[k]; i++) G.pickups.push(new Pickup(this.x, this.y, k));
    G.stats.kills++; G.onBossKilled();
  }
  render(ctx, cam, t) {
    if (this.dead) return;
    const sx = this.x - cam.x, sy = this.y - cam.y;
    const p2 = this.phase === 2;
    // telegraph line during windup
    if (this.state === 'windup') {
      const p = G.player, a = angleTo(this.x, this.y, p.x, p.y);
      ctx.setLineDash([6, 6]); ctx.lineDashOffset = -t * 60;
      ctx.strokeStyle = `rgba(255,${p2 ? 80 : 200},60,${(0.4 + Math.sin(t * 20) * 0.2).toFixed(2)})`; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(Math.round(sx), Math.round(sy)); ctx.lineTo(Math.round(sx + Math.cos(a) * 900), Math.round(sy + Math.sin(a) * 900)); ctx.stroke();
      ctx.setLineDash([]);
    }
    const bob = Math.sin(t * 2 + 1) * 1.5;
    const spr = this.flash > 0 ? SP.sharkHurt : this.stunned && Math.floor(t * 8) % 2 === 0 ? SP.sharkHurt : p2 ? SP.sharkRage : SP.shark;
    const thrash = this.state === 'windup' ? Math.sin(t * 40) * 0.06 : 0;
    // shark body undulates when swimming
    const spd = Math.hypot(this.vx, this.vy);
    const wig = Math.sin(t * (8 + spd / 40)) * Math.min(0.12, spd / 3000);
    drawSprite(ctx, spr, sx, sy + bob, this.angle + thrash + wig);
    if (this.stunned) {
      for (let i = 0; i < 3; i++) { const a = t * 5 + i * TAU / 3; drawSprite(ctx, SP.star, sx + Math.cos(a) * 22, sy - 26 + Math.sin(a) * 6); }
    }
    if (this.state === 'enrage') { ctx.strokeStyle = `rgba(255,60,40,${(0.6 + Math.sin(t * 30) * 0.3).toFixed(2)})`; ctx.lineWidth = 3; ctx.beginPath(); ctx.ellipse(Math.round(sx), Math.round(sy), 40 + this.stateT * 60, 30 + this.stateT * 45, 0, 0, TAU); ctx.stroke(); }
    if (this.sweep) { ctx.strokeStyle = `rgba(230,246,255,${Math.min(1, this.sweep.life * 2).toFixed(2)})`; ctx.lineWidth = 4; ctx.beginPath(); ctx.ellipse(Math.round(this.sweep.x - cam.x), Math.round(this.sweep.y - cam.y), Math.round(this.sweep.r), Math.round(this.sweep.r * 0.8), 0, 0, TAU); ctx.stroke(); }
  }
}

// ---- Spawn director: timed waves in Fisher Village -----------------------
const WAVES = [
  { t: 0, name: 'WAVE 1', sub: 'Fishing dinghies leave the pier', pool: { dinghy: 1 }, interval: 1.9, max: 6, burst: [['dinghy', 4]] },
  { t: 38, name: 'WAVE 2', sub: 'Net boats: absorb the nets! (E / Right-click)', pool: { dinghy: 2, netter: 1 }, interval: 1.7, max: 8, burst: [['netter', 3]] },
  { t: 78, name: 'WAVE 3', sub: 'Harpooners keep their distance', pool: { dinghy: 2, netter: 1, harpooner: 1.2 }, interval: 1.6, max: 9, burst: [['harpooner', 3]] },
  { t: 118, name: 'WAVE 4', sub: 'Speedboats on strafing runs', pool: { dinghy: 1.5, netter: 1, harpooner: 1, speedboat: 1.2 }, interval: 1.5, max: 10, burst: [['speedboat', 3]] },
  { t: 158, name: 'WAVE 5', sub: 'Jetski bombers! Roll away from them', pool: { dinghy: 1, netter: 1, harpooner: 1, speedboat: 1, jetski: 2 }, interval: 1.25, max: 12, burst: [['jetski', 5]] },
  { t: 198, name: 'WAVE 6', sub: 'Dynamite skiffs: absorb the dynamite', pool: { dinghy: 1, netter: 1, harpooner: 1, speedboat: 1, jetski: 1, dynaboat: 1.2 }, interval: 1.25, max: 12, burst: [['dynaboat', 3]] },
  { t: 238, name: 'WAVE 7', sub: 'The Trawler', pool: { dinghy: 1, netter: 1, harpooner: 1, speedboat: 1, jetski: 1, dynaboat: 1, trawler: 0.35 }, interval: 1.15, max: 13, burst: [['trawler', 1], ['dinghy', 4]] },
  { t: 280, name: 'WAVE 8', sub: 'Gunboats from the harbour', pool: { dinghy: 0.6, netter: 1, harpooner: 1, speedboat: 1, jetski: 1, dynaboat: 1, trawler: 0.4, gunboat: 0.5 }, interval: 1.05, max: 14, burst: [['gunboat', 2], ['speedboat', 2]] },
  { t: 322, boss: true, name: 'THE VILLAGE CHIEF', sub: 'He rides a shark. Bait his charge into the rocks!', pool: { dinghy: 1, jetski: 1 }, interval: 4.5, max: 4 },
];
class Director {
  constructor() { this.time = 0; this.waveIdx = -1; this.spawnT = 2; this.started = false; this.bossSpawned = false; }
  update(dt) {
    if (!this.started) return;
    this.time += dt;
    // advance wave
    while (this.waveIdx + 1 < WAVES.length && this.time >= WAVES[this.waveIdx + 1].t) {
      this.waveIdx++;
      const w = WAVES[this.waveIdx];
      G.banner(w.name, w.boss ? '#ff6161' : '#ffe48f', 2.4, w.sub);
      if (w.burst) for (const [type, n] of w.burst) this.spawnBurst(type, n);
      if (w.boss && !this.bossSpawned) { this.bossSpawned = true; G.spawnBoss(); }
    }
    const w = WAVES[Math.max(0, this.waveIdx)];
    if (!w) return;
    this.spawnT -= dt;
    const alive = G.enemies.filter(e => !e.dead).length;
    if (this.spawnT <= 0 && alive < w.max) {
      this.spawnT = w.interval * rand(0.7, 1.3);
      const type = this.pickType(w.pool);
      const pos = this.spawnPos();
      G.spawnEnemy(type, pos.x, pos.y);
    }
  }
  pickType(pool) { let tot = 0; for (const k in pool) tot += pool[k]; let r = Math.random() * tot; for (const k in pool) { r -= pool[k]; if (r <= 0) return k; } return Object.keys(pool)[0]; }
  spawnPos() {
    const p = G.player;
    for (let i = 0; i < 12; i++) {
      const a = rand(0, TAU), r = rand(400, 480);
      const x = p.x + Math.cos(a) * r, y = p.y + Math.sin(a) * r;
      if (x > 30 && x < G.ocean.W - 30 && y > G.ocean.shoreY + 10 && y < G.ocean.H - 30) return { x, y };
    }
    return { x: clamp(p.x + 450, 30, G.ocean.W - 30), y: clamp(p.y, G.ocean.shoreY + 40, G.ocean.H - 30) };
  }
  spawnBurst(type, n) {
    const base = rand(0, TAU);
    for (let i = 0; i < n; i++) {
      const a = base + (i - n / 2) * 0.25, r = 440;
      const p = G.player;
      const x = clamp(p.x + Math.cos(a) * r, 30, G.ocean.W - 30), y = clamp(p.y + Math.sin(a) * r, G.ocean.shoreY + 20, G.ocean.H - 30);
      G.spawnEnemy(type, x, y);
    }
  }
  currentWave() { return WAVES[Math.max(0, this.waveIdx)]; }
}

    ctx.fillStyle = sky; ctx.fillRect(0, 0, 640, 200);

    }

// ---- Game: state machine, world, render ---------------------------------
const WORLD_W = 3200, WORLD_H = 2400, SHORE_Y = 300;

class Game {
  constructor() {
    this.display = document.getElementById('screen'); this.dctx = this.display.getContext('2d');
    this.g = document.createElement('canvas'); this.g.width = 640; this.g.height = 360;
    this.ctx = this.g.getContext('2d'); this.ctx.imageSmoothingEnabled = false;
    Input.init(this.display);
    window.addEventListener('resize', () => this.resize()); this.resize();
    this.tree = new SkillTree();
    this.state = 'intro'; Intro.reset();
    this.firstRun = true; this.muted = false;
    this.t = 0; this.last = performance.now(); this.fps = 60;
    this.newRun();
    requestAnimationFrame(ts => this.frame(ts));
  }
  resize() {
    const ww = window.innerWidth, wh = window.innerHeight;
    let scale = Math.min(ww / 640, wh / 360);
    if (scale > 1) scale = Math.max(1, Math.floor(scale * 2) / 2);
    this.display.style.width = Math.floor(640 * scale) + 'px'; this.display.style.height = Math.floor(360 * scale) + 'px';
  }
  newRun() {
    G = this;
    this.ocean = new Ocean(WORLD_W, WORLD_H, SHORE_Y);
    this.particles = new Particles(this.ocean);
    this.enemies = []; this.projectiles = []; this.pickups = []; this.wrecks = []; this.rocks = [];
    this.boss = null; this.buoy = null; this.holdFire = false;
    this.stats = { kills: 0, shots: 0, absorbs: 0, damageDealt: 0, damageTaken: 0, scrapCollected: 0, bossCrashes: 0 };
    this.cam = { x: 0, y: 0 }; this.shakeAmt = 0; this.time = 0; this.endT = 0;
    this.pier = { x: WORLD_W / 2, y0: SHORE_Y - 24, y1: SHORE_Y + 130, w: 44 };
    // rocks
    const rng = new SeededRandom(4242 + (this.firstRun ? 0 : Math.floor(Math.random() * 1000)));
    let tries = 0;
    while (this.rocks.length < 34 && tries++ < 600) {
      const r = rng.range(16, 40), x = rng.range(80, WORLD_W - 80), y = rng.range(SHORE_Y + 160, WORLD_H - 80);
      if (dist(x, y, this.pier.x, SHORE_Y + 230) < 200) continue;
      if (this.rocks.some(o => dist(o.x, o.y, x, y) < o.r + r + 110)) continue;
      this.rocks.push(new Rock(x, y, r, rng.int(1, 99999)));
    }
    this.player = new Player(this.pier.x, SHORE_Y + 230, this.tree);
    this.director = new Director();
    this.fisherman = this.firstRun ? new Fisherman(this.pier.x, this.pier.y1 - 6) : null;
    this.cam.x = this.player.x - 320; this.cam.y = this.player.y - 200;
    UI.banner = null;
    if (!this.firstRun) { this.director.started = true; this.banner('REMATCH', '#ffe48f', 2, 'The village heard you were coming.'); }
  }
  // ---------------------------------------------------------- helpers
  spawnEnemy(type, x, y) { const e = new Enemy(type, x, y); this.enemies.push(e); this.particles.splash(x, y, 0.6); return e; }
  spawnBoss() {
    const p = this.player; let a = rand(0, TAU), x, y;
    for (let i = 0; i < 20; i++) { x = p.x + Math.cos(a) * 420; y = p.y + Math.sin(a) * 420; if (x > 60 && x < WORLD_W - 60 && y > SHORE_Y + 60 && y < WORLD_H - 60) break; a += 0.7; }
    this.boss = new Boss(clamp(x, 60, WORLD_W - 60), clamp(y, SHORE_Y + 60, WORLD_H - 60));
    Audio_.roar(); this.shake(10);
    for (let i = 0; i < 6; i++) this.particles.splash(this.boss.x + rand(-40, 40), this.boss.y + rand(-20, 20), 2);
  }
  nearestEnemy(x, y, range, exclude = null, includeBoss = false) {
    let best = null, bd = range * range;
    for (const e of this.enemies) { if (e.dead || e === exclude) continue; const dx = e.x - x, dy = e.y - y, d = dx * dx + dy * dy; if (d < bd) { bd = d; best = e; } }
    if (includeBoss && this.boss && !this.boss.dead && this.boss !== exclude) { const dx = this.boss.x - x, dy = this.boss.y - y, d = dx * dx + dy * dy; if (d < bd * 1.3) { best = this.boss; } }
    return best;
  }
  banner(text, color, dur = 2, sub = null) { UI.banner = { text, color, dur, sub, t: 0 }; }
  shake(n) { this.shakeAmt = Math.min(20, Math.max(this.shakeAmt, n)); }
  onFishermanShot() { this.holdFire = false; this.banner('FISHER VILLAGE', '#ff6161', 2.6, 'The otter has spoken. FIGHT!'); setTimeout(() => { if (this.director) this.director.started = true; }, 1200); this.state = 'play'; }
  onEnemyKilled(e) { const p = this.player; if (p.rampage.active && p.stats.rampFrenzy) p.rampage.t = Math.max(0, p.rampage.t - 0.6); }
  onBossKilled() { this.banner('THE CHIEF IS DOWN', '#ffe48f', 3); this.endT = 0; this.state = 'victory_wait'; }
  onPlayerDeath() { this.particles.blood(this.player.x, this.player.y, 4); this.particles.splash(this.player.x, this.player.y, 3); this.shake(16); this.endT = 0; this.state = 'dead_wait'; }
  // ---------------------------------------------------------- loop
  frame(ts) {
    let dt = (ts - this.last) / 1000; this.last = ts; if (dt > 1 / 20) dt = 1 / 20;
    this.fps = lerp(this.fps, 1 / Math.max(dt, 1e-3), 0.05);
    this.update(dt); this.render(); Input.endFrame();
    requestAnimationFrame(t2 => this.frame(t2));
  }
  update(dt) {
    if (Input.hit('KeyM')) { Audio_.muted = !Audio_.muted; }
    switch (this.state) {
      case 'intro': Intro.update(dt); if (Intro.done) { this.state = 'dialogue'; Dialogue.reset(); this.holdFire = true; } break;
      case 'dialogue':
        Dialogue.update(dt); this.updateWorld(dt);
        if (Dialogue.done && Input.mouse.clicked && this.fisherman && this.fisherman.alive && !Dialogue.shotFired) {
          Dialogue.shotFired = true; const p = this.player, f = this.fisherman;
          const a = angleTo(p.x, p.y, f.x, f.y - 8), d = dist(p.x, p.y, f.x, f.y - 8);
          p.aim = a; p.recoil.primary = 0.12; p.flash.primary = 0.08; Audio_.shot('revolver'); this.shake(4);
          this.projectiles.push(new Projectile({ x: p.x + Math.cos(a) * 10, y: p.y - 5 + Math.sin(a) * 10, vx: Math.cos(a) * 520, vy: Math.sin(a) * 520, life: d / 520 + 0.5, dmg: 999, owner: 'player', sprite: SP.bulletBig, size: 4, trail: true }));
          this.particles.shell(p.x, p.y - 6, a);
        }
        if (Input.hit('Tab')) { this.prevState = this.state; this.state = 'tree'; }
        break;
      case 'play':
        this.updateWorld(dt);
        if (Input.hit('Tab')) { this.prevState = 'play'; this.state = 'tree'; }
        else if (Input.hit('Escape') || Input.hit('KeyP')) this.state = 'paused';
        this.weaponKeys();
        break;
      case 'tree':
        UI.updateTree();
        if (Input.hit('Tab') || Input.hit('Escape')) this.state = this.prevState || 'play';
        break;
      case 'paused': if (Input.hit('Escape') || Input.hit('KeyP')) this.state = 'play'; if (Input.hit('Tab')) { this.prevState = 'play'; this.state = 'tree'; } break;
      case 'dead_wait': this.updateWorld(dt * 0.5, true); this.endT += dt; if (this.endT > 2) this.state = 'gameover'; break;
      case 'victory_wait': this.updateWorld(dt, false); this.endT += dt; if (this.endT > 3.5) this.state = 'victory'; break;
      case 'gameover': case 'victory':
        this.updateWorld(dt * 0.3, true);
        if (Input.hit('KeyR')) { this.firstRun = false; this.newRun(); this.state = 'play'; }
        if (Input.hit('Tab')) { this.prevState = this.state; this.state = 'tree'; }
        break;
    }
  }
  weaponKeys() {
    const wl = this.tree.weaponsUnlocked();
    for (let i = 0; i < wl.length && i < 9; i++) if (Input.hit('Digit' + (i + 1))) { this.tree.primary = wl[i]; Audio_.tone(500, 0.05, 'square', 0.1); }
    if (Input.wheel) { const i = wl.indexOf(this.tree.primary); this.tree.primary = wl[(i + Input.wheel + wl.length * 10) % wl.length]; }
  }
  updateWorld(dt, frozenPlayer = false) {
    this.time += dt; const t = this.time;
    this.ocean.update(dt, t);
    if (!frozenPlayer) this.player.update(dt, t);
    if (this.fisherman) this.fisherman.update(dt);
    this.director.update(dt);
    for (const e of this.enemies) e.update(dt, t);
    if (this.boss) this.boss.update(dt, t);
    for (const p of this.projectiles) p.update(dt);
    for (const p of this.pickups) p.update(dt);
    for (const w of this.wrecks) w.update(dt);
    if (this.buoy) { this.buoy.update(dt); if (this.buoy.dead) this.buoy = null; }
    this.particles.update(dt, (x, y) => this.ocean.flow(x, y));
    // rocks make foam
    for (const r of this.rocks) { if (Math.random() < 0.15) { const a = rand(0, TAU); this.ocean.addFoam(r.x + Math.cos(a) * (r.r + 4), r.y + Math.sin(a) * (r.r + 4) * 0.8, 0.12); } r.glow = Math.max(0, r.glow - dt * 2); }
    // cleanup
    this.enemies = this.enemies.filter(e => !e.dead);
    this.projectiles = this.projectiles.filter(p => !p.dead);
    this.pickups = this.pickups.filter(p => !p.dead);
    this.wrecks = this.wrecks.filter(w => !w.dead);
    // camera
    const p = this.player;
    // bias the camera toward the shore when close to it, so the village stays in view
    const shoreBias = Math.max(0, (SHORE_Y + 420 - p.y)) * 0.8;
    const tx = p.x - 320 + p.vx * 0.22, ty = p.y - 180 + p.vy * 0.22 - shoreBias;
    const k = 1 - Math.pow(0.002, dt);
    this.cam.x = lerp(this.cam.x, clamp(tx, 0, WORLD_W - 640), k); this.cam.y = lerp(this.cam.y, clamp(ty, 0, WORLD_H - 360), k);
    this.shakeAmt = Math.max(0, this.shakeAmt - dt * 30);
    if (UI.banner) { UI.banner.t += dt; if (UI.banner.t > UI.banner.dur) UI.banner = null; }
  }
  // ---------------------------------------------------------- render
  render() {
    const ctx = this.ctx, t = this.time;
    if (this.state === 'intro') { Intro.render(ctx); this.blit(); return; }
    const cam = { x: Math.round(this.cam.x + (this.shakeAmt ? rand(-this.shakeAmt, this.shakeAmt) : 0)), y: Math.round(this.cam.y + (this.shakeAmt ? rand(-this.shakeAmt, this.shakeAmt) : 0)) };
    this.ocean.render(ctx, cam, t);
    this.renderVillage(ctx, cam, t);
    // underwater shadows
    for (const e of this.enemies) this.ocean.shadow(ctx, cam, e.x, e.y, e.radius * 2.2, e.radius * 1.2, t);
    if (this.boss && !this.boss.dead) this.ocean.shadow(ctx, cam, this.boss.x, this.boss.y, 70, 26, t, 1.3);
    if (!this.player.dead) this.ocean.shadow(ctx, cam, this.player.x, this.player.y, 34, 18, t, this.player.diving ? 1.6 : 1);
    for (const w of this.wrecks) this.ocean.shadow(ctx, cam, w.x, w.y, w.radius * 2, w.radius, t, 0.6);
    this.ocean.renderTempCurrents(ctx, cam, t);
    for (const r of this.rocks) r.render(ctx, cam, t);
    this.ocean.renderWakes(ctx, cam, t);
    this.particles.renderUnder(ctx, cam);
    for (const w of this.wrecks) w.render(ctx, cam);
    for (const p of this.pickups) p.render(ctx, cam, t);
    if (this.buoy) this.buoy.render(ctx, cam, t);
    if (this.player.diving) this.player.render(ctx, cam, t);
    for (const e of this.enemies) e.render(ctx, cam, t);
    if (this.boss) this.boss.render(ctx, cam, t);
    if (this.fisherman) this.fisherman.render(ctx, cam, t);
    if (!this.player.diving) this.player.render(ctx, cam, t);
    for (const p of this.projectiles) p.render(ctx, cam);
    this.particles.render(ctx, cam);
    this.ocean.renderRipples(ctx, cam);
    // overlays
    if (this.state === 'dialogue') Dialogue.render(ctx, cam);
    if (this.state !== 'gameover' && this.state !== 'victory' && this.state !== 'tree') UI.drawHUD(ctx, t);
    if (this.state === 'tree') UI.drawTree(ctx, t);
    if (this.state === 'paused') { ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, 0, 640, 360); pixelText(ctx, 'PAUSED', 320, 150, 20, '#fff', 'center'); pixelText(ctx, '[ESC] resume   [TAB] workshop   [M] mute', 320, 180, 8, '#aab', 'center'); this.drawControls(ctx, 200); }
    if (this.state === 'gameover') drawEndScreen(ctx, t, false);
    if (this.state === 'victory') drawEndScreen(ctx, t, true);
    if (this.state === 'dead_wait') { ctx.fillStyle = `rgba(120,10,20,${Math.min(0.7, this.endT * 0.4).toFixed(2)})`; ctx.fillRect(0, 0, 640, 360); }
    if (this.state === 'dialogue' && !this.director.started) { /* controls hint in dialogue */ }
    if (Audio_.muted) pixelText(ctx, 'MUTED [M]', 634, 350, 6, '#889', 'right');
    this.blit();
  }
  drawControls(ctx, y) {
    const lines = ['WASD / arrows: swim', 'SPACE: Manatee Roll (dodge, invulnerable)', 'E / right-click: ABSORB incoming attacks -> fills Otter Rampage', 'Q: unleash OTTER RAMPAGE when the meter is full', 'Left mouse: aim manually (otter auto-aims otherwise)', '1-7 / wheel: switch weapon   TAB: Workshop (skill tree)'];
    lines.forEach((l, i) => pixelText(ctx, l, 320, y + i * 11, 7, '#dde', 'center'));
  }
  renderVillage(ctx, cam, t) {
    if (cam.y > SHORE_Y + 200) return;
    const ox = -cam.x, oy = -cam.y;
    // huts, props along the shore
    const huts = [[-560, -110, SP.hut], [-420, -80, SP.hutRed], [-300, -130, SP.hut], [-160, -70, SP.hutGreen], [120, -90, SP.hut], [260, -120, SP.hutRed], [420, -75, SP.hut], [560, -115, SP.hutGreen], [-900, -100, SP.hut], [900, -95, SP.hutRed]];
    for (const [dx, dy, s] of huts) drawSprite(ctx, s, this.pier.x + dx + ox, SHORE_Y + dy + oy);
    const props = [[-500, -40, SP.barrel], [-490, -34, SP.barrel], [-80, -30, SP.crate], [-70, -30, SP.crate], [200, -40, SP.barrel], [340, -30, SP.crate], [60, -50, SP.barrel]];
    for (const [dx, dy, s] of props) drawSprite(ctx, s, this.pier.x + dx + ox, SHORE_Y + dy + oy);
    // trees on the grass
    for (let i = 0; i < 14; i++) { const x = (i * 263 + 100) % WORLD_W, y = SHORE_Y - 150 - (i * 37) % 60; const sx = x + ox, sy = y + oy; if (sx < -30 || sx > 670) continue; ctx.fillStyle = '#43281a'; ctx.fillRect(Math.round(sx) - 1, Math.round(sy), 3, 10); ctx.fillStyle = '#2f9e5b'; ctx.beginPath(); ctx.arc(Math.round(sx), Math.round(sy) - 3, 9, 0, TAU); ctx.fill(); ctx.fillStyle = '#6fd88e'; ctx.fillRect(Math.round(sx) - 4, Math.round(sy) - 8, 3, 2); }
    // piers
    for (const px of [this.pier.x, this.pier.x - 700, this.pier.x + 700]) {
      const y0 = this.pier.y0, y1 = px === this.pier.x ? this.pier.y1 : SHORE_Y + 70, w = px === this.pier.x ? this.pier.w : 28;
      const sx = Math.round(px - w / 2 + ox), sy = Math.round(y0 + oy);
      if (sx > 700 || sx + w < -20) continue;
      // posts + shadows on water
      ctx.fillStyle = 'rgba(6,18,48,0.35)'; ctx.fillRect(sx + 3, sy + 4, w, y1 - y0);
      ctx.fillStyle = '#8f5c2c'; ctx.fillRect(sx, sy, w, y1 - y0);
      ctx.fillStyle = '#5c3a1c'; for (let y = 0; y < y1 - y0; y += 6) ctx.fillRect(sx, sy + y, w, 1);
      ctx.fillStyle = '#b57d3f'; for (let y = 2; y < y1 - y0; y += 6) ctx.fillRect(sx + 2, sy + y, w - 4, 1);
      ctx.fillStyle = '#43281a'; for (let y = 4; y < y1 - y0; y += 24) { ctx.fillRect(sx - 2, sy + y, 4, 6); ctx.fillRect(sx + w - 2, sy + y, 4, 6); }
      ctx.fillStyle = '#14141c'; ctx.fillRect(sx - 1, sy, 1, y1 - y0); ctx.fillRect(sx + w, sy, 1, y1 - y0); ctx.fillRect(sx - 1, sy + (y1 - y0), w + 2, 1);
      // foam around posts
      ctx.fillStyle = `rgba(230,246,255,${(0.4 + Math.sin(t * 3 + px) * 0.2).toFixed(2)})`; ctx.fillRect(sx - 3, sy + (y1 - y0) + 1, w + 6, 2);
    }
    // sign
    pixelText(ctx, 'FISHER VILLAGE', Math.round(this.pier.x + ox), Math.round(SHORE_Y - 175 + oy), 8, '#ffe48f', 'center');
  }
  blit() {
    this.dctx.imageSmoothingEnabled = false;
    this.dctx.drawImage(this.g, 0, 0, this.display.width, this.display.height);
  }
}
window.addEventListener('load', () => { window.game = new Game(); });

</script>
